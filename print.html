  <style>
    .print-shell{width:min(1180px,calc(100% - 32px));margin:0 auto;padding:36px 0 80px;display:grid;gap:18px}.print-toolbar{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:16px;display:grid;gap:12px}.toolbar-row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{min-height:44px;border:1.5px solid var(--line);border-radius:999px;background:rgba(255,255,255,.72);color:var(--accent-deep);font:inherit;font-weight:900;padding:10px 16px;cursor:pointer}.primary{border:none;color:#fff;background:linear-gradient(135deg,var(--accent),var(--accent-light))}.cover-edit{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.cover-edit label{display:grid;gap:5px;font-size:.82rem;font-weight:900;color:var(--accent-deep)}.cover-edit input,.cover-edit textarea{min-height:42px;padding:10px 12px}.visibility-panel{border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px}.visibility-list{display:flex;gap:8px;flex-wrap:wrap}.visibility-toggle{min-height:36px;border:1px solid var(--line);border-radius:999px;background:rgba(255,255,255,.72);color:var(--accent-deep);font:inherit;font-size:.82rem;font-weight:800;padding:7px 12px;cursor:pointer}.visibility-toggle.is-hidden{opacity:.62;text-decoration:line-through}.book{background:#fff;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.12);overflow:hidden}.cover{min-height:330px;padding:48px;background:linear-gradient(135deg,var(--bg),var(--panel));background-size:cover;background-position:center;display:grid;align-content:center;gap:14px;position:relative}.cover::before{content:"";position:absolute;inset:0;background:rgba(255,255,255,.72)}.cover>*{position:relative}.cover h1{font-size:44px;margin:0;color:var(--accent-deep)}.page{padding:30px 38px;border-top:1px solid #eee}.page h2{color:var(--accent-deep);margin:0 0 14px}.print-map-panels{display:grid;gap:18px}.print-map-card{border:1px solid #ddd;border-radius:12px;overflow:hidden;background:#fff}.print-map-card .map-head{padding:12px 14px;border-bottom:1px solid #eee}.print-map-card .leaflet-map{height:430px;border-radius:0}.spot-print-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}.spot-print-card{border:1px solid #eee;border-radius:14px;overflow:hidden;background:#fff;display:grid}.spot-photo{height:180px;border:0;background:linear-gradient(135deg,var(--accent-soft),#f7f7f7);display:grid;place-items:center;color:var(--muted);font:inherit;font-weight:900;overflow:hidden;cursor:pointer;text-align:center}.spot-photo.is-drag{outline:3px solid var(--accent);outline-offset:-6px}.spot-photo img{width:100%;height:100%;object-fit:cover}.spot-print-body{padding:14px;display:grid;gap:9px}.spot-print-body h3{margin:0}.hours-summary{display:flex;gap:6px;flex-wrap:wrap}.hours-chip{border:1px solid #e5e5e5;border-radius:999px;padding:4px 9px;font-size:.78rem;color:var(--muted);background:#fafafa}.hours-chip.closed{color:#9a4b4b;background:#fff6f6}.edit-field{display:grid;gap:4px;font-size:.82rem;font-weight:900;color:var(--accent-deep)}.edit-field textarea{font:inherit;border:1px solid #ddd;border-radius:9px;padding:8px 10px;min-height:72px;resize:vertical}.photo-adjust{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}.row{display:grid;grid-template-columns:120px 1fr auto;gap:10px;padding:8px 0;border-bottom:1px solid #eee;align-items:start}.time{color:var(--accent-deep);font-weight:900}.muted{color:var(--muted)}.photo-input,.cover-file{display:none}.packing-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.packing-card{border:1px solid #eee;border-radius:12px;padding:14px}.packing-card h3{margin:0 0 8px}.packing-item{display:flex;gap:8px;padding:3px 0}.packing-item.is-done{color:var(--muted);text-decoration:line-through}@media(max-width:520px){.print-toolbar .btn{width:100%}.page{padding:24px 20px}.cover{padding:36px 24px}.cover h1{font-size:34px}.row{grid-template-columns:1fr}.time{width:auto}}.back-cover{align-content:center;justify-items:center;text-align:center;min-height:280px;border-top:1px solid #eee}.back-cover-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:200px}.back-cover-empty .back-cover-inner{background:rgba(255,255,255,.55);border:2px dashed rgba(166,97,54,.25);border-radius:16px;padding:32px 40px}.back-cover-hint{color:var(--muted);font-size:.88rem;font-weight:600}@media print{body{background:#fff}.print-toolbar,.hamburger-btn,.drawer-backdrop,.side-drawer,.page-nav,.page-nav-bar,.edit-field,.photo-input,.cover-file,.visibility-panel{display:none!important}.print-shell{width:100%;padding:0}.book{box-shadow:none;border-radius:0}.page{break-inside:avoid}.cover{break-after:page}.back-cover{break-before:page}.spot-print-card,.packing-card,.print-map-card{break-inside:avoid}.print-map-card .leaflet-map{height:460px}}

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script>
    const LISTS_KEY="spot-map-lists.v1",SCHEDULE_KEY="spot-map-schedule.v1",SETTINGS_KEY="spot-map-settings.v1",COVER_KEY="trip-print-cover.v1",PACKING_KEY="trip-packing-list.v1";
    const DAY_NAMES={sun:"日",mon:"月",tue:"火",wed:"水",thu:"木",fri:"金",sat:"土"};
    const DAY_ORDER=["sun","mon","tue","wed","thu","fri","sat"],WEEKDAYS=["日","月","火","水","木","金","土"];
    const RELATIVE_CLUSTER_THRESHOLD=0.12,DETAIL_PADDING_RATIO=0.35,OVERVIEW_PADDING_RATIO=0.15,LABEL_GAP=24,LABEL_PIN_PAD=20,LABEL_EDGE_PAD=8,LABEL_MIN_W=92,LABEL_MAX_W=520,LABEL_CHAR_W=15,LABEL_H=38,LABEL_DIRS=["right","left","top","bottom"],LABEL_DISTANCES=[24,54,84,114,154,204,264,334];
    const TILE_STYLES={ "osm-bright":{url:"https://tile.openstreetmap.jp/styles/osm-bright/{z}/{x}/{y}.png",options:{maxZoom:18},attribution:"&copy; OpenStreetMap contributors"},"osm-standard":{url:"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",options:{maxZoom:19},attribution:"&copy; OpenStreetMap contributors"},"carto-light":{url:"https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",options:{maxZoom:20,subdomains:"abcd"},attribution:"&copy; OpenStreetMap &copy; CARTO"},"carto-dark":{url:"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",options:{maxZoom:20,subdomains:"abcd"},attribution:"&copy; OpenStreetMap &copy; CARTO"},"esri-satellite":{url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",options:{maxZoom:17},attribution:"Tiles &copy; Esri"}};
    const BASE_PACKING=[{id:"basic",title:"基本",items:["財布","スマートフォン","充電器","身分証","常備薬","免許証","爪切り","ティッシュ","髭剃り"]},{id:"clothes",title:"衣類",items:["着替え","下着","靴下","羽織もの"]},{id:"travel",title:"旅先",items:["チケット","予約確認","雨具","エコバッグ"]},{id:"conditional",title:"条件付き",items:["セキュリティポーチ","海外SIM","現地通貨","変換プラグ"]}];
    let mapInstances=[];
    function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
    function parseJson(key,fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch{return fallback}}
    function getContext(){const listsData=parseJson(LISTS_KEY,{});const list=listsData.lists?.find(l=>l.id===listsData.activeListId)||listsData.lists?.[0]||{id:"default",name:"旅のしおり",spots:[]};const schedules=parseJson(SCHEDULE_KEY,{});const sched=schedules[list.id]||{};const cover=(parseJson(COVER_KEY,{})[list.id])||{};return{listsData,list,sched,cover}}
    function saveLists(listsData){localStorage.setItem(LISTS_KEY,JSON.stringify(listsData))}
    function saveCover(listId,cover){const all=parseJson(COVER_KEY,{});all[listId]=cover;localStorage.setItem(COVER_KEY,JSON.stringify(all))}
    function updateSpot(spotId,fields,rerender=false){const ctx=getContext();const spots=ctx.list.spots||[];const i=spots.findIndex(s=>s.id===spotId);if(i<0)return;spots[i]={...spots[i],...fields};ctx.list.spots=spots;saveLists(ctx.listsData);if(rerender)render()}
    function readImageFile(file,spotId){if(!file||!file.type.startsWith("image/"))return;const reader=new FileReader();reader.onload=()=>updateSpot(spotId,{photoUrl:reader.result,photoX:50,photoY:50},true);reader.readAsDataURL(file)}
    function readCoverImage(file){if(!file||!file.type.startsWith("image/"))return;const reader=new FileReader();reader.onload=()=>{const{list,cover}=getContext();saveCover(list.id,{...cover,coverImage:reader.result});render()};reader.readAsDataURL(file)}
    function readBackCoverImage(file){if(!file||!file.type.startsWith("image/"))return;const reader=new FileReader();reader.onload=()=>{const{list,cover}=getContext();saveCover(list.id,{...cover,backCoverImage:reader.result});render()};reader.readAsDataURL(file)}
    function compactDayLabels(days){const labels=days.map(d=>DAY_NAMES[d]||d);if(labels.length===7)return"全日";const idxs=days.map(d=>DAY_ORDER.indexOf(d)).filter(i=>i>=0).sort((a,b)=>a-b);if(idxs.length===days.length&&idxs.every((v,i)=>i===0||v===idxs[i-1]+1)&&idxs.length>=3)return`${DAY_NAMES[DAY_ORDER[idxs[0]]]}-${DAY_NAMES[DAY_ORDER[idxs[idxs.length-1]]]}`;return labels.join("・")}
    function businessHoursChips(hours){if(!hours||typeof hours!=="object")return"";const groups=new Map();DAY_ORDER.forEach(day=>{const value=hours[day];if(!value)return;const key=value==="closed"?"休み":value;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(day)});return [...groups.entries()].map(([value,days])=>`<span class="hours-chip ${value==="休み"?"closed":""}">${compactDayLabels(days)} ${esc(value)}</span>`).join("")}
    function toMin(value,fallback=540){const m=String(value||"").match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):fallback}
    function toTime(min){const h=Math.floor(min/60)%24;const m=min%60;return`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`}
    function formatDayTitle(day,index){const raw=day.date||"";const m=String(raw).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return`[${index+1}日目] ${esc(raw)}`;const date=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));return`[${index+1}日目] ${Number(m[2])}/${Number(m[3])}(${WEEKDAYS[date.getDay()]})`}
    function scheduleRows(day,idx,spots,sched){let cursor=toMin(idx===0?sched.tripMeetTime:day.startTime,540);return(day.entries||[]).map((en,i)=>{const sp=spots.find(s=>s.id===en.spotId);if(en.time)cursor=toMin(en.time,cursor);else if(i>0)cursor+=Number(day.travelMinutes)||15;const start=cursor;const end=start+Math.max(0,Number(sp?.defaultStayMinutes)||60);cursor=end;return{start:toTime(start),end:toTime(end),name:sp?.name||"スポット",note:en.note||""}})}
    function normalizePackingGroups(groups){return (groups||[]).map((g,gi)=>({id:g.id||`group-${gi}`,title:g.title||g.cat||"持ち物",items:(g.items||[]).map((item,ii)=>typeof item==="string"?{id:`${g.id||gi}-${ii}`,text:item,done:false}:{id:item.id||`${g.id||gi}-${ii}`,text:item.text||item.name||"",done:!!item.done}).filter(item=>item.text)}))}
    function normalizePackingTitle(title){return title==="旅行"||title==="旅行先"?"旅先":title}
    function packingGroups(){const defaults=normalizePackingGroups(BASE_PACKING).filter(g=>g.id!=="conditional").map(g=>({...g,title:normalizePackingTitle(g.title)}));const saved=parseJson(PACKING_KEY,null);const current=normalizePackingGroups(saved?.groups||saved).filter(g=>g.id!=="conditional"&&normalizePackingTitle(g.title)!=="条件付き").map(g=>({...g,title:normalizePackingTitle(g.title)}));if(!current.length)return defaults;const byId=new Map(current.map(g=>[g.id,g]));defaults.forEach(def=>{const group=byId.get(def.id);if(!group){current.push(def);return}const seen=new Set(group.items.map(item=>item.text));def.items.forEach(item=>{if(!seen.has(item.text))group.items.push(item)})});return current}
    function distanceKm(a,b){const R=6371,dLat=(b.lat-a.lat)*Math.PI/180,dLng=(b.lng-a.lng)*Math.PI/180,lat1=a.lat*Math.PI/180,lat2=b.lat*Math.PI/180;const h=Math.sin(dLat/2)**2+Math.cos(lat1)*Math.cos(lat2)*Math.sin(dLng/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
    function rawDiagonalKm(points){if(points.length<=1)return 0;const lats=points.map(p=>p.lat),lngs=points.map(p=>p.lng);return distanceKm({lat:Math.min(...lats),lng:Math.min(...lngs)},{lat:Math.max(...lats),lng:Math.max(...lngs)})}
    function boundsFromPoints(points,padding,minSpan=0.02){const lats=points.map(p=>p.lat),lngs=points.map(p=>p.lng);let s=Math.min(...lats),n=Math.max(...lats),w=Math.min(...lngs),e=Math.max(...lngs);const latSpan=Math.max(n-s,minSpan),lngSpan=Math.max(e-w,minSpan);return[[s-latSpan*padding,w-lngSpan*padding],[n+latSpan*padding,e+lngSpan*padding]]}
    function centerFromPoints(points){const sum=points.reduce((a,p)=>({lat:a.lat+p.lat,lng:a.lng+p.lng}),{lat:0,lng:0});return{lat:sum.lat/points.length,lng:sum.lng/points.length}}
    function findRelativeClusters(points,thresholdKm){const visited=new Set(),clusters=[];for(const point of points){if(visited.has(point.id))continue;const queue=[point],cluster=[];visited.add(point.id);while(queue.length){const current=queue.shift();cluster.push(current);points.forEach(candidate=>{if(visited.has(candidate.id))return;if(distanceKm(current,candidate)<=thresholdKm){visited.add(candidate.id);queue.push(candidate)}})}clusters.push(cluster)}return clusters.sort((a,b)=>b.length-a.length)}
    function buildMapGroups(points){const clusters=findRelativeClusters(points,rawDiagonalKm(points)*RELATIVE_CLUSTER_THRESHOLD),hasClusters=clusters.some(c=>c.length>=2),groups=[];if(hasClusters){groups.push({kind:"overview",title:"全体図",overviewItems:clusters.map(c=>c.length===1?{type:"single",point:c[0]}:{type:"cluster",points:c,bounds:boundsFromPoints(c,DETAIL_PADDING_RATIO),center:centerFromPoints(c)}),bounds:boundsFromPoints(points,OVERVIEW_PADDING_RATIO)});clusters.filter(c=>c.length>=2).forEach(c=>groups.push({kind:"detail",title:`${c.map(p=>p.name).join(" / ")} の拡大図`,points:c,bounds:boundsFromPoints(c,DETAIL_PADDING_RATIO,0.001)}))}else{groups.push({kind:"detail",title:"全体図",points,bounds:boundsFromPoints(points,OVERVIEW_PADDING_RATIO)})}return groups}
    function estimateLabelSize(point){return{w:Math.min(LABEL_MAX_W,Math.max(LABEL_MIN_W,String(point?.name||"").length*LABEL_CHAR_W+22)),h:LABEL_H}}
    function pointPx(map,point){const p=map.latLngToLayerPoint([point.lat,point.lng]);return{x:p.x,y:p.y}}
    function labelRect(px,dir,point,distance=LABEL_GAP,size=estimateLabelSize(point)){const{w,h}=size,g=distance;if(dir==="right")return{x1:px.x+g,x2:px.x+g+w,y1:px.y-h/2,y2:px.y+h/2};if(dir==="left")return{x1:px.x-g-w,x2:px.x-g,y1:px.y-h/2,y2:px.y+h/2};if(dir==="top")return{x1:px.x-w/2,x2:px.x+w/2,y1:px.y-g-h,y2:px.y-g};return{x1:px.x-w/2,x2:px.x+w/2,y1:px.y+g,y2:px.y+g+h}}
    function pinRect(px){const p=LABEL_PIN_PAD;return{x1:px.x-p,x2:px.x+p,y1:px.y-p,y2:px.y+p}}
    function overlap(a,b){return a.x1<b.x2&&a.x2>b.x1&&a.y1<b.y2&&a.y2>b.y1}
    function overlapArea(a,b){return overlap(a,b)?(Math.min(a.x2,b.x2)-Math.max(a.x1,b.x1))*(Math.min(a.y2,b.y2)-Math.max(a.y1,b.y1)):0}
    function viewRect(map){const size=map.getSize();return{x1:LABEL_EDGE_PAD,x2:size.x-LABEL_EDGE_PAD,y1:LABEL_EDGE_PAD,y2:size.y-LABEL_EDGE_PAD}}
    function outArea(r,b){const iw=Math.max(0,Math.min(r.x2,b.x2)-Math.max(r.x1,b.x1)),ih=Math.max(0,Math.min(r.y2,b.y2)-Math.max(r.y1,b.y1));return Math.max(0,(r.x2-r.x1)*(r.y2-r.y1)-iw*ih)}
    function chooseLabelPlacements(map,points,options={}){const bounds=viewRect(map),placed=[...points.map(p=>pinRect(pointPx(map,p))),...(options.initialRects||[])],result=new Map(),dirs=options.preferredDirs||LABEL_DIRS,distances=options.distances||LABEL_DISTANCES,sizeFor=options.sizeFor||estimateLabelSize;points.forEach(point=>{const px=pointPx(map,point),size=sizeFor(point);for(const dir of dirs){for(const distance of distances){const r=labelRect(px,dir,point,distance,size),overlap=placed.reduce((sum,b)=>sum+overlapArea(r,b),0),edge=outArea(r,bounds);if(overlap===0&&edge===0){placed.push(r);result.set(point.id,{direction:dir,distance,rect:r});return}}}});return result}
    function markerRole(p){const roles=Array.isArray(p.spotRoles)?p.spotRoles:[];if(roles.includes("meet")&&roles.includes("dismiss"))return"meet-dismiss";return roles[0]||p.spotRole||""}
    function markerClass(p){const role=markerRole(p);if(role==="meet-dismiss")return"map-pin-meet-dismiss";if(role==="meet")return"map-pin-meet";if(role==="dismiss")return"map-pin-dismiss";return`map-pin-${p.spotCategory||"other"}`}
    function markerIconText(p){const role=markerRole(p);if(role==="meet-dismiss")return"🔁";if(role==="meet")return"🤝";if(role==="dismiss")return"👋";return{airport:"✈",station:"🚉",restaurant:"🍽",tourist:"📸",hotel:"🏨",shopping:"🛍",other:"📍"}[p.spotCategory]||"📍"}
    function markerHtml(p){return`<div class="map-pin ${markerClass(p)}">${markerIconText(p)}</div>`}
    function addMarker(map,p,placement=null){const icon=L.divIcon({className:"",html:markerHtml(p),iconSize:[28,28],iconAnchor:[14,14]}),marker=L.marker([p.lat,p.lng],{icon}).addTo(map);if(!placement)return;const distance=placement.distance,offsets={right:[distance,0],left:[-distance,0],top:[0,-distance],bottom:[0,distance]};marker.bindTooltip(esc(p.name),{permanent:true,direction:placement.direction,offset:offsets[placement.direction]||[16,0],className:`spot-label spot-label-gap-${distance}`})}
    function renderOverviewLayer(map,items){const singles=items.filter(i=>i.type==="single").map(i=>i.point),allRects=items.flatMap(i=>i.type==="single"?[pinRect(pointPx(map,i.point))]:i.points.map(p=>pinRect(pointPx(map,p))));const placements=chooseLabelPlacements(map,singles,{initialRects:allRects,preferredDirs:items.some(i=>i.type!=="single")?["left","bottom","top","right"]:LABEL_DIRS,distances:[34,64,94,124,154,204,264]});items.forEach(item=>{if(item.type==="single"){addMarker(map,item.point,placements.get(item.point.id));return}L.rectangle(item.bounds,{color:"#ff7a45",weight:2,fillOpacity:.06,dashArray:"6 6"}).addTo(map);item.points.forEach(p=>{const icon=L.divIcon({className:"",html:`<div class="map-pin map-pin-cluster-member ${markerClass(p)}"></div>`,iconSize:[16,16],iconAnchor:[8,8]});L.marker([p.lat,p.lng],{icon}).addTo(map)})})}
    function renderDetailLayer(map,points){const placements=chooseLabelPlacements(map,points);points.forEach(p=>addMarker(map,p,placements.get(p.id)))}
    function renderMaps(spots){mapInstances.forEach(m=>{try{m.remove()}catch{}});mapInstances=[];const wrap=document.getElementById("printMapPanels"),points=spots.filter(s=>Number.isFinite(Number(s.lat))&&Number.isFinite(Number(s.lng))).map(s=>({...s,lat:Number(s.lat),lng:Number(s.lng)}));if(!points.length){wrap.innerHTML="<p class='muted'>座標のあるスポットを追加すると地図が入ります。</p>";return}wrap.innerHTML="";const settings=parseJson(SETTINGS_KEY,{}),tile=TILE_STYLES[settings.mapStyle]||TILE_STYLES["osm-bright"];buildMapGroups(points).forEach((group,index)=>{const card=document.createElement("article");card.className="print-map-card";card.innerHTML=`<div class="map-head"><div><p class="map-number">Map ${index+1}</p><h3>${esc(group.title)}</h3></div></div><div class="leaflet-map"></div>`;wrap.appendChild(card);const el=card.querySelector(".leaflet-map");requestAnimationFrame(()=>requestAnimationFrame(()=>{const map=L.map(el,{zoomControl:true,scrollWheelZoom:false,preferCanvas:true});mapInstances.push(map);L.tileLayer(tile.url,{...tile.options,attribution:tile.attribution,updateWhenIdle:false,keepBuffer:4}).addTo(map);L.control.scale({imperial:false,position:"bottomleft"}).addTo(map);map.invalidateSize(true);map.fitBounds(group.bounds,{padding:[30,30]});group.kind==="overview"?renderOverviewLayer(map,group.overviewItems):renderDetailLayer(map,group.points);setTimeout(()=>{map.invalidateSize(true);map.fitBounds(group.bounds,{padding:[30,30]})},300);setTimeout(()=>{map.invalidateSize(true)},900)}))})}
    function bindEditors(){document.querySelectorAll("[data-spot-id][data-field]").forEach(input=>{input.addEventListener("change",e=>updateSpot(e.target.dataset.spotId,{[e.target.dataset.field]:e.target.value},true));input.addEventListener("input",e=>{if(e.target.type==="range"){const card=e.target.closest(".spot-print-card"),x=Number(card?.querySelector('[data-field="photoX"]')?.value)||50,y=Number(card?.querySelector('[data-field="photoY"]')?.value)||50;updateSpot(e.target.dataset.spotId,{photoX:x,photoY:y});const img=card?.querySelector(".spot-photo img");if(img)img.style.objectPosition=`${x}% ${y}%`}})});document.querySelectorAll(".spot-photo").forEach(btn=>{const id=btn.dataset.spotId,input=document.querySelector(`.photo-input[data-spot-id="${CSS.escape(id)}"]`);btn.addEventListener("click",()=>input?.click());btn.addEventListener("dragover",e=>{e.preventDefault();btn.classList.add("is-drag")});btn.addEventListener("dragleave",()=>btn.classList.remove("is-drag"));btn.addEventListener("drop",e=>{e.preventDefault();btn.classList.remove("is-drag");readImageFile(e.dataTransfer.files?.[0],id)});input?.addEventListener("change",e=>readImageFile(e.target.files?.[0],id))})}
    function renderVisibilityControls(spots){const box=document.getElementById("visibilityList");box.innerHTML=spots.length?"":"<span class='muted'>スポット未登録</span>";spots.forEach((spot,i)=>{const btn=document.createElement("button");btn.type="button";btn.className=`visibility-toggle ${spot.printHidden?"is-hidden":""}`;btn.textContent=`${i+1}. ${spot.name} ${spot.printHidden?"表示する":"非表示"}`;btn.onclick=()=>updateSpot(spot.id,{printHidden:!spot.printHidden},true);box.appendChild(btn)})}
    function initCoverInputs(ctx){const title=document.getElementById("coverTitleInput"),sub=document.getElementById("coverSubtitleInput");title.value=ctx.cover.title??ctx.list.name??"旅のしおり";sub.value=ctx.cover.subtitle??`${ctx.sched.tripMeetDate||""} - ${ctx.sched.tripDismissDate||""}`;title.onchange=()=>{saveCover(ctx.list.id,{...getContext().cover,title:title.value});render()};sub.onchange=()=>{saveCover(ctx.list.id,{...getContext().cover,subtitle:sub.value});render()}}
    function render(){const ctx=getContext(),spots=ctx.list.spots||[];initCoverInputs(ctx);renderVisibilityControls(spots);const coverTitle=ctx.cover.title??ctx.list.name??"旅のしおり",coverSubtitle=ctx.cover.subtitle??`${ctx.sched.tripMeetDate||""} - ${ctx.sched.tripDismissDate||""}`,visibleSpots=spots.filter(s=>!s.printHidden);let html=`<section class="cover" style="${ctx.cover.coverImage?`background-image:url('${esc(ctx.cover.coverImage)}')`:""}"><p class="panel-kicker">Trip Pop Map</p><h1>${esc(coverTitle)}</h1><p class="muted">${esc(coverSubtitle)}</p></section>`;html+=`<section class="page"><h2>旅の地図</h2><div id="printMapPanels" class="print-map-panels"></div></section>`;html+=`<section class="page"><h2>スポット写真・紹介</h2><div class="spot-print-grid">${visibleSpots.map((s,i)=>{const photo=s.photoUrl||"",note=s.description||"",x=Number.isFinite(Number(s.photoX))?Number(s.photoX):50,y=Number.isFinite(Number(s.photoY))?Number(s.photoY):50,hours=businessHoursChips(s.businessHours);return`<article class="spot-print-card"><button class="spot-photo" type="button" data-spot-id="${esc(s.id)}">${photo?`<img src="${esc(photo)}" alt="${esc(s.name)}" style="object-position:${x}% ${y}%">`:`${i+1}. 写真を選択`}</button><input class="photo-input" type="file" accept="image/*" data-spot-id="${esc(s.id)}"><div class="spot-print-body"><h3>${i+1}. ${esc(s.name)}</h3>${hours?`<div class="hours-summary" aria-label="営業時間">${hours}</div>`:""}${note?`<p class="muted">${esc(note)}</p>`:""}${photo?`<label class="edit-field">写真位置<div class="photo-adjust"><span>横</span><input type="range" min="0" max="100" value="${x}" data-spot-id="${esc(s.id)}" data-field="photoX"><span>縦</span><input type="range" min="0" max="100" value="${y}" data-spot-id="${esc(s.id)}" data-field="photoY"></div></label>`:""}<label class="edit-field">紹介文・メモ<textarea data-spot-id="${esc(s.id)}" data-field="description" placeholder="見どころ、予約情報、持ち物など">${esc(note)}</textarea></label></div></article>`}).join("")||"<p class='muted'>表示するスポットがありません。</p>"}</div></section>`;html+=`<section class="page"><h2>日程</h2>${(ctx.sched.days||[]).map((d,i)=>`<h3>${formatDayTitle(d,i)}</h3>${scheduleRows(d,i,spots,ctx.sched).map(row=>`<div class="row"><span class="time">${row.start} - ${row.end}</span><span>${esc(row.name)}</span><span class="muted">${esc(row.note)}</span></div>`).join("")||"<p class='muted'>予定なし</p>"}`).join("")||"<p class='muted'>日程未登録</p>"}</section>`;html+=`<section class="page"><h2>持ち物リスト</h2><div class="packing-grid">${packingGroups().map(g=>`<article class="packing-card"><h3>${esc(g.title)}</h3>${(g.items||[]).map(item=>`<div class="packing-item ${item.done?"is-done":""}"><span>${item.done?"☑":"□"}</span><span>${esc(item.text||item.name||item)}</span></div>`).join("")}</article>`).join("")}</div></section>`;html+=ctx.cover.backCoverImage?`<section class="cover back-cover" style="background-image:url('${esc(ctx.cover.backCoverImage)}')"><div class="back-cover-inner"><p class="panel-kicker" style="color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5)">Trip Pop Map</p></div></section>`:`<section class="cover back-cover back-cover-empty"><div class="back-cover-inner"><p class="back-cover-hint">背表紙の写真を選択するとここに表示されます</p></div></section>`;document.getElementById("book").innerHTML=html;bindEditors();renderMaps(spots)}
    document.getElementById("coverPhotoBtn").onclick=()=>document.getElementById("coverPhotoInput").click();document.getElementById("coverPhotoInput").onchange=e=>readCoverImage(e.target.files?.[0]);document.getElementById("backCoverPhotoBtn").onclick=()=>document.getElementById("backCoverPhotoInput").click();document.getElementById("backCoverPhotoInput").onchange=e=>readBackCoverImage(e.target.files?.[0]);
    const _pms=document.getElementById("printMapStyleSelect");if(_pms){_pms.value=parseJson(SETTINGS_KEY,{}).mapStyle||"osm-bright";_pms.addEventListener("change",()=>{const s=parseJson(SETTINGS_KEY,{});s.mapStyle=_pms.value;localStorage.setItem(SETTINGS_KEY,JSON.stringify(s));const ctx=getContext();renderMaps(ctx.list.spots)});}
    const hb=document.getElementById("hamburgerBtn"),sd=document.getElementById("sideDrawer"),db=document.getElementById("drawerBackdrop");hb.onclick=()=>{const o=!sd.classList.contains("hidden");sd.classList.toggle("hidden",o);db.classList.toggle("hidden",o)};db.onclick=()=>{sd.classList.add("hidden");db.classList.add("hidden")};render();
  </script>
