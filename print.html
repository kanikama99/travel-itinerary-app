  <script>
    const LISTS_KEY="spot-map-lists.v1",SCHEDULE_KEY="spot-map-schedule.v1",SETTINGS_KEY="spot-map-settings.v1",COVER_KEY="trip-print-cover.v1",PACKING_KEY="trip-packing-list.v1";
    const DAY_NAMES={sun:"日",mon:"月",tue:"火",wed:"水",thu:"木",fri:"金",sat:"土"};
    const DAY_ORDER=["sun","mon","tue","wed","thu","fri","sat"],WEEKDAYS=["日","月","火","水","木","金","土"];
    const RELATIVE_CLUSTER_THRESHOLD=0.12,DETAIL_PADDING_RATIO=0.35,OVERVIEW_PADDING_RATIO=0.15,LABEL_GAP=24,LABEL_PIN_PAD=20,LABEL_EDGE_PAD=8,LABEL_MIN_W=92,LABEL_MAX_W=520,LABEL_CHAR_W=15,LABEL_H=38,LABEL_DIRS=["right","left","top","bottom"],LABEL_DISTANCES=[24,54,84,114,154,204,264,334];
    const TILE_STYLES={ "osm-bright":{url:"https://tile.openstreetmap.jp/styles/osm-bright/{z}/{x}/{y}.png",options:{maxZoom:18},attribution:"&copy; OpenStreetMap contributors"},"osm-standard":{url:"https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",options:{maxZoom:19},attribution:"&copy; OpenStreetMap contributors"},"carto-light":{url:"https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",options:{maxZoom:20,subdomains:"abcd"},attribution:"&copy; OpenStreetMap &copy; CARTO"},"carto-dark":{url:"https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png",options:{maxZoom:20,subdomains:"abcd"},attribution:"&copy; OpenStreetMap &copy; CARTO"},"esri-satellite":{url:"https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",options:{maxZoom:17},attribution:"Tiles &copy; Esri"}};
    const BASE_PACKING=[{id:"basic",title:"基本",items:["財布","スマートフォン","充電器","身分証","常備薬","免許証","爪切り","ティッシュ","髭剃り"]},{id:"clothes",title:"衣類",items:["着替え","下着","靴下","羽織もの"]},{id:"travel",title:"旅先",items:["チケット","予約確認","雨具","エコバッグ"]},{id:"conditional",title:"条件付き",items:["セキュリティポーチ","海外SIM","現地通貨","変換プラグ"]}];
    const TEXT_COLOR_PRESETS=["#233038","#ce5428","#8e44ad","#2471a3","#148f77","#b53a48","#ffffff"];
    let mapInstances=[];
    function esc(s){return String(s??"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
    function parseJson(key,fallback){try{return JSON.parse(localStorage.getItem(key)||JSON.stringify(fallback))}catch{return fallback}}
    function scopedPackingKey(listId){return listId?`${PACKING_KEY}:${listId}`:PACKING_KEY}
    function getContext(){const listsData=parseJson(LISTS_KEY,{});const list=listsData.lists?.find(l=>l.id===listsData.activeListId)||listsData.lists?.[0]||{id:"default",name:"旅のしおり",spots:[]};const schedules=parseJson(SCHEDULE_KEY,{});const sched=schedules[list.id]||{};const cover=(parseJson(COVER_KEY,{})[list.id])||{};return{listsData,list,sched,cover}}
    function saveLists(listsData){localStorage.setItem(LISTS_KEY,JSON.stringify(listsData))}
    function saveCover(listId,cover){const all=parseJson(COVER_KEY,{});all[listId]=cover;localStorage.setItem(COVER_KEY,JSON.stringify(all))}
    function updateSpot(spotId,fields,rerender=false){const ctx=getContext();const spots=ctx.list.spots||[];const i=spots.findIndex(s=>s.id===spotId);if(i<0)return;spots[i]={...spots[i],...fields};ctx.list.spots=spots;saveLists(ctx.listsData);if(rerender)render()}
    function readImageFile(file,spotId){if(!file||!file.type.startsWith("image/"))return;const reader=new FileReader();reader.onload=()=>updateSpot(spotId,{photoUrl:reader.result,photoX:50,photoY:50},true);reader.readAsDataURL(file)}
    let selectedCoverLayer=null,selectedPrintElement=null;
    // ページ管理
    const FIXED_PAGES={cover:"表紙",map:"地図",spots:"スポット",schedule:"日程",packing:"持ち物",back:"裏表紙"};
    function getPageOrder(){return getContext().cover.pageOrder||["cover","map","spots","schedule","packing","back"]}
    function getCustomPages(){return getContext().cover.customPages||[]}
    function getPageName(id){return coverSettings().pageNames?.[id]||FIXED_PAGES[id]||getCustomPages().find(p=>p.id===id)?.title||id}
    function savePageOrder(order){const ctx=getContext();saveCover(ctx.list.id,{...ctx.cover,pageOrder:order})}
    function addNewPage(){const title=prompt("新規ページのタイトルを入力してください","カスタムページ");if(!title)return;pushHistory();const id="custom-"+Date.now();const ctx=getContext();const customPages=[...(ctx.cover.customPages||[]),{id,title,content:""}];const pageOrder=[...(ctx.cover.pageOrder||["cover","map","spots","schedule","packing","back"]),id];saveCover(ctx.list.id,{...ctx.cover,customPages,pageOrder});render();setTimeout(pushHistory,0)}
    function deleteCustomPage(id){pushHistory();const ctx=getContext();const customPages=(ctx.cover.customPages||[]).filter(p=>p.id!==id);const pageOrder=(ctx.cover.pageOrder||["cover","map","spots","schedule","packing","back"]).filter(pid=>pid!==id);const currentPageId=getPageOrder()[currentPrintPage];saveCover(ctx.list.id,{...ctx.cover,customPages,pageOrder});const newOrder=getPageOrder();const newIdx=newOrder.indexOf(currentPageId);render();goPage(newIdx>=0?newIdx:Math.min(currentPrintPage,newOrder.length-1));setTimeout(pushHistory,0)}
    function updateCustomPageContent(id,content){const ctx=getContext();const customPages=(ctx.cover.customPages||[]).map(p=>p.id===id?{...p,content}:p);saveCover(ctx.list.id,{...ctx.cover,customPages})}
    function renamePage(id,title){const clean=String(title||"").trim();if(!id||!clean)return;const ctx=getContext(),pageNames={...(ctx.cover.pageNames||{}),[id]:clean};const customPages=(ctx.cover.customPages||[]).map(p=>p.id===id?{...p,title:clean}:p);saveCover(ctx.list.id,{...ctx.cover,pageNames,customPages});render()}
    function startPageNameEdit(id,anchor){if(!id||!anchor)return;const input=document.createElement("input");input.className="page-name-edit";input.value=getPageName(id);input.setAttribute("aria-label","ページ名");let committed=false;const finish=save=>{if(committed)return;committed=true;const value=input.value;input.replaceWith(anchor);anchor.style.display="";if(save)renamePage(id,value)};anchor.style.display="none";anchor.after(input);input.focus();input.select();input.addEventListener("keydown",e=>{if(e.key==="Enter")finish(true);if(e.key==="Escape")finish(false)});input.addEventListener("blur",()=>finish(true))}
    function makeLayerId(){return `layer-${Date.now()}-${Math.random().toString(36).slice(2,7)}`}
    function defaultCoverLayers(ctx,kind){const key=kind==="back"?"backCoverLayers":"coverLayers",legacy=kind==="back"?ctx.cover.backCoverImage:ctx.cover.coverImage;if(Array.isArray(ctx.cover[key])&&ctx.cover[key].length)return ctx.cover[key];const layers=[];if(legacy)layers.push({id:makeLayerId(),type:"image",src:legacy,x:50,y:50,scale:100,rotate:0,z:1});if(kind==="cover"){layers.push({id:"cover-title",type:"text",role:"title",text:ctx.cover.title??ctx.list.name??"旅のしおり",x:50,y:42,scale:100,rotate:0,z:5,className:"cover-layer-title"});layers.push({id:"cover-subtitle",type:"text",role:"subtitle",text:ctx.cover.subtitle??`${ctx.sched.tripMeetDate||""} - ${ctx.sched.tripDismissDate||""}`,x:50,y:58,scale:100,rotate:0,z:5,className:"cover-layer-subtitle"})}else if(!legacy){layers.push({id:"back-hint",type:"text",text:"旅の思い出",x:50,y:50,scale:100,rotate:0,z:5,className:"cover-layer-subtitle"})}return layers}
    function saveCoverLayers(kind,layers){const{list,cover}=getContext(),key=kind==="back"?"backCoverLayers":"coverLayers";saveCover(list.id,{...cover,[key]:layers})}
    function updateCoverLayer(kind,id,fields){const ctx=getContext(),layers=defaultCoverLayers(ctx,kind).map(layer=>layer.id===id?{...layer,...fields}:layer);saveCoverLayers(kind,layers)}
    function addCoverImage(kind,file){if(!file||!file.type.startsWith("image/"))return;const reader=new FileReader();reader.onload=()=>{const ctx=getContext(),layers=defaultCoverLayers(ctx,kind);layers.push({id:makeLayerId(),type:"image",src:reader.result,x:50,y:50,scale:100,rotate:0,z:Math.max(1,...layers.map(l=>l.z||1))+1});saveCoverLayers(kind,layers);selectedCoverLayer={kind,id:layers[layers.length-1].id};selectedPrintElement=null;render()};reader.readAsDataURL(file)}
    function addTextLayer(){const order=getPageOrder(),currentId=order[currentPrintPage],kind=currentId==="back"?"back":"cover",ctx=getContext(),layers=defaultCoverLayers(ctx,kind);const layer={id:makeLayerId(),type:"text",text:"テキスト",x:50,y:50,scale:100,rotate:0,z:Math.max(1,...layers.map(l=>l.z||1))+1,color:"#ce5428",fontSize:24,fontFamily:""};layers.push(layer);saveCoverLayers(kind,layers);selectedCoverLayer={kind,id:layer.id};selectedPrintElement=null;render();goPage(Math.max(0,getPageOrder().indexOf(kind)))}
    function layerHandles(){return`<span class="layer-handle layer-resize" contenteditable="false" data-layer-action="resize"></span><span class="layer-handle layer-rotate" contenteditable="false" data-layer-action="rotate"></span>`}
    function renderCoverLayers(kind,layers){return layers.map(layer=>{const scale=Number(layer.scale)||100,rotate=Number(layer.rotate)||0,z=Number(layer.z)||1,x=Number(layer.x)||50,y=Number(layer.y)||50,sel=selectedCoverLayer?.kind===kind&&selectedCoverLayer?.id===layer.id?" is-selected":"";const handles=layerHandles();let style=`left:${x}%;top:${y}%;z-index:${z};transform:translate(-50%,-50%) scale(${scale/100}) rotate(${rotate}deg)`;if(layer.type==="image")return`<div class="cover-layer cover-layer-image${sel}" data-cover-kind="${kind}" data-layer-id="${esc(layer.id)}" style="${style}"><img src="${esc(layer.src)}" alt="">${handles}</div>`;if(layer.color)style+=`;color:${esc(layer.color)}`;if(layer.fontSize)style+=`;font-size:${Number(layer.fontSize)||24}px`;if(layer.fontFamily)style+=`;font-family:${esc(layer.fontFamily)}`;if(layer.fontWeight)style+=`;font-weight:${esc(layer.fontWeight)}`;if(layer.fontStyle)style+=`;font-style:${esc(layer.fontStyle)}`;return`<div class="cover-layer cover-layer-text ${esc(layer.className||"")}${sel}" data-cover-kind="${kind}" data-layer-id="${esc(layer.id)}" data-role="${esc(layer.role||"")}" style="${style}">${esc(layer.text)}${handles}</div>`}).join("")}
    function updateColorPreview(value){const u=document.getElementById("colorUnderline");if(u)u.style.background=value||"#ce5428"}
    function setSelectionToolbar(target,status,sub=""){const tb=document.getElementById("selectionToolbar"),box=document.getElementById("coverLayerStatus");if(tb)tb.dataset.target=target||"none";if(box)box.innerHTML=`${esc(status||"未選択")}${sub?`<small>${esc(sub)}</small>`:""}`}
    function clearSelectionToolbar(){setSelectionToolbar("none","未選択","プレビュー上の要素を選択")}
    function selectCoverLayer(kind,id){selectedCoverLayer={kind,id};selectedPrintElement=null;const ctx=getContext(),layers=defaultCoverLayers(ctx,kind),layer=layers.find(l=>l.id===id);document.querySelectorAll(".cover-layer").forEach(el=>el.classList.toggle("is-selected",el.dataset.coverKind===kind&&el.dataset.layerId===id));document.querySelectorAll(".print-element").forEach(el=>el.classList.remove("is-selected"));const scale=document.getElementById("coverLayerScale"),scaleNum=document.getElementById("coverLayerScaleNum"),rotate=document.getElementById("coverLayerRotate"),rotateNum=document.getElementById("coverLayerRotateNum"),color=document.getElementById("coverLayerColor"),fontSize=document.getElementById("coverLayerFontSize"),font=document.getElementById("coverLayerFont"),boldBtn=document.getElementById("boldBtn"),italicBtn=document.getElementById("italicBtn");setSelectionToolbar("cover",layer?`${kind==="back"?"裏表紙":"表紙"}: ${layer.type==="image"?"画像":"テキスト"}`:"未選択","ドラッグ/矢印キーで移動、倍率、回転、文字スタイル");if(scale&&layer)scale.value=Number(layer.scale)||100;if(scaleNum&&layer)scaleNum.value=Number(layer.scale)||100;if(rotate&&layer)rotate.value=Number(layer.rotate)||0;if(rotateNum&&layer)rotateNum.value=Number(layer.rotate)||0;if(color&&layer){color.value=layer.color||"#ce5428";updateColorPreview(color.value)}if(fontSize&&layer)fontSize.value=Number(layer.fontSize)||24;if(font&&layer)font.value=layer.fontFamily||"";if(boldBtn)boldBtn.classList.toggle("is-active",layer?.fontWeight==="bold");if(italicBtn)italicBtn.classList.toggle("is-active",layer?.fontStyle==="italic")}
    function bindLayerPointer(el){let state=null;const applyLive=fields=>{const x=fields.x??state.x, y=fields.y??state.y, scale=fields.scale??state.scale, rotate=fields.rotate??state.rotate;if(fields.x!==undefined)el.style.left=`${x}%`;if(fields.y!==undefined)el.style.top=`${y}%`;el.style.transform=`translate(-50%,-50%) scale(${scale/100}) rotate(${rotate}deg)`;updateCoverLayer(state.kind,state.id,fields)};el.addEventListener("pointerdown",e=>{const action=e.target.dataset.layerAction||"move";if(e.button!==0)return;if(el.classList.contains("is-editing"))return;e.stopPropagation();e.preventDefault();selectCoverLayer(el.dataset.coverKind,el.dataset.layerId);const rect=el.closest("[data-cover-canvas]")?.getBoundingClientRect();if(!rect)return;const ctx=getContext(),layers=defaultCoverLayers(ctx,el.dataset.coverKind),layer=layers.find(l=>l.id===el.dataset.layerId);if(!layer)return;const cx=rect.left+rect.width*(Number(layer.x)||50)/100,cy=rect.top+rect.height*(Number(layer.y)||50)/100;state={action,kind:el.dataset.coverKind,id:el.dataset.layerId,rect,startX:e.clientX,startY:e.clientY,x:Number(layer.x)||50,y:Number(layer.y)||50,scale:Number(layer.scale)||100,rotate:Number(layer.rotate)||0,cx,cy};el.setPointerCapture?.(e.pointerId)});el.addEventListener("pointermove",e=>{if(!state)return;if(state.action==="move"){const x=Math.max(0,Math.min(100,state.x+(e.clientX-state.startX)/state.rect.width*100)),y=Math.max(0,Math.min(100,state.y+(e.clientY-state.startY)/state.rect.height*100));applyLive({x,y})}else if(state.action==="resize"){const dist0=Math.hypot(state.startX-state.cx,state.startY-state.cy)||1,dist=Math.hypot(e.clientX-state.cx,e.clientY-state.cy);const scale=Math.max(20,Math.min(400,Math.round(state.scale*dist/dist0)));syncScaleInputs(scale);applyLive({scale})}else if(state.action==="rotate"){const a0=Math.atan2(state.startY-state.cy,state.startX-state.cx),a1=Math.atan2(e.clientY-state.cy,e.clientX-state.cx);const rotate=Math.round(state.rotate+(a1-a0)*180/Math.PI);syncRotateInputs(rotate);applyLive({rotate})}});el.addEventListener("pointerup",()=>{if(state){state=null;render();setTimeout(pushHistory,50)}});el.addEventListener("pointercancel",()=>{state=null})}
    function focusEditableLayer(el){if(el.contentEditable!=="true")return;el.focus();let textNode=[...el.childNodes].find(n=>n.nodeType===Node.TEXT_NODE);if(!textNode){textNode=document.createTextNode("");el.insertBefore(textNode,el.firstChild)}const range=document.createRange();range.setStart(textNode,textNode.textContent.length);range.collapse(true);const sel=window.getSelection();sel.removeAllRanges();sel.addRange(range)}
    function startEditLayer(el){if(!el.classList.contains("cover-layer-text"))return;el.contentEditable="true";el.classList.add("is-editing");focusEditableLayer(el)}
    function stopEditLayer(el){if(!el.classList.contains("cover-layer-text"))return;el.contentEditable="false";el.classList.remove("is-editing");const kind=el.dataset.coverKind,id=el.dataset.layerId,text=[...el.childNodes].filter(n=>n.nodeType===Node.TEXT_NODE).map(n=>n.textContent).join("").trim();const role=el.dataset.role;const ctx=getContext();updateCoverLayer(kind,id,{text});if(role==="title")saveCover(ctx.list.id,{...getContext().cover,title:text});if(role==="subtitle")saveCover(ctx.list.id,{...getContext().cover,subtitle:text})}
    function bindCoverLayerEditors(){document.querySelectorAll(".cover-layer").forEach(el=>{bindLayerPointer(el);el.addEventListener("click",e=>{e.stopPropagation();selectCoverLayer(el.dataset.coverKind,el.dataset.layerId)});el.addEventListener("dblclick",e=>{e.stopPropagation();startEditLayer(el)});el.addEventListener("input",()=>{if(el.contentEditable!=="true")return;const text=[...el.childNodes].filter(n=>n.nodeType===Node.TEXT_NODE).map(n=>n.textContent).join("").trim();updateCoverLayer(el.dataset.coverKind,el.dataset.layerId,{text})});el.addEventListener("blur",()=>{if(el.contentEditable==="true")stopEditLayer(el)});el.addEventListener("keydown",e=>{if(e.key==="Escape"&&el.contentEditable==="true"){e.preventDefault();stopEditLayer(el)}})})}
    function currentEditingLayer(){return document.querySelector(".cover-layer-text.is-editing")}
    function updateCoverSettings(fields){const ctx=getContext();saveCover(ctx.list.id,{...ctx.cover,...fields})}
    function coverSettings(){return getContext().cover||{}}
    function isElementHidden(id){return !!coverSettings().hiddenElements?.[id]}
    function elementScale(id){return Number(coverSettings().elementScales?.[id])||100}
    function setElementHidden(id,hidden){pushHistory();const ctx=getContext(),hiddenElements={...(ctx.cover.hiddenElements||{}),[id]:hidden};if(!hidden)delete hiddenElements[id];saveCover(ctx.list.id,{...ctx.cover,hiddenElements});if(selectedPrintElement===id){selectedPrintElement=null;clearSelectionToolbar()}render();setTimeout(pushHistory,0)}
    function setElementScale(id,scale){const ctx=getContext(),elementScales={...(ctx.cover.elementScales||{}),[id]:Number(scale)||100};saveCover(ctx.list.id,{...ctx.cover,elementScales});render()}
    function selectPrintElement(id){selectedPrintElement=id;selectedCoverLayer=null;document.querySelectorAll(".cover-layer").forEach(el=>el.classList.remove("is-selected"));document.querySelectorAll(".print-element").forEach(el=>el.classList.toggle("is-selected",el.dataset.printElement===id));const scale=document.getElementById("coverLayerScale"),scaleNum=document.getElementById("coverLayerScaleNum");const v=elementScale(id);setSelectionToolbar("print",`印刷要素: ${id}`,"倍率と初期配置");if(scale)scale.value=v;if(scaleNum)scaleNum.value=v}
    function printElement(id,html){if(isElementHidden(id))return"";const scale=elementScale(id);return`<div class="print-element" data-print-element="${esc(id)}" draggable="true" style="transform:scale(${scale/100});width:${10000/scale}%">${html}</div>`}
    function bindPrintElements(){document.querySelectorAll(".print-element").forEach(el=>{el.addEventListener("click",e=>{e.stopPropagation();selectPrintElement(el.dataset.printElement)});el.addEventListener("dragstart",e=>{const id=el.dataset.printElement;e.dataTransfer.setData("text/print-element",id);if(id?.startsWith("spot-"))e.dataTransfer.setData("text/spot-id",id.slice(5))})})}
    function hideSelectedPrintElement(){if(!selectedPrintElement)return;if(selectedPrintElement.startsWith("spot-"))updateSpot(selectedPrintElement.slice(5),{printHidden:true},true);else setElementHidden(selectedPrintElement,true);selectedPrintElement=null;clearSelectionToolbar()}
    function refreshSelectionAfterRender(){if(selectedCoverLayer){const layers=defaultCoverLayers(getContext(),selectedCoverLayer.kind);if(layers.some(l=>l.id===selectedCoverLayer.id)){selectCoverLayer(selectedCoverLayer.kind,selectedCoverLayer.id);return}selectedCoverLayer=null}if(selectedPrintElement&&document.querySelector(`[data-print-element="${CSS.escape(selectedPrintElement)}"]`)){selectPrintElement(selectedPrintElement);return}selectedPrintElement=null;clearSelectionToolbar()}
    function compactDayLabels(days){const labels=days.map(d=>DAY_NAMES[d]||d);if(labels.length===7)return"全日";const idxs=days.map(d=>DAY_ORDER.indexOf(d)).filter(i=>i>=0).sort((a,b)=>a-b);if(idxs.length===days.length&&idxs.every((v,i)=>i===0||v===idxs[i-1]+1)&&idxs.length>=3)return`${DAY_NAMES[DAY_ORDER[idxs[0]]]}-${DAY_NAMES[DAY_ORDER[idxs[idxs.length-1]]]}`;return labels.join("・")}
    function businessHoursChips(hours){if(!hours||typeof hours!=="object")return"";const groups=new Map();DAY_ORDER.forEach(day=>{const value=hours[day];if(!value)return;const key=value==="closed"?"休み":value;if(!groups.has(key))groups.set(key,[]);groups.get(key).push(day)});return [...groups.entries()].map(([value,days])=>`<span class="hours-chip ${value==="休み"?"closed":""}">${compactDayLabels(days)} ${esc(value)}</span>`).join("")}
    function toMin(value,fallback=540){const m=String(value||"").match(/^(\d{1,2}):(\d{2})$/);return m?Number(m[1])*60+Number(m[2]):fallback}
    function toTime(min){const h=Math.floor(min/60)%24;const m=min%60;return`${String(h).padStart(2,"0")}:${String(m).padStart(2,"0")}`}
    function formatDayTitle(day,index){const raw=day?.date||"";const m=String(raw).match(/^(\d{4})-(\d{2})-(\d{2})$/);if(!m)return`[${index+1}日目] ${esc(raw)}`;const date=new Date(Number(m[1]),Number(m[2])-1,Number(m[3]));const weekday=WEEKDAYS[date.getDay()]||"";return`[${index+1}日目] ${Number(m[2])}/${Number(m[3])}${weekday?`(${weekday})`:""}`}
    function asArray(value){return Array.isArray(value)?value:[]}
    function scheduleRows(day,idx,spots,sched,days){
      day=day||{};spots=asArray(spots);days=asArray(days);sched=sched||{};
      const isFirst=idx===0,isLast=idx===(days||[]).length-1;
      const rows=[];
      let cursor=toMin(isFirst?sched.tripMeetTime:day.startTime,540);
      // 初日: 集合
      if(isFirst&&sched.tripMeetPlace)rows.push({start:toTime(cursor),end:"",name:`🤝 集合 — ${sched.tripMeetPlace}`,note:sched.tripMeetTime||""});
      // 初日: 集合場所が空港なら飛行機情報を表示
      if(isFirst){const ma=spots.find(s=>Array.isArray(s.spotRoles)&&s.spotRoles.includes("meet")&&s.spotCategory==="airport");if(ma){const fKey=`meet:${ma.id||ma.name}:${day.date||""}`;const flt=sched.flights?.[fKey];if(flt){const fn=[flt.flightNumber,flt.arrivalAirport?`→ ${flt.arrivalAirport}`:""].filter(Boolean).join(" ");rows.push({start:flt.time||"",end:flt.arrivalTime||"",name:`✈ ${fn}`,note:flt.memo||""});if(flt.arrivalTime)cursor=Math.max(cursor,toMin(flt.arrivalTime))}}}
      // 2日目以降の朝: 前泊チェックアウト（開始時刻はスケジュール設定の日開始時刻を優先）
      if(!isFirst&&days){const prevId=days[idx-1]?.id,h=prevId?sched.hotels?.[prevId]:null;if(h?.name){const t=day.startTime?toMin(day.startTime):(h.checkoutTime?toMin(h.checkoutTime):cursor);rows.push({start:toTime(t),end:"",name:`🏨 チェックアウト — ${h.name}`,note:h.checkoutTime||""});cursor=Math.max(cursor,t)}}
      // 通常スポット

        if(!selectedCoverLayer)return;
        pushHistory();
        const ctx=getContext(),layers=defaultCoverLayers(ctx,selectedCoverLayer.kind);
        const layer=layers.find(l=>l.id===selectedCoverLayer.id);if(!layer)return;
        const sorted=[...layers].sort((a,b)=>(Number(a.z)||1)-(Number(b.z)||1));
        const idx=sorted.findIndex(l=>l.id===layer.id);
        if(e.code==="BracketRight"&&idx<sorted.length-1){const above=sorted[idx+1];const tmp=layer.z;layer.z=above.z;above.z=tmp;}
        else if(e.code==="BracketLeft"&&idx>0){const below=sorted[idx-1];const tmp=layer.z;layer.z=below.z;below.z=tmp;}
        saveCoverLayers(selectedCoverLayer.kind,layers);render();setTimeout(pushHistory,0);return;
      }

      // Ctrl+Shift+[ 最背面 / Ctrl+Shift+] 最前面
      if(ctrl&&e.shiftKey&&(e.code==="BracketLeft"||e.code==="BracketRight")){
        e.preventDefault();
        if(!selectedCoverLayer)return;
        pushHistory();
        const ctx=getContext(),layers=defaultCoverLayers(ctx,selectedCoverLayer.kind);
        const layer=layers.find(l=>l.id===selectedCoverLayer.id);if(!layer)return;
        const zValues=layers.map(l=>Number(l.z)||1);const minZ=Math.min(...zValues),maxZ=Math.max(...zValues);
        if(e.code==="BracketRight"){layers.forEach(l=>{if(l.id!==layer.id)l.z=Math.max(1,(Number(l.z)||1)-1)});layer.z=maxZ;}
        else{layers.forEach(l=>{if(l.id!==layer.id)l.z=(Number(l.z)||1)+1});layer.z=minZ;}
        saveCoverLayers(selectedCoverLayer.kind,layers);render();setTimeout(pushHistory,0);return;
      }

      // 矢印キー: 選択オブジェクト移動 or ページ切り替え
      if(["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"].includes(e.key)&&!inInput){
        if(selectedCoverLayer){
          e.preventDefault();
          const ctx=getContext(),layer=defaultCoverLayers(ctx,selectedCoverLayer.kind).find(l=>l.id===selectedCoverLayer.id);if(!layer)return;
          const step=e.shiftKey?5:1;
          const dx=e.key==="ArrowLeft"?-step:e.key==="ArrowRight"?step:0;
          const dy=e.key==="ArrowUp"?-step:e.key==="ArrowDown"?step:0;
          const x=Math.max(0,Math.min(100,(Number(layer.x)||50)+dx));
          const y=Math.max(0,Math.min(100,(Number(layer.y)||50)+dy));
          updateCoverLayer(selectedCoverLayer.kind,selectedCoverLayer.id,{x,y});
          const el=document.querySelector(`[data-cover-kind="${selectedCoverLayer.kind}"][data-layer-id="${selectedCoverLayer.id}"]`);
          if(el){el.style.left=`${x}%`;el.style.top=`${y}%`}
          return;
        }
        if(!selectedPrintElement){
          if(e.key==="ArrowLeft"){e.preventDefault();goPage(currentPrintPage-1)}
          else if(e.key==="ArrowRight"){e.preventDefault();goPage(currentPrintPage+1)}
        }
      }
    });

    // ── Ctrl+V で画像ペースト ──
    document.addEventListener("paste",e=>{
      if(currentEditingLayer())return;
      const inInput=document.activeElement&&(document.activeElement.tagName==="INPUT"||document.activeElement.tagName==="TEXTAREA");
      if(inInput)return;
      const items=[...(e.clipboardData?.items||[])];
      const imgItem=items.find(i=>i.type.startsWith("image/"));
      if(!imgItem)return;
      e.preventDefault();
      const file=imgItem.getAsFile();if(!file)return;
      const order=getPageOrder();
      const currentId=order[currentPrintPage];
      const kind=currentId==="back"?"back":"cover";
      addCoverImage(kind,file);
    });
  </script>
  <script src="./theme.js"></script>
</body>
</html>
