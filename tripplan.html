<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>優先順位入力 - Trip Pop Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .spotset-empty {
      text-align: center;
      padding: 48px 20px;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .spotset-list { display: grid; gap: 14px; }
    .spotset-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 18px 20px;
      box-shadow: 0 3px 14px rgb(var(--shadow-base-rgb, 149,90,48) / 0.07);
    }
    .spotset-card-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }
    .spotset-name {
      font-size: 1rem;
      font-weight: 700;
      margin: 0;
      flex: 1;
      min-width: 0;
    }
    .spotset-name-btn {
      background: none; border: none; padding: 0;
      font: inherit; font-weight: 700; color: inherit;
      cursor: pointer; text-align: left;
      text-decoration: underline dotted;
    }
    .spotset-name-btn:hover { color: var(--accent); }
    .spotset-cat-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 3px 10px;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent-deep);
      font-size: 0.76rem;
      font-weight: 700;
      flex-shrink: 0;
    }
    .spotset-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .spotset-field { display: flex; flex-direction: column; gap: 5px; }
    .spotset-field-full { grid-column: 1 / -1; }
    .spotset-label {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-deep);
    }
    .spotset-input, .spotset-select, .spotset-textarea {
      width: 100%;
      font: inherit;
      font-size: 0.9rem;
      color: var(--text);
      border: 1.5px solid var(--line);
      border-radius: 10px;
      padding: 8px 11px;
      background: rgba(255, 255, 255, 0.9);
      outline: none;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    .spotset-input:focus, .spotset-select:focus, .spotset-textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgb(var(--accent-rgb, 255,122,69) / 0.12);
    }
    .spotset-textarea { resize: vertical; min-height: 58px; }
    .spotset-dur-row {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .spotset-dur-row .spotset-input { width: 66px; flex-shrink: 0; }
    .spotset-unit { font-size: 0.82rem; color: var(--muted); font-weight: 600; flex-shrink: 0; }
    .spotset-hours-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }
    .spotset-hours-row .spotset-input { width: 96px; flex-shrink: 0; }
    .spotset-hours-hint { font-size: 0.74rem; color: var(--muted); }
    .spotset-saved {
      display: inline-block;
      font-size: 0.78rem;
      color: var(--accent-deep);
      font-weight: 700;
      margin-top: 8px;
      opacity: 0;
      transition: opacity 0.25s;
    }
    .spotset-saved.visible { opacity: 1; }

.shared-spot-menu-overlay {
      position: fixed; inset: 0; z-index: 1500;
      background: rgba(16,28,42,.38);
      display: flex; align-items: center; justify-content: center; padding: 18px;
    }
    .shared-spot-menu-overlay.hidden { display: none; }
    .shared-spot-menu-frame-wrap {
      width: min(980px, 100%);
      height: min(760px, calc(100vh - 36px));
      background: var(--panel); border: 1px solid var(--line);
      border-radius: 18px;
      box-shadow: 0 24px 80px rgb(var(--shadow-base-rgb,149,90,48) / .28);
      overflow: hidden; position: relative;
    }
    .shared-spot-menu-close {
      position: absolute; top: 10px; right: 10px; z-index: 2;
      border: 1px solid var(--line); border-radius: 999px;
      width: 38px; height: 38px; background: rgba(255,255,255,.92);
      color: var(--accent-deep); font-weight: 900; cursor: pointer;
    }
    .shared-spot-menu-frame { width: 100%; height: 100%; border: 0; background: transparent; }

    @media (max-width: 600px) {
      .spotset-grid { grid-template-columns: 1fr 1fr; }
    }
  </style>
</head>
<body>
  <div class="page-shell">
    <header class="hero">
      <div class="hero-copy-wrap">
        <p class="eyebrow">Trip Pop Map</p>
        <h1>優先順位入力</h1>
        <p class="hero-copy">スケジュールを組む前に、各スポットの優先度・滞在時間・営業時間をまとめて確認・設定しましょう。<br><span style="font-size:0.88rem;color:var(--muted)">※写真・カテゴリ・役割（集合/解散）・曜日別営業時間など詳細な設定は、どのページからでも<strong>スポットメニュー</strong>（スポット名をクリック）から変更できます。</span></p>
        <nav class="progress-steps" aria-label="ステップ">
          <a href="./spots.html" class="progress-step">①行きたい場所</a>
          <span class="progress-sep">›</span>
          <strong class="progress-step progress-step--current">②優先順位入力</strong>
          <span class="progress-sep">›</span>
          <a href="./schedule.html" class="progress-step">③スケジュール</a>
          <span class="progress-sep">›</span>
          <a href="./checklist.html" class="progress-step">④持ち物リスト</a>
          <span class="progress-sep">›</span>
          <a href="./print.html" class="progress-step">⑤印刷する</a>
        </nav>
      </div>
    </header>

    <div id="spotsetContainer">
      <p id="spotsetEmpty" class="spotset-empty">スポットが登録されていません。先に「行きたい場所」でスポットを追加してください。</p>
      <div id="spotsetList" class="spotset-list"></div>
    </div>
  </div>

  <div id="sharedSpotMenuOverlay" class="shared-spot-menu-overlay hidden" role="dialog" aria-modal="true">
    <div class="shared-spot-menu-frame-wrap">
      <iframe id="sharedSpotMenuFrame" class="shared-spot-menu-frame" title="スポットメニュー"></iframe>
    </div>
  </div>

  <nav class="page-nav-bar">
      <a href="./spots.html" class="page-nav-bar-btn page-nav-bar-btn--prev">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        行きたい場所
      </a>
      <a href="./schedule.html" class="page-nav-bar-btn page-nav-bar-btn--next">
        スケジュール
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </a>
    </nav>

  <button id="hamburgerBtn" class="hamburger-btn" type="button" aria-label="メニューを開く">
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
  </button>

  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="sideDrawer" class="side-drawer hidden" aria-hidden="true">
    <div class="drawer-head">
      <p class="drawer-kicker">Menu</p>
    </div>
    <nav class="drawer-nav">
      <a href="./bookmarks.html" class="drawer-nav-item">
        <span class="drawer-nav-icon">📒</span>
        <span>しおりを選ぶ</span>
      </a>
      <a href="./hotel.html" class="drawer-nav-item">
        <span class="drawer-nav-icon">🏨</span>
        <span>ホテルを見つける</span>
      </a>
      <a href="./howto.html" class="drawer-nav-item">
        <span class="drawer-nav-icon">?</span>
        <span>使い方</span>
      </a>
      <a href="./settings.html" class="drawer-nav-item">
        <span class="drawer-nav-icon">⚙</span>
        <span>設定</span>
      </a>
    </nav>
  </aside>

  <script>
    const LISTS_KEY    = "spot-map-lists.v1";
    const SETTINGS_KEY = "spot-map-settings.v1";

    const CAT_LABELS = {
      airport: "✈ 空港", station: "🚉 駅", restaurant: "🍽 食事",
      tourist: "📸 観光", hotel: "🏨 ホテル", shopping: "🛍 ショッピング", other: "📍 その他"
    };

    function loadLists() {
      try { return JSON.parse(localStorage.getItem(LISTS_KEY) || "{}"); } catch { return {}; }
    }
    function saveLists(data) { localStorage.setItem(LISTS_KEY, JSON.stringify(data)); }
    function getActiveList(data) {
      return data.lists?.find(l => l.id === data.activeListId) || data.lists?.[0] || null;
    }
    function showBudget() {
      try { return JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}").showBudget !== false; } catch { return true; }
    }
    function esc(s) {
      return String(s ?? "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
    }

    function splitDuration(mins) {
      const m = Number(mins);
      if (!m || m <= 0) return { h: "0", m: "0" };
      return { h: String(Math.floor(m / 60)), m: String(m % 60) };
    }

    function getDurationMinutes(hVal, mVal) {
      const h = parseInt(hVal) || 0, m = parseInt(mVal) || 0;
      const total = h * 60 + m;
      return total > 0 ? total : null;
    }

    function getSimpleHours(businessHours) {
      if (!businessHours || typeof businessHours !== "object") return { open: "", close: "" };
      const days = ["mon","tue","wed","thu","fri","sat","sun"];
      for (const day of days) {
        const val = businessHours[day];
        if (val && val !== "closed") {
          const match = /^(\d{1,2}:\d{2})-(\d{1,2}:\d{2})$/.exec(val);
          if (match) return { open: match[1], close: match[2] };
        }
      }
      return { open: "", close: "" };
    }

    function applyAllDayHours(open, close) {
      if (!open || !close) return null;
      const h = {};
      ["sun","mon","tue","wed","thu","fri","sat"].forEach(d => { h[d] = `${open}-${close}`; });
      return h;
    }

    function renderSpots() {
      const data    = loadLists();
      const list    = getActiveList(data);
      const listEl  = document.getElementById("spotsetList");
      const emptyEl = document.getElementById("spotsetEmpty");
      // ホテル（sourceType あり）は除外
      const spots   = (list?.spots || []).filter(s =>
        (s.spotCategory !== "hotel" || !s.sourceType)
      );

      emptyEl.style.display = spots.length ? "none" : "";
      listEl.innerHTML = "";
      if (!spots.length) return;

      spots.forEach(spot => {
        const dur      = splitDuration(spot.defaultStayMinutes ?? 60);
        const hrs      = getSimpleHours(spot.businessHours);
        const catLabel = CAT_LABELS[spot.spotCategory] || "📍 その他";
        const pri      = spot.priority || 3;

        const card = document.createElement("div");
        card.className = "spotset-card";
        card.dataset.spotId = spot.id;

        card.innerHTML = `
          <div class="spotset-card-head">
            <h3 class="spotset-name"><button class="spotset-name-btn" data-spot-id="${esc(spot.id)}">${esc(spot.name)}</button></h3>
            <span class="spotset-cat-badge">${esc(catLabel)}</span>
          </div>
          <div class="spotset-grid">
            <div class="spotset-field">
              <label class="spotset-label" for="ss-pri-${esc(spot.id)}">優先度（自動配置順）</label>
              <select id="ss-pri-${esc(spot.id)}" class="spotset-select" data-field="priority">
                <option value="1" ${pri===1?"selected":""}>1 最高（必ず入れたい）</option>
                <option value="2" ${pri===2?"selected":""}>2 高</option>
                <option value="3" ${pri===3?"selected":""}>3 普通</option>
                <option value="4" ${pri===4?"selected":""}>4 低</option>
                <option value="5" ${pri===5?"selected":""}>5 最低（候補があれば）</option>
              </select>
            </div>
            <div class="spotset-field">
              <label class="spotset-label">滞在時間</label>
              <div class="spotset-dur-row">
                <input type="number" min="0" max="12" step="1" value="${esc(dur.h)}" class="spotset-input" data-field="stayH" />
                <span class="spotset-unit">時間</span>
                <input type="number" min="0" max="55" step="5" value="${esc(dur.m)}" class="spotset-input" data-field="stayM" />
                <span class="spotset-unit">分</span>
              </div>
            </div>
            ${showBudget() ? `
            <div class="spotset-field">
              <label class="spotset-label" for="ss-bgt-${esc(spot.id)}">予算（円）</label>
              <input id="ss-bgt-${esc(spot.id)}" type="number" min="0" step="100" value="${esc(String(spot.budget || ""))}" class="spotset-input" data-field="budget" placeholder="例: 2000" />
            </div>` : ""}
            <div class="spotset-field spotset-field-full">
              <label class="spotset-label">営業時間（全曜日一括）</label>
              <div class="spotset-hours-row">
                <input type="time" step="900" value="${esc(hrs.open)}" class="spotset-input" data-field="hoursOpen" />
                <span class="spotset-unit">〜</span>
                <input type="time" step="900" value="${esc(hrs.close)}" class="spotset-input" data-field="hoursClose" />
                <span class="spotset-hours-hint">曜日別設定はスポットメニューで</span>
              </div>
            </div>
            <div class="spotset-field spotset-field-full">
              <label class="spotset-label" for="ss-desc-${esc(spot.id)}">メモ・説明</label>
              <textarea id="ss-desc-${esc(spot.id)}" class="spotset-textarea" data-field="notes" placeholder="見どころ、集合メモなど">${esc(spot.description || "")}</textarea>
            </div>
          </div>
          <span class="spotset-saved">✓ 保存しました</span>
        `;

        listEl.appendChild(card);

        card.querySelector(".spotset-name-btn")?.addEventListener("click", () => openSpotMenu(spot.id));
        card.querySelectorAll("[data-field]").forEach(el => {
          const ev = el.tagName === "TEXTAREA" ? "input" : "change";
          el.addEventListener(ev, () => saveSpot(spot.id, card));
        });
      });
    }

    function saveSpot(spotId, card) {
      const data = loadLists();
      const list = getActiveList(data);
      if (!list) return;
      const idx = list.spots.findIndex(s => s.id === spotId);
      if (idx < 0) return;

      const g = f => card.querySelector(`[data-field="${f}"]`);
      const priority           = parseInt(g("priority")?.value) || 3;
      const defaultStayMinutes = getDurationMinutes(g("stayH")?.value, g("stayM")?.value);
      const budget             = showBudget() ? (parseInt(g("budget")?.value) || 0) : list.spots[idx].budget;
      const hoursOpen          = g("hoursOpen")?.value || "";
      const hoursClose         = g("hoursClose")?.value || "";
      const description        = g("notes")?.value?.trim() || "";
      const businessHours      = (hoursOpen && hoursClose)
        ? applyAllDayHours(hoursOpen, hoursClose)
        : (hoursOpen || hoursClose ? list.spots[idx].businessHours : null);

      list.spots[idx] = { ...list.spots[idx], priority, defaultStayMinutes, budget, description, businessHours };
      saveLists(data);

      const savedEl = card.querySelector(".spotset-saved");
      if (savedEl) {
        savedEl.classList.add("visible");
        clearTimeout(savedEl._t);
        savedEl._t = setTimeout(() => savedEl.classList.remove("visible"), 1800);
      }
    }

    function openSpotMenu(spotId) {
      const overlay = document.getElementById("sharedSpotMenuOverlay");
      const frame   = document.getElementById("sharedSpotMenuFrame");
      if (!overlay || !frame) return;
      frame.src = `./spots.html?editSpot=${encodeURIComponent(spotId)}&embedded=1`;
      overlay.classList.remove("hidden");
    }

    function closeSpotMenu() {
      const overlay = document.getElementById("sharedSpotMenuOverlay");
      const frame   = document.getElementById("sharedSpotMenuFrame");
      overlay?.classList.add("hidden");
      if (frame) frame.src = "about:blank";
      renderSpots();
    }

    const hb = document.getElementById("hamburgerBtn");
    const sd = document.getElementById("sideDrawer");
    const db = document.getElementById("drawerBackdrop");
    hb.onclick = () => { const o = !sd.classList.contains("hidden"); sd.classList.toggle("hidden", o); db.classList.toggle("hidden", o); };
    db.onclick  = () => { sd.classList.add("hidden"); db.classList.add("hidden"); };

    document.getElementById("sharedSpotMenuOverlay")?.addEventListener("click", e => {
      if (e.target.id === "sharedSpotMenuOverlay") closeSpotMenu();
    });
    document.getElementById("sharedSpotMenuClose")?.addEventListener("click", closeSpotMenu);
    window.addEventListener("message", event => {
      if (event.origin !== window.location.origin) return;
      if (event.data?.type === "spot-menu-saved" || event.data?.type === "spot-menu-closed") closeSpotMenu();
    });

    renderSpots();
  </script>
  <script src="./theme.js"></script>
</body>
</html>
