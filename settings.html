<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>設定 — スポットマップ整理アプリ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="page-shell settings-shell">
    <header class="settings-header">
      <a href="/" class="back-btn">← メインに戻る</a>
      <h1>設定</h1>
    </header>

    <section class="panel settings-section">
      <div class="panel-head">
        <div>
          <p class="panel-kicker">Background</p>
          <h2>ページ背景色</h2>
        </div>
      </div>
      <div id="bgThemeSwatches" class="theme-swatches"></div>
    </section>

    <section class="panel settings-section">
      <div class="panel-head">
        <div>
          <p class="panel-kicker">Calendar</p>
          <h2>カレンダーのデザイン</h2>
        </div>
      </div>
      <div class="cal-style-radio-group" id="calStyleGroup">
        <input type="radio" name="calStyle" id="calStyleStandard" value="standard" class="cal-style-radio" />
        <label for="calStyleStandard" class="cal-style-label">
          <span class="cal-preview">📆</span>
          <span>スタンダード<br><small>Standard</small></span>
        </label>
        <input type="radio" name="calStyle" id="calStyleCute" value="cute" class="cal-style-radio" />
        <label for="calStyleCute" class="cal-style-label">
          <span class="cal-preview">🌸</span>
          <span>キュート<br><small>Cute</small></span>
        </label>
        <input type="radio" name="calStyle" id="calStyleMinimal" value="minimal" class="cal-style-radio" />
        <label for="calStyleMinimal" class="cal-style-label">
          <span class="cal-preview">🪶</span>
          <span>ミニマル<br><small>Minimal</small></span>
        </label>
      </div>
    </section>

    <section class="panel settings-section">
      <div class="panel-head">
        <div>
          <p class="panel-kicker">Area Suggest</p>
          <h2>エリアから提案</h2>
        </div>
      </div>
      <div class="settings-row">
        <label class="settings-label" for="areaSuggestCountInput">
          提案候補数
          <span class="settings-desc">エリア検索で表示するスポット候補の最大数（1〜50）</span>
        </label>
        <input id="areaSuggestCountInput" type="number" min="1" max="50" value="10" class="settings-number-input" />
      </div>
      <div class="settings-row">
        <label class="settings-label" for="areaSuggestTimeoutInput">
          検索上限時間（秒）
          <span class="settings-desc">エリア検索のタイムアウト。時間内に見つかったスポットを表示します（3〜60）</span>
        </label>
        <input id="areaSuggestTimeoutInput" type="number" min="3" max="60" value="10" class="settings-number-input" />
      </div>
    </section>
  </div>

  <button id="hamburgerBtn" class="hamburger-btn" type="button" aria-label="メニューを開く">
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
  </button>

  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="sideDrawer" class="side-drawer hidden" aria-hidden="true">
    <div class="drawer-head">
      <p class="drawer-kicker">Menu</p>
    </div>
    <nav class="drawer-nav">
      <a href="./bookmarks.html" class="drawer-nav-item">
        <span class="drawer-nav-icon">📒</span>
        <span>しおりを選ぶ</span>
      </a>
      <a href="./spots.html" class="drawer-nav-item">
        <span class="drawer-nav-icon">📍</span>
        <span>行きたい場所</span>
      </a>
      <a href="./schedule.html" class="drawer-nav-item">
        <span class="drawer-nav-icon">📅</span>
        <span>スケジュール</span>
      </a>
      <a href="./hotel.html" class="drawer-nav-item">
        <span class="drawer-nav-icon">🏨</span>
        <span>ホテルを見つける</span>
      </a>
      <a href="./settings.html" class="drawer-nav-item drawer-nav-item--active">
        <span class="drawer-nav-icon">⚙</span>
        <span>設定</span>
      </a>
    </nav>
  </aside>

  <script src="./settings.js"></script>
</body>
</html>
