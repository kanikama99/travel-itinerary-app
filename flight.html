<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>飛行機を見つける - Trip Pop Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .flight-shell { width: min(940px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 80px; display: flex; flex-direction: column; gap: 22px; }
    .flight-eyebrow { font-size: 0.82rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-deep); font-weight: 700; margin: 0 0 4px; }
    .flight-title { font-size: clamp(1.7rem, 4vw, 2.25rem); font-weight: 700; line-height: 1.2; margin: 0; }
    .flight-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; box-shadow: 0 5px 18px rgb(var(--shadow-base-rgb, 149,90,48) / 0.10); }
    .flight-card-kicker { margin: 0 0 14px; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent-deep); font-weight: 700; }
    .flight-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
    .flight-field { display: flex; flex-direction: column; gap: 6px; }
    .flight-field-label { font-size: 0.86rem; font-weight: 700; color: var(--accent-deep); }
    .flight-input { width: 100%; font: inherit; font-size: 0.94rem; color: var(--text); border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; background: rgba(255,255,255,0.9); outline: none; }
    .flight-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgb(var(--accent-rgb, 255,122,69) / 0.12); }
    .flight-sites { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
    .flight-site-btn, .flight-save-btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; border: 1.5px solid rgb(var(--accent-rgb, 255,122,69) / 0.24); border-radius: 12px; background: rgba(255,255,255,0.72); color: var(--text); font: inherit; font-weight: 800; padding: 12px; cursor: pointer; text-decoration: none; text-align: center; }
    .flight-site-btn:hover, .flight-save-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
    .flight-save-btn { width: 100%; margin-top: 14px; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-light)); border: none; }
    .flight-note { margin: 10px 0 0; font-size: 0.82rem; color: var(--muted); line-height: 1.6; }
    .flight-registration.hidden { display: none; }
    .flight-divider { border: none; border-top: 1px solid var(--line); margin: 4px 0 14px; }
    @media (max-width: 720px) { .flight-grid, .flight-sites { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div class="flight-shell">
    <header>
      <p class="flight-eyebrow">Flight Search</p>
      <h1 class="flight-title">飛行機を見つける</h1>
    </header>

    <section class="flight-card">
      <p class="flight-card-kicker">Search - 航空券サイトで探す</p>
      <div class="flight-grid">
        <div class="flight-field">
          <label class="flight-field-label" for="flightFrom">出発地・空港</label>
          <input id="flightFrom" class="flight-input" type="text" list="flightAirportOptions" placeholder="例：関西国際空港 / KIX" />
        </div>
        <div class="flight-field">
          <label class="flight-field-label" for="flightTo">到着地・空港</label>
          <input id="flightTo" class="flight-input" type="text" list="flightAirportOptions" placeholder="例：羽田空港 / HND" />
        </div>
        <div class="flight-field">
          <label class="flight-field-label" for="flightSearchDate">搭乗日</label>
          <input id="flightSearchDate" class="flight-input" type="date" data-cal />
        </div>
        <div class="flight-field">
          <label class="flight-field-label" for="flightPassengers">人数</label>
          <input id="flightPassengers" class="flight-input" type="number" min="1" max="20" step="1" value="2" />
        </div>
      </div>
      <div class="flight-sites">
        <button class="flight-site-btn" type="button" onclick="searchGoogleFlights()">Google Flights</button>
        <button class="flight-site-btn" type="button" onclick="searchSkyscanner()">Skyscanner</button>
        <button class="flight-site-btn" type="button" onclick="searchTravelko()">トラベルコ</button>
      </div>
      <p id="flightSearchStatus" class="flight-note"></p>
      <p class="flight-note">将来アフィリエイト化しやすいよう、予約サイト別の検索ボタンに分けています。提携先が決まったら各URLにアフィリエイトIDを付与できます。</p>
    </section>

    <section id="flightRegistrationCard" class="flight-card flight-registration hidden">
      <p class="flight-card-kicker">Flight Registration - 空港予定に紐づけ</p>
      <div class="flight-grid">
        <div class="flight-field">
          <label class="flight-field-label" for="flightAirport">出発空港</label>
          <input id="flightAirport" class="flight-input" type="text" list="flightAirportOptions" placeholder="例：関西国際空港 / KIX" />
        </div>
        <div class="flight-field">
          <label class="flight-field-label" for="flightArrivalAirport">到着空港</label>
          <input id="flightArrivalAirport" class="flight-input" type="text" list="flightAirportOptions" placeholder="例：羽田空港 / HND" />
        </div>
        <div class="flight-field">
          <label class="flight-field-label" for="flightDate">搭乗日</label>
          <input id="flightDate" class="flight-input" type="date" data-cal />
        </div>
        <div class="flight-field">
          <label class="flight-field-label" for="flightNumber">便名</label>
          <input id="flightNumber" class="flight-input" type="text" placeholder="例：JL123" />
        </div>
        <div class="flight-field">
          <label class="flight-field-label" for="flightTime">離陸時刻</label>
          <input id="flightTime" class="flight-input" type="time" min="00:00" max="23:55" step="300" placeholder="09:00" />
        </div>
        <div class="flight-field">
          <label class="flight-field-label" for="flightArrivalTime">着陸時刻</label>
          <input id="flightArrivalTime" class="flight-input" type="time" min="00:00" max="23:55" step="300" placeholder="11:00" />
        </div>
        <div class="flight-field" data-budget-ui>
          <label class="flight-field-label" for="flightPrice">1名あたり予約金額（円）</label>
          <input id="flightPrice" class="flight-input" type="number" min="0" step="500" placeholder="例：18000" />
        </div>
        <div class="flight-field">
          <label class="flight-field-label" for="flightMemo">メモ</label>
          <input id="flightMemo" class="flight-input" type="text" placeholder="航空会社、ターミナルなど" />
        </div>
      </div>
      <button id="saveFlightBtn" class="flight-save-btn" type="button">この航空券情報を保存してスケジュールに戻る</button>
      <p id="flightSaveStatus" class="flight-note"></p>
    </section>

    <datalist id="flightAirportOptions"></datalist>
  </div>

  <nav class="page-nav-bar page-nav-bar--start">
      <a href="./schedule.html" class="page-nav-bar-btn page-nav-bar-btn--prev">
        <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        スケジュール
      </a>
    </nav>

  <button id="hamburgerBtn" class="hamburger-btn" type="button" aria-label="メニューを開く">
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
    <span class="hamburger-line"></span>
  </button>

  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="sideDrawer" class="side-drawer hidden" aria-hidden="true">
    <div class="drawer-head"><p class="drawer-kicker">Menu</p></div>
    <nav class="drawer-nav">
      <a href="./bookmarks.html" class="drawer-nav-item"><span class="drawer-nav-icon">📒</span><span>しおりを選ぶ</span></a>
      <a href="./howto.html" class="drawer-nav-item"><span class="drawer-nav-icon">❔</span><span>使い方</span></a>
      <a href="./settings.html" class="drawer-nav-item"><span class="drawer-nav-icon">⚙</span><span>設定</span></a>
    </nav>
  </aside>

  <script src="./airports.js"></script>
  <script>
    const LISTS_KEY = "spot-map-lists.v1";
    const SCHEDULE_KEY = "spot-map-schedule.v1";

    function applyTheme() {
      const saved = localStorage.getItem("spot-map-settings.v1");
      if (!saved) return;
      try {
        const s = JSON.parse(saved);
        const themes = [
          ["#fff3dd","#fffaf0","rgba(166,97,54,0.18)","#233038","#5f6d73","#ff7a45","#ce5428","255,122,69","149,90,48"],
          ["#e8f4fd","#f0f8ff","rgba(54,120,166,0.18)","#1a2a3a","#4a6070","#4a9ede","#2d7ab5","74,158,222","45,100,165"],
          ["#f0fdf4","#f7fff9","rgba(54,166,97,0.18)","#1a3323","#3a6050","#34c97a","#1fa85e","52,201,122","30,140,80"],
          ["#fdf0f8","#fff7fd","rgba(166,54,140,0.18)","#2a1a2a","#5f3a5a","#d44ab0","#a83285","212,74,176","140,50,120"],
          ["#fff8f0","#fffaf5","rgba(200,120,40,0.18)","#2a1800","#6a4a20","#e08020","#b05a10","224,128,32","160,80,20"],
          ["#f5f0ff","#faf7ff","rgba(120,80,200,0.18)","#180a2a","#4a3a6a","#8060d0","#6040a8","128,96,208","80,60,150"],
          ["#fff0f0","#fff7f7","rgba(166,54,54,0.18)","#2a0a0a","#6a3a3a","#e05050","#b03030","224,80,80","160,40,40"],
          ["#f0fff8","#f5fffb","rgba(40,160,120,0.18)","#001a12","#1a4a3a","#28c890","#10a870","40,200,144","20,140,90"]
        ];
        const c = themes[Math.max(0, Math.min(themes.length - 1, s.bgTheme ?? 0))];
        const r = document.documentElement;
        ["--bg","--panel","--line","--text","--muted","--accent","--accent-deep","--accent-rgb","--shadow-base-rgb"].forEach((k, i) => r.style.setProperty(k, c[i]));
        r.style.setProperty("--panel-strong", c[1]);
      } catch {}
    }

    function getActiveListAndSchedule() {
      const listsData = JSON.parse(localStorage.getItem(LISTS_KEY) || "{}");
      const activeList = listsData.lists?.find(l => l.id === listsData.activeListId) || listsData.lists?.[0];
      const all = JSON.parse(localStorage.getItem(SCHEDULE_KEY) || "{}");
      const schedule = activeList ? (all[activeList.id] || {}) : {};
      return { listsData, activeList, all, schedule };
    }

    function makeAirportSpotId() {
      return `airport-${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
    }

    const AIRPORT_DATA = window.TRIP_AIRPORTS || [
      { name: "成田国際空港 (NRT)", lat: 35.7719, lng: 140.3929 },
      { name: "羽田空港 (HND)", lat: 35.5494, lng: 139.7798 },
      { name: "関西国際空港 (KIX)", lat: 34.4270, lng: 135.2440 },
      { name: "中部国際空港 (NGO)", lat: 34.8584, lng: 136.8054 },
      { name: "福岡空港 (FUK)", lat: 33.5863, lng: 130.4511 },
      { name: "那覇空港 (OKA)", lat: 26.1959, lng: 127.6459 },
      { name: "桃園国際空港・台北 (TPE)", lat: 25.0777, lng: 121.2327 },
      { name: "仁川国際空港 (ICN)", lat: 37.4602, lng: 126.4407 },
      { name: "金浦空港 (GMP)", lat: 37.5589, lng: 126.7950 },
      { name: "香港国際空港 (HKG)", lat: 22.3080, lng: 113.9185 },
      { name: "シンガポール・チャンギ空港 (SIN)", lat: 1.3644, lng: 103.9915 },
      { name: "バンコク・スワンナプーム空港 (BKK)", lat: 13.6900, lng: 100.7501 },
      { name: "ホーチミン・タンソンニャット空港 (SGN)", lat: 10.8188, lng: 106.6520 },
      { name: "ハノイ・ノイバイ空港 (HAN)", lat: 21.2212, lng: 105.8072 },
    ];

    function normalizeAirportName(value) {
      return window.normalizeTripAirportName
        ? window.normalizeTripAirportName(value)
        : String(value || "").trim().toLowerCase().replace(/\s+/g, "");
    }

    function findAirportData(name) {
      if (window.findTripAirport) return window.findTripAirport(name);
      const key = normalizeAirportName(name);
      if (!key) return null;
      return AIRPORT_DATA.find(ap => normalizeAirportName(ap.name) === key)
        || AIRPORT_DATA.find(ap => {
          const code = (ap.name.match(/\(([A-Z0-9]{3})\)/) || [])[1];
          return code && key.includes(code.toLowerCase());
        })
        || AIRPORT_DATA.find(ap => key.includes(normalizeAirportName(ap.name.replace(/（.*?）|\(.*?\)/g, ""))));
    }

    function airportDisplayName(airport) {
      return airport?.displayName || airport?.name || "";
    }

    function airportId(airport) {
      return airport?.id || (airport?.iata ? `airport-${String(airport.iata).toLowerCase()}` : "");
    }

    function minutesToTime(mins) {
      const safe = Math.max(0, Math.min(23 * 60 + 55, Math.round(Number(mins) || 0)));
      return `${String(Math.floor(safe / 60)).padStart(2, "0")}:${String(safe % 60).padStart(2, "0")}`;
    }

    function timeToMinutes(value) {
      const m = String(value || "").match(/^(\d{1,2}):(\d{2})$/);
      if (!m) return null;
      return Math.max(0, Math.min(23 * 60 + 59, Number(m[1]) * 60 + Number(m[2])));
    }

    function roundTimeToFiveMinutes(value) {
      const mins = timeToMinutes(value);
      if (mins === null) return "";
      return minutesToTime(Math.round(mins / 5) * 5);
    }

    function setupTimePicker(baseId) {
      const input = document.getElementById(baseId);
      if (!input) return;
      input.addEventListener("blur", () => setTimePickerValue(baseId, input.value));
      input.addEventListener("change", () => setTimePickerValue(baseId, input.value));
      if (input.value) setTimePickerValue(baseId, input.value);
    }

    function setTimePickerValue(baseId, value) {
      const input = document.getElementById(baseId);
      if (!String(value || "").trim()) {
        if (input) input.value = "";
        return "";
      }
      const rounded = roundTimeToFiveMinutes(value) || "";
      if (input) input.value = rounded;
      return rounded;
    }

    function getTimePickerValue(baseId) {
      const input = document.getElementById(baseId);
      const rounded = roundTimeToFiveMinutes(input?.value || "");
      if (input) input.value = rounded;
      return rounded;
    }

    function fillAirportOptions() {
      const list = document.getElementById("flightAirportOptions");
      if (!list) return;
      list.innerHTML = "";
      (window.TRIP_AIRPORTS || AIRPORT_DATA).forEach(ap => {
        const opt = document.createElement("option");
        opt.value = airportDisplayName(ap);
        opt.label = `${ap.iata || ""} ${ap.country || ""} ${ap.city || ""}`.trim();
        list.appendChild(opt);
      });
    }

    function canonicalizeAirportInput(input, required = false) {
      const airport = findAirportData(input?.value || "");
      if (airport && input) input.value = airportDisplayName(airport);
      if (!airport && required) {
        throw new Error("出発空港・到着空港は空港テーブルから選択してください。空港名またはIATAコードで検索できます。");
      }
      return airport;
    }

    function setupFlightInputs() {
      fillAirportOptions();
      ["flightFrom", "flightTo", "flightAirport", "flightArrivalAirport"].forEach(id => {
        const input = document.getElementById(id);
        input?.addEventListener("change", () => canonicalizeAirportInput(input, false));
      });
      setupTimePicker("flightTime");
      setupTimePicker("flightArrivalTime");
    }

    function ensureAirportSpot(activeList, name, fields = {}) {
      const known = findAirportData(name);
      if (!known) return null;
      const airportName = airportDisplayName(known);
      if (!activeList || !airportName) return null;
      if (!Array.isArray(activeList.spots)) activeList.spots = [];
      const exactId = fields.preferredId
        ? activeList.spots.find(spot => spot.id === fields.preferredId)
        : null;
      const existing = exactId || activeList.spots.find(spot =>
        spot.spotCategory === "airport" && (
          spot.airportId === airportId(known)
          || String(spot.name || "").trim() === airportName
          || window.sameTripAirport?.(spot, known)
        )
      );
      const patch = {
        name: airportName,
        type: "spot",
        spotCategory: "airport",
        sourceType: "flight",
        airportId: airportId(known),
        iata: known.iata || known.code || null,
        airportCountry: known.country || null,
        airportCity: known.city || null,
      };
      if (Number.isFinite(Number(fields.lat ?? known?.lat))) patch.lat = Number(fields.lat ?? known.lat);
      if (Number.isFinite(Number(fields.lng ?? known?.lng))) patch.lng = Number(fields.lng ?? known.lng);
      const hasStay = Number.isFinite(Number(fields.defaultStayMinutes));
      if (hasStay) patch.defaultStayMinutes = Number(fields.defaultStayMinutes);
      if (fields.takeoffTime) patch.takeoffTime = roundTimeToFiveMinutes(fields.takeoffTime);
      if (fields.landingTime) patch.landingTime = roundTimeToFiveMinutes(fields.landingTime);
      if (existing) {
        Object.assign(existing, patch);
        return existing;
      }
      const created = { id: makeAirportSpotId(), defaultStayMinutes: hasStay ? patch.defaultStayMinutes : 60, ...patch };
      activeList.spots.push(created);
      return created;
    }

    function initFromParams() {
      const params = new URLSearchParams(location.search);
      const airport = params.get("airport") || "";
      const date = params.get("date") || "";
      const time = params.get("time") || "";
      if (airport) {
        document.getElementById("flightRegistrationCard").classList.remove("hidden");
        const known = findAirportData(airport);
        const name = airportDisplayName(known) || airport;
        document.getElementById("flightAirport").value = name;
        document.getElementById("flightFrom").value = name;
      }
      if (date) {
        document.getElementById("flightDate").value = date;
        document.getElementById("flightSearchDate").value = date;
        window.CalendarPicker?.updateDisplay(document.getElementById("flightDate"));
        window.CalendarPicker?.updateDisplay(document.getElementById("flightSearchDate"));
      }
      if (time) setTimePickerValue("flightTime", time);
      const arrivalAirport = params.get("arrivalAirport") || "";
      const arrivalTime    = params.get("arrivalTime")    || "";
      const flightNumber   = params.get("flightNumber")   || "";
      const price          = params.get("price")          || "";
      const memo           = params.get("memo")           || "";
      if (arrivalAirport) {
        const knownArrival = findAirportData(arrivalAirport);
        document.getElementById("flightArrivalAirport").value = airportDisplayName(knownArrival) || arrivalAirport;
      }
      if (arrivalTime)    setTimePickerValue("flightArrivalTime", arrivalTime);
      if (flightNumber)   document.getElementById("flightNumber").value         = flightNumber;
      if (price)          document.getElementById("flightPrice").value          = price;
      if (memo)           document.getElementById("flightMemo").value           = memo;
      if (arrivalAirport) document.getElementById("flightTo").value = document.getElementById("flightArrivalAirport").value;
    }

    function searchUrl(site) {
      const fromAirport = canonicalizeAirportInput(document.getElementById("flightFrom"), true);
      const toAirport = canonicalizeAirportInput(document.getElementById("flightTo"), true);
      const from = airportDisplayName(fromAirport);
      const to = airportDisplayName(toAirport);
      const date = document.getElementById("flightSearchDate").value;
      const q = encodeURIComponent(`${from} ${to} ${date} 航空券`);
      if (site === "google") return `https://www.google.com/travel/flights?q=${q}`;
      if (site === "skyscanner") return `https://www.skyscanner.jp/transport/flights/?preferdirects=false&adultsv2=${encodeURIComponent(document.getElementById("flightPassengers").value || "1")}&query=${q}`;
      return `https://www.tour.ne.jp/j_air/?keyword=${q}`;
    }
    function openFlightSearch(site) {
      const status = document.getElementById("flightSearchStatus");
      try { window.open(searchUrl(site), "_blank"); }
      catch (e) {
        if (status) status.textContent = e.message;
        else alert(e.message);
      }
    }
    function searchGoogleFlights() { openFlightSearch("google"); }
    function searchSkyscanner() { openFlightSearch("skyscanner"); }
    function searchTravelko() { openFlightSearch("travelko"); }

    document.getElementById("saveFlightBtn").addEventListener("click", () => {
      const status = document.getElementById("flightSaveStatus");
      const date = document.getElementById("flightDate").value;
      if (!date) { status.textContent = "搭乗日を入力してください"; return; }
      try {
        const departureAirport = canonicalizeAirportInput(document.getElementById("flightAirport"), true);
        const arrivalAirportData = canonicalizeAirportInput(document.getElementById("flightArrivalAirport"), true);
        const airport = airportDisplayName(departureAirport);
        const arrivalAirport = airportDisplayName(arrivalAirportData);
        const params = new URLSearchParams(location.search);
        const { listsData, activeList, all, schedule } = getActiveListAndSchedule();
        if (!activeList) throw new Error("しおりが見つかりません");
        if (!schedule.flights) schedule.flights = {};
        const time = getTimePickerValue("flightTime") || "";
        const arrivalTime = getTimePickerValue("flightArrivalTime") || "";
        const role = params.get("role") || "flight";
        const anchorSpotId = params.get("spotId") || "";
        const departureSpot = ensureAirportSpot(activeList, airport, {
          preferredId: role === "meet" ? anchorSpotId : "",
          takeoffTime: time,
        });
        const arrivalSpot = ensureAirportSpot(activeList, arrivalAirport, {
          preferredId: role === "dismiss" ? anchorSpotId : "",
          landingTime: arrivalTime,
        });
        const key = `${role}:${anchorSpotId || departureSpot?.id || airport}:${date}`;
        schedule.flights[key] = {
          role,
          spotId: anchorSpotId || departureSpot?.id || "",
          departureSpotId: departureSpot?.id || "",
          arrivalSpotId: arrivalSpot?.id || "",
          airport,
          arrivalAirport,
          date,
          time,
          arrivalTime,
          flightNumber: document.getElementById("flightNumber").value.trim(),
          pricePerPerson: parseInt(document.getElementById("flightPrice").value, 10) || 0,
          memo: document.getElementById("flightMemo").value.trim(),
        };
        all[activeList.id] = schedule;
        localStorage.setItem(LISTS_KEY, JSON.stringify(listsData));
        localStorage.setItem(SCHEDULE_KEY, JSON.stringify(all));
        location.href = "./schedule.html";
      } catch (e) {
        status.textContent = `保存に失敗しました: ${e.message}`;
      }
    });

    const hamburgerBtn = document.getElementById("hamburgerBtn");
    const sideDrawer = document.getElementById("sideDrawer");
    const drawerBackdrop = document.getElementById("drawerBackdrop");
    hamburgerBtn.addEventListener("click", () => {
      const open = !sideDrawer.classList.contains("hidden");
      sideDrawer.classList.toggle("hidden", open);
      drawerBackdrop.classList.toggle("hidden", open);
      sideDrawer.setAttribute("aria-hidden", String(open));
    });
    drawerBackdrop.addEventListener("click", () => {
      sideDrawer.classList.add("hidden");
      drawerBackdrop.classList.add("hidden");
      sideDrawer.setAttribute("aria-hidden", "true");
    });

    applyTheme();
    setupFlightInputs();
    initFromParams();
  </script>
  <script src="./calendar.js"></script>
  <script src="./theme.js"></script>
</body>
</html>
