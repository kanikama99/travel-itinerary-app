<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>しおりを選ぶ — Trip Pop Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff3dd;
      --panel: rgba(255, 252, 245, 0.88);
      --line: rgba(166, 97, 54, 0.18);
      --text: #233038;
      --muted: #5f6d73;
      --accent: #ff7a45;
      --accent-deep: #ce5428;
      --accent-light: #ff9a52;
      --accent-soft: rgba(255, 122, 69, 0.12);
      --accent-yellow: #ffd257;
      --accent-pink: #ff8fb1;
      --accent-teal: #70d6c5;
      --shadow: 0 24px 50px rgba(149, 90, 48, 0.16);
      --accent-rgb: 255, 122, 69;
      --shadow-base-rgb: 149, 90, 48;
      --radius-xl: 30px;
      --radius-lg: 22px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Zen Kaku Gothic New", sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 8% 10%, rgba(255, 210, 87, 0.55), transparent 22%),
        radial-gradient(circle at 92% 14%, rgba(112, 214, 197, 0.34), transparent 20%),
        radial-gradient(circle at 80% 80%, rgba(255, 143, 177, 0.28), transparent 18%),
        radial-gradient(circle at 20% 85%, rgba(255, 122, 69, 0.18), transparent 22%),
        linear-gradient(180deg, #fff8ea 0%, #ffeccd 100%);
      padding: 32px 20px;
    }

    /* 背景の浮かぶ丸 */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }
    .bg-blob-1 {
      width: 340px; height: 340px;
      top: -80px; left: -80px;
      background: radial-gradient(circle, rgba(255, 210, 87, 0.35) 0%, transparent 70%);
      animation-delay: 0s;
    }
    .bg-blob-2 {
      width: 260px; height: 260px;
      bottom: -60px; right: -40px;
      background: radial-gradient(circle, rgba(112, 214, 197, 0.3) 0%, transparent 70%);
      animation-delay: -3s;
    }
    .bg-blob-3 {
      width: 180px; height: 180px;
      top: 55%; right: 8%;
      background: radial-gradient(circle, rgba(255, 143, 177, 0.25) 0%, transparent 70%);
      animation-delay: -5s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-18px) scale(1.04); }
    }

    /* メインカード */
    .main-card {
      position: relative;
      z-index: 1;
      width: min(540px, 100%);
      padding: 44px 40px 48px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      animation: cardIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(24px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    /* 戻るリンク */
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      min-height: 36px;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      margin-bottom: 28px;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--accent-deep); }

    /* ヘッダー */
    .card-header {
      margin-bottom: 28px;
    }
    .card-eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-deep);
      font-weight: 700;
      margin-bottom: 6px;
    }
    .card-title {
      font-size: 1.6rem;
      font-weight: 700;
      line-height: 1.2;
    }
    .card-desc {
      font-size: 0.88rem;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.6;
    }

    /* しおりリスト */
    .bookmark-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 24px;
    }

    .bookmark-item-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      animation: itemIn 0.5s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .bookmark-item {
      display: flex;
      align-items: center;
      gap: 14px;
      min-height: 68px;
      padding: 16px 18px;
      background: rgba(255, 255, 255, 0.6);
      border: 1.5px solid var(--line);
      border-radius: 16px;
      cursor: pointer;
      transition: border-color 0.18s, box-shadow 0.18s, transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
      text-align: left;
      flex: 1;
      min-width: 0;
      font: inherit;
      color: inherit;
    }
    .bookmark-item:hover {
      border-color: var(--accent);
      box-shadow: 0 6px 20px rgb(var(--accent-rgb, 255,122,69) / 0.18);
      transform: translateY(-2px);
    }
    .bookmark-item:active {
      transform: translateY(0) scale(0.98);
    }

    .bookmark-rename-btn {
      flex-shrink: 0;
      width: 44px; height: 44px;
      border-radius: 10px;
      border: 1.5px solid var(--line);
      background: rgba(255, 255, 255, 0.6);
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.18s, color 0.18s, background 0.18s;
    }
    .bookmark-rename-btn:hover {
      border-color: var(--accent);
      color: var(--accent-deep);
      background: var(--accent-soft);
    }

    .bookmark-delete-btn {
      flex-shrink: 0;
      width: 44px; height: 44px;
      border-radius: 10px;
      border: 1.5px solid var(--line);
      background: rgba(255, 255, 255, 0.6);
      color: var(--muted);
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: border-color 0.18s, color 0.18s, background 0.18s;
    }
    .bookmark-delete-btn:hover {
      border-color: #e44;
      color: #c33;
      background: rgba(204, 51, 51, 0.08);
    }

    .bookmark-rename-input {
      font: inherit;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text);
      background: #fff;
      border: 1.5px solid var(--accent);
      border-radius: 8px;
      padding: 2px 8px;
      outline: none;
      width: 100%;
    }

    @keyframes itemIn {
      from { opacity: 0; transform: translateX(-12px); }
      to   { opacity: 1; transform: translateX(0); }
    }

    .bookmark-icon {
      width: 44px;
      height: 44px;
      border-radius: 13px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .bookmark-info {
      flex: 1;
      min-width: 0;
    }
    .bookmark-name {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .bookmark-meta {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
    }
    .bookmark-arrow {
      color: var(--accent);
      flex-shrink: 0;
      opacity: 0.7;
    }

    /* 空の状態 */
    .bookmark-empty {
      text-align: center;
      padding: 28px 0 16px;
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.7;
    }

    /* 区切り線 */
    .divider {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 20px;
      color: var(--muted);
      font-size: 0.78rem;
    }
    .divider::before, .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    /* 新規作成フォーム */
    .new-form {
      display: flex;
      gap: 10px;
    }
    .new-input {
      flex: 1;
      padding: 12px 16px;
      border: 1.5px solid var(--line);
      border-radius: 999px;
      font: inherit;
      font-size: 0.92rem;
      color: var(--text);
      background: rgba(255, 255, 255, 0.75);
      outline: none;
      transition: border-color 0.18s;
    }
    .new-input:focus {
      border-color: var(--accent);
      background: #fff;
    }
    .new-input::placeholder { color: #aab0b5; }

    .create-btn {
      min-height: 44px;
      padding: 12px 22px;
      border: none;
      border-radius: 999px;
      font: inherit;
      font-size: 0.92rem;
      font-weight: 700;
      color: #fff9f4;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      box-shadow: 0 6px 18px rgb(var(--accent-rgb, 255,122,69) / 0.36);
      cursor: pointer;
      white-space: nowrap;
      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.18s;
    }
    .create-btn:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 10px 24px rgb(var(--accent-rgb, 255,122,69) / 0.44);
    }
    .create-btn:active { transform: scale(0.97); }

    /* エラーメッセージ */
    .form-error {
      font-size: 0.8rem;
      color: #d44;
      margin-top: 8px;
      min-height: 1.2em;
    }

    @media (max-width: 480px) {
      .main-card {
        padding: 36px 24px 40px;
      }
      .new-form {
        flex-direction: column;
      }
      .create-btn { width: 100%; }
      .bookmark-item-wrap {
        display: grid;
        grid-template-columns: 1fr auto auto;
      }
    }
  </style>
</head>
<body>
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>

  <div class="main-card">
    <a href="./top.html" class="back-link">
      <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      Trip Pop Map
    </a>

    <div class="card-header">
      <p class="card-eyebrow">My Bookmarks</p>
      <h1 class="card-title">しおりを選ぶ</h1>
      <p class="card-desc">旅のしおりを選んで開くか、新しく作成してください。</p>
    </div>

    <div id="bookmarkList" class="bookmark-list">
      <!-- JSで生成 -->
    </div>

    <div class="divider">または新しく作成</div>

    <div class="new-form">
      <input
        id="newListInput"
        class="new-input"
        type="text"
        placeholder="しおりの名前（例：大阪旅行 2026）"
        maxlength="40"
      />
      <button id="createBtn" class="create-btn" type="button">作成して開く</button>
    </div>
    <p id="formError" class="form-error"></p>
  </div>

  <script>
    // テーマ適用
    (function() {
      try {
        const sk = JSON.parse(localStorage.getItem("spot-map-settings.v1") || "{}");
        const k = sk.bgTheme || "warm";
        const BGS = {
          warm:     "radial-gradient(circle at 8% 10%, rgba(255,210,87,.55), transparent 22%), radial-gradient(circle at 92% 14%, rgba(112,214,197,.34), transparent 20%), radial-gradient(circle at 80% 80%, rgba(255,143,177,.28), transparent 18%), linear-gradient(180deg,#fff8ea 0%,#ffeccd 100%)",
          sky:      "radial-gradient(circle at 8% 10%, rgba(135,206,250,.45), transparent 22%), radial-gradient(circle at 92% 14%, rgba(100,180,255,.28), transparent 20%), radial-gradient(circle at 80% 80%, rgba(173,216,230,.25), transparent 18%), linear-gradient(180deg,#eaf5ff 0%,#d0e8ff 100%)",
          mint:     "radial-gradient(circle at 8% 10%, rgba(144,238,144,.4), transparent 22%), radial-gradient(circle at 92% 14%, rgba(100,200,150,.28), transparent 20%), radial-gradient(circle at 80% 80%, rgba(152,251,152,.22), transparent 18%), linear-gradient(180deg,#eafff4 0%,#d0f5e0 100%)",
          lavender: "radial-gradient(circle at 8% 10%, rgba(216,191,255,.45), transparent 22%), radial-gradient(circle at 92% 14%, rgba(180,150,240,.28), transparent 20%), radial-gradient(circle at 80% 80%, rgba(200,170,255,.22), transparent 18%), linear-gradient(180deg,#f4eeff 0%,#e5d8ff 100%)",
          gray:     "radial-gradient(circle at 8% 10%, rgba(200,210,220,.45), transparent 22%), radial-gradient(circle at 92% 14%, rgba(180,190,200,.28), transparent 20%), radial-gradient(circle at 80% 80%, rgba(190,200,210,.22), transparent 18%), linear-gradient(180deg,#f2f4f6 0%,#e4e8ec 100%)",
        };
        const CS = {
          warm:     ["#ff7a45","#ce5428","#ff9a52","rgba(255,122,69,0.12)","rgba(166,97,54,0.2)","rgba(255,252,245,0.88)","0 24px 50px rgba(149,90,48,0.16)","255,122,69","149,90,48"],
          sky:      ["#3b8fd4","#1a6aad","#60aee8","rgba(59,143,212,0.12)","rgba(59,120,200,0.22)","rgba(240,248,255,0.88)","0 24px 50px rgba(30,90,160,0.14)","59,143,212","30,90,160"],
          mint:     ["#2da868","#1a7a48","#52c485","rgba(45,168,104,0.12)","rgba(45,150,90,0.22)","rgba(240,255,248,0.88)","0 24px 50px rgba(30,110,60,0.14)","45,168,104","30,110,60"],
          lavender: ["#8b64cc","#6a45a8","#a884e0","rgba(139,100,204,0.12)","rgba(120,80,200,0.22)","rgba(248,244,255,0.88)","0 24px 50px rgba(90,60,150,0.14)","139,100,204","90,60,150"],
          gray:     ["#7a8a98","#5a6a78","#96a6b4","rgba(122,138,152,0.12)","rgba(100,120,140,0.22)","rgba(245,247,250,0.88)","0 24px 50px rgba(60,80,100,0.14)","122,138,152","60,80,100"],
        };
        document.body.style.background = BGS[k] || BGS.warm;
        const c = CS[k] || CS.warm;
        const r = document.documentElement;
        r.style.setProperty("--accent",       c[0]);
        r.style.setProperty("--accent-deep",  c[1]);
        r.style.setProperty("--accent-light", c[2]);
        r.style.setProperty("--accent-soft",  c[3]);
        r.style.setProperty("--line",         c[4]);
        r.style.setProperty("--panel",        c[5]);
        r.style.setProperty("--shadow",       c[6]);
        r.style.setProperty("--accent-rgb",   c[7]);
        r.style.setProperty("--shadow-base-rgb", c[8]);
      } catch {}
    })();

    const LISTS_KEY = "spot-map-lists.v1";

    // LocalStorage からリスト一覧を読み込む
    function loadLists() {
      try {
        const raw = localStorage.getItem(LISTS_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          if (Array.isArray(parsed?.lists)) return parsed;
        }
      } catch {}
      return null;
    }

    // データを保存してアクティブリストを切り替える
    function activateAndGo(listId) {
      const data = loadLists();
      if (!data) return;
      data.activeListId = listId;
      localStorage.setItem(LISTS_KEY, JSON.stringify(data));
      location.href = "./spots.html";
    }

    // ユニークIDを生成する
    function makeId() {
      if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
      return `id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
    }

    // しおりカードを一枚作る
    function buildCard(list, delay) {
      const count = Array.isArray(list.spots) ? list.spots.length : 0;

      const wrap = document.createElement("div");
      wrap.className = "bookmark-item-wrap";
      wrap.style.animationDelay = `${delay}ms`;

      const btn = document.createElement("button");
      btn.className = "bookmark-item";
      btn.type = "button";
      btn.innerHTML = `
        <div class="bookmark-icon">📒</div>
        <div class="bookmark-info">
          <div class="bookmark-name">${escHtml(list.name)}</div>
          <div class="bookmark-meta">${count} スポット</div>
        </div>
        <svg class="bookmark-arrow" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      `;
      btn.addEventListener("click", () => activateAndGo(list.id));

      const renameBtn = document.createElement("button");
      renameBtn.className = "bookmark-rename-btn";
      renameBtn.type = "button";
      renameBtn.title = "名前を変更";
      renameBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;
      renameBtn.addEventListener("click", e => {
        e.stopPropagation();
        startRename(btn, list);
      });

      const deleteBtn = document.createElement("button");
      deleteBtn.className = "bookmark-delete-btn";
      deleteBtn.type = "button";
      deleteBtn.title = "削除";
      deleteBtn.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4h6v2"/></svg>`;
      deleteBtn.addEventListener("click", e => {
        e.stopPropagation();
        deleteList(list.id);
      });

      wrap.appendChild(btn);
      wrap.appendChild(renameBtn);
      wrap.appendChild(deleteBtn);
      return wrap;
    }

    // インライン編集でリスト名を変更する
    function startRename(cardBtn, list) {
      const nameEl = cardBtn.querySelector(".bookmark-name");
      const oldName = list.name;

      const input = document.createElement("input");
      input.className = "bookmark-rename-input";
      input.value = oldName;
      input.placeholder = "しおりの名前";

      nameEl.replaceWith(input);
      input.focus();
      input.select();

      let saved = false;
      function save() {
        if (saved) return;
        saved = true;
        const newName = input.value.trim();
        if (newName && newName !== oldName) {
          const data = loadLists();
          const target = data?.lists.find(l => l.id === list.id);
          if (target) {
            target.name = newName;
            localStorage.setItem(LISTS_KEY, JSON.stringify(data));
          }
        }
        render();
      }

      input.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); save(); }
        if (e.key === "Escape") { saved = true; render(); }
      });
      input.addEventListener("blur", save);
    }

    // しおりを削除する
    function deleteList(listId) {
      const data = loadLists();
      if (!data) return;
      const list = data.lists.find(l => l.id === listId);
      if (!list) return;
      if (!confirm(`「${list.name}」を削除しますか？\nスポットデータもすべて失われます。`)) return;

      data.lists = data.lists.filter(l => l.id !== listId);
      if (data.activeListId === listId) {
        data.activeListId = data.lists[0]?.id || null;
      }
      localStorage.setItem(LISTS_KEY, JSON.stringify(data));

      try {
        const schedRaw = localStorage.getItem("spot-map-schedule.v1");
        if (schedRaw) {
          const all = JSON.parse(schedRaw);
          delete all[listId];
          localStorage.setItem("spot-map-schedule.v1", JSON.stringify(all));
        }
      } catch {}

      try {
        const coverRaw = localStorage.getItem("trip-print-cover.v1");
        if (coverRaw) {
          const all = JSON.parse(coverRaw);
          delete all[listId];
          localStorage.setItem("trip-print-cover.v1", JSON.stringify(all));
        }
      } catch {}
      [
        `trip-packing-list.v1:${listId}`,
        `trip-packing-deleted.v1:${listId}`,
        `trip-travel-checklist.v1:${listId}`,
      ].forEach(key => localStorage.removeItem(key));

      render();
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // 画面を描画する
    function render() {
      const container = document.getElementById("bookmarkList");
      const data = loadLists();
      container.innerHTML = "";

      if (!data || data.lists.length === 0) {
        container.innerHTML = '<p class="bookmark-empty">まだしおりがありません。<br>下のフォームから最初のしおりを作りましょう！</p>';
        return;
      }

      data.lists.forEach((list, i) => {
        container.appendChild(buildCard(list, i * 60));
      });
    }

    // 新規作成ボタン
    document.getElementById("createBtn").addEventListener("click", () => {
      const input = document.getElementById("newListInput");
      const errEl = document.getElementById("formError");
      const name = input.value.trim();

      if (!name) {
        errEl.textContent = "しおりの名前を入力してください。";
        input.focus();
        return;
      }
      errEl.textContent = "";

      const data = loadLists() || { lists: [], activeListId: null };
      const newList = { id: makeId(), name, spots: [] };
      data.lists.push(newList);
      data.activeListId = newList.id;
      localStorage.setItem(LISTS_KEY, JSON.stringify(data));
      location.href = "./spots.html";
    });

    // Enterキーでも作成できる
    document.getElementById("newListInput").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("createBtn").click();
    });

    render();
  </script>
  <script src="./theme.js"></script>
</body>
