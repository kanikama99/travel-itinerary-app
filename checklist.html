<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>持ち物リスト - Trip Pop Map</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .tool-shell{width:min(1040px,calc(100% - 32px));margin:0 auto;padding:40px 0 80px;display:grid;gap:18px}.tool-title{font-size:clamp(1.7rem,4vw,2.25rem);margin:0}.tool-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px;box-shadow:0 5px 18px rgb(var(--shadow-base-rgb,149,90,48)/.10)}.check-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.check-card{background:rgba(255,255,255,.55);border:1px solid rgb(var(--accent-rgb,255,122,69)/.18);border-radius:12px;padding:16px;min-width:0}.check-card h3{margin:0 0 10px;color:var(--accent-deep)}.item{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px;align-items:start;padding:7px 0;font-weight:700;writing-mode:horizontal-tb}.item span{min-width:0;line-height:1.35;writing-mode:horizontal-tb;word-break:keep-all;overflow-wrap:anywhere;letter-spacing:0}.item input{margin-top:3px}.add-row{display:grid;grid-template-columns:1fr auto;gap:8px}.input{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.9)}.btn{border:1.5px solid var(--line);border-radius:999px;background:rgba(255,255,255,.72);color:var(--accent-deep);font:inherit;font-weight:900;padding:9px 14px;cursor:pointer}
  </style>
</head>
<body>
  <main class="tool-shell">
    <header><p class="panel-kicker">Packing List</p><h1 class="tool-title">持ち物リスト</h1></header>
    <section class="tool-card"><div class="add-row"><input id="newItem" class="input" placeholder="持ち物を追加"><button id="addBtn" class="btn" type="button">追加</button></div></section>
    <section class="check-grid" id="list"></section>
    <div class="page-nav page-nav--end"><a href="./schedule.html" class="page-nav-btn page-nav-btn--prev">スケジュールへ戻る</a></div>
  </main>
  <button id="hamburgerBtn" class="hamburger-btn" type="button" aria-label="メニューを開く"><span class="hamburger-line"></span><span class="hamburger-line"></span><span class="hamburger-line"></span></button>
  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="sideDrawer" class="side-drawer hidden" aria-hidden="true"><div class="drawer-head"><p class="drawer-kicker">Menu</p></div><nav class="drawer-nav"><a href="./bookmarks.html" class="drawer-nav-item"><span class="drawer-nav-icon">📒</span><span>しおりを選ぶ</span></a><a href="./spots.html" class="drawer-nav-item"><span class="drawer-nav-icon">📍</span><span>行きたい場所</span></a><a href="./schedule.html" class="drawer-nav-item"><span class="drawer-nav-icon">📅</span><span>スケジュール</span></a><a href="./flight.html" class="drawer-nav-item"><span class="drawer-nav-icon">✈</span><span>飛行機を見つける</span></a><a href="./tour.html" class="drawer-nav-item"><span class="drawer-nav-icon">🗺</span><span>ツアーを見つける</span></a><a href="./gourmet.html" class="drawer-nav-item"><span class="drawer-nav-icon">🍜</span><span>グルメを見つける</span></a><a href="./checklist.html" class="drawer-nav-item drawer-nav-item--active"><span class="drawer-nav-icon">📋</span><span>持ち物リスト</span></a><a href="./print.html" class="drawer-nav-item"><span class="drawer-nav-icon">🖨</span><span>印刷する</span></a><a href="./settings.html" class="drawer-nav-item"><span class="drawer-nav-icon">⚙</span><span>設定</span></a></nav></aside>
  <script>
    const KEY="trip-packing-list.v1",SETTINGS_KEY="spot-map-settings.v1";function theme(){try{const s=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}");const t=[["#fff3dd","#fffaf0","rgba(166,97,54,0.18)","#233038","#5f6d73","#ff7a45","#ce5428","255,122,69","149,90,48"],["#e8f4fd","#f0f8ff","rgba(54,120,166,0.18)","#1a2a3a","#4a6070","#4a9ede","#2d7ab5","74,158,222","45,100,165"],["#f0fdf4","#f7fff9","rgba(54,166,97,0.18)","#1a3323","#3a6050","#34c97a","#1fa85e","52,201,122","30,140,80"],["#fdf0f8","#fff7fd","rgba(166,54,140,0.18)","#2a1a2a","#5f3a5a","#d44ab0","#a83285","212,74,176","140,50,120"],["#fff8f0","#fffaf5","rgba(200,120,40,0.18)","#2a1800","#6a4a20","#e08020","#b05a10","224,128,32","160,80,20"],["#f5f0ff","#faf7ff","rgba(120,80,200,0.18)","#180a2a","#4a3a6a","#8060d0","#6040a8","128,96,208","80,60,150"],["#fff0f0","#fff7f7","rgba(166,54,54,0.18)","#2a0a0a","#6a3a3a","#e05050","#b03030","224,80,80","160,40,40"],["#f0fff8","#f5fffb","rgba(40,160,120,0.18)","#001a12","#1a4a3a","#28c890","#10a870","40,200,144","20,140,90"]][s.bgTheme??0];["--bg","--panel","--line","--text","--muted","--accent","--accent-deep","--accent-rgb","--shadow-base-rgb"].forEach((k,i)=>document.documentElement.style.setProperty(k,t[i]));document.documentElement.style.setProperty("--panel-strong",t[1]);}catch{}}function base(){return[{cat:"必需品",items:["財布","スマホ","充電器","身分証","保険証"]},{cat:"衣類",items:["下着","靴下","着替え","羽織り","寝巻き"]},{cat:"ケア",items:["常備薬","歯ブラシ","コンタクト用品","日焼け止め","ハンカチ"]},{cat:"旅行",items:["チケット","予約控え","折りたたみ傘","モバイルバッテリー","エコバッグ"]}]}function load(){return JSON.parse(localStorage.getItem(KEY)||"null")||base()}function save(d){localStorage.setItem(KEY,JSON.stringify(d))}function render(){const d=load(),box=document.getElementById("list");box.innerHTML="";d.forEach((g,gi)=>{const c=document.createElement("article");c.className="check-card";c.innerHTML=`<h3>${g.cat}</h3>`;g.items.forEach((it,ii)=>{const id=`c${gi}_${ii}`;const row=document.createElement("label");row.className="item";row.innerHTML=`<input id="${id}" type="checkbox" ${it.done?"checked":""}><span>${it.name||it}</span>`;row.querySelector("input").onchange=e=>{g.items[ii]=typeof it==="string"?{name:it,done:e.target.checked}:{...it,done:e.target.checked};save(d)};c.appendChild(row)});box.appendChild(c)})}document.getElementById("addBtn").onclick=()=>{const v=document.getElementById("newItem").value.trim();if(!v)return;const d=load();d[0].items.push({name:v,done:false});save(d);document.getElementById("newItem").value="";render()};const hb=document.getElementById("hamburgerBtn"),sd=document.getElementById("sideDrawer"),db=document.getElementById("drawerBackdrop");hb.onclick=()=>{const o=!sd.classList.contains("hidden");sd.classList.toggle("hidden",o);db.classList.toggle("hidden",o)};db.onclick=()=>{sd.classList.add("hidden");db.classList.add("hidden")};theme();render();
  </script>
  <script src="./theme.js"></script>
</body>
</html>
