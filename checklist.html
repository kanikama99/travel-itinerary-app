<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>持ち物リスト - Trip Pop Map</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .tool-shell{width:min(1040px,calc(100% - 32px));margin:0 auto;padding:40px 0 80px;display:grid;gap:18px}.tool-title{font-size:clamp(1.7rem,4vw,2.25rem);margin:0}.tool-card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-lg);padding:20px}.check-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.check-card{background:rgba(255,255,255,.55);border:1px solid rgb(var(--accent-rgb,255,122,69)/.18);border-radius:12px;padding:16px}.check-card h3{margin:0 0 10px;color:var(--accent-deep)}.item{display:grid;grid-template-columns:auto 1fr auto;gap:9px;align-items:center;padding:7px 0;font-weight:700}.item-name{overflow-wrap:anywhere}.delete-item{border:0;border-radius:999px;background:rgb(var(--accent-rgb,255,122,69)/.12);color:var(--accent-deep);font-weight:900;width:28px;height:28px;cursor:pointer}.add-row{display:grid;grid-template-columns:1fr auto;gap:8px}.input{font:inherit;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;background:rgba(255,255,255,.9)}.btn{border:1.5px solid var(--line);border-radius:999px;background:rgba(255,255,255,.72);color:var(--accent-deep);font:inherit;font-weight:900;padding:9px 14px;cursor:pointer}.hint{margin:8px 0 0;color:var(--muted);font-size:.88rem}
  </style>
</head>
<body>
  <main class="tool-shell">
    <header><p class="panel-kicker">Packing List</p><h1 class="tool-title">持ち物リスト</h1></header>
    <section class="tool-card"><div class="add-row"><input id="newItem" class="input" placeholder="持ち物を追加" /><button id="addBtn" class="btn" type="button">追加</button></div><p id="packingHint" class="hint"></p></section>
    <section class="check-grid" id="list"></section>
    <div class="page-nav page-nav--end"><a href="./schedule.html" class="page-nav-btn page-nav-btn--prev">スケジュールへ戻る</a></div>
  </main>
  <button id="hamburgerBtn" class="hamburger-btn" type="button" aria-label="メニューを開く"><span class="hamburger-line"></span><span class="hamburger-line"></span><span class="hamburger-line"></span></button>
  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="sideDrawer" class="side-drawer hidden" aria-hidden="true"><div class="drawer-head"><p class="drawer-kicker">Menu</p></div><nav class="drawer-nav"><a href="./bookmarks.html" class="drawer-nav-item"><span class="drawer-nav-icon">📒</span><span>しおりを選ぶ</span></a><a href="./spots.html" class="drawer-nav-item"><span class="drawer-nav-icon">📍</span><span>行きたい場所</span></a><a href="./schedule.html" class="drawer-nav-item"><span class="drawer-nav-icon">📅</span><span>スケジュール</span></a><a href="./hotel.html" class="drawer-nav-item"><span class="drawer-nav-icon">🏨</span><span>ホテルを見つける</span></a><a href="./tour.html" class="drawer-nav-item"><span class="drawer-nav-icon">🗺</span><span>ツアーを見つける</span></a><a href="./gourmet.html" class="drawer-nav-item"><span class="drawer-nav-icon">🍜</span><span>グルメを見つける</span></a><a href="./checklist.html" class="drawer-nav-item drawer-nav-item--active"><span class="drawer-nav-icon">📋</span><span>持ち物リスト</span></a><a href="./print.html" class="drawer-nav-item"><span class="drawer-nav-icon">🖨</span><span>印刷する</span></a><a href="./settings.html" class="drawer-nav-item"><span class="drawer-nav-icon">⚙</span><span>設定</span></a></nav></aside>
  <script>
    const KEY="trip-packing-list.v1",LISTS_KEY="spot-map-lists.v1";
    function base(){return[{cat:"必需品",items:["財布","スマホ","充電器","身分証","保険証"]},{cat:"衣類",items:["下着","靴下","着替え","羽織り","寝巻き"]},{cat:"ケア",items:["常備薬","歯ブラシ","コンタクト用品","日焼け止め","ハンカチ"]},{cat:"旅行",items:["チケット","予約控え","折りたたみ傘","モバイルバッテリー","エコバッグ"]}]}
    function norm(x){return typeof x==="string"?{name:x,done:false}:{name:x.name,done:!!x.done}}
    function load(){try{const raw=localStorage.getItem(KEY);return(raw?JSON.parse(raw):base()).map(g=>({...g,items:(g.items||[]).map(norm)}))}catch{return base().map(g=>({...g,items:g.items.map(norm)}))}}
    function save(d){localStorage.setItem(KEY,JSON.stringify(d))}
    function overseas(){try{const data=JSON.parse(localStorage.getItem(LISTS_KEY)||"{}");const list=data.lists?.find(l=>l.id===data.activeListId)||data.lists?.[0]||{};const text=[list.name,...(list.spots||[]).map(s=>s.name)].filter(Boolean).join(" ");if(/海外|韓国|台湾|中国|香港|タイ|シンガポール|ハワイ|アメリカ|フランス|イタリア|イギリス|オーストラリア/i.test(text))return true;return(list.spots||[]).some(s=>{const lat=Number(s.lat),lng=Number(s.lng);return Number.isFinite(lat)&&Number.isFinite(lng)&&(lat<20||lat>46||lng<122||lng>154)})}catch{return false}}
    function ensurePassport(d){if(!overseas())return d;const exists=d.some(g=>g.items.some(i=>norm(i).name==="パスポート"));if(!exists){d[0].items.unshift({name:"パスポート",done:false});save(d)}document.getElementById("packingHint").textContent="海外を含む可能性があるため、パスポートを提案しました。";return d}
    function render(){const d=ensurePassport(load());const box=document.getElementById("list");box.innerHTML="";d.forEach((g,gi)=>{const card=document.createElement("article");card.className="check-card";card.innerHTML=`<h3>${g.cat}</h3>`;g.items.forEach((it,ii)=>{const row=document.createElement("div");row.className="item";row.innerHTML=`<input type="checkbox" ${it.done?"checked":""}><span class="item-name">${it.name}</span><button class="delete-item" type="button">×</button>`;row.querySelector("input").onchange=e=>{g.items[ii]={...it,done:e.target.checked};save(d)};row.querySelector("button").onclick=()=>{g.items.splice(ii,1);save(d);render()};card.appendChild(row)});box.appendChild(card)})}
    document.getElementById("addBtn").onclick=()=>{const input=document.getElementById("newItem");const v=input.value.trim();if(!v)return;const d=load();d[0].items.push({name:v,done:false});save(d);input.value="";render()};const hb=document.getElementById("hamburgerBtn"),sd=document.getElementById("sideDrawer"),db=document.getElementById("drawerBackdrop");hb.onclick=()=>{const o=!sd.classList.contains("hidden");sd.classList.toggle("hidden",o);db.classList.toggle("hidden",o)};db.onclick=()=>{sd.classList.add("hidden");db.classList.add("hidden")};render();
  </script>
  <script src="./theme.js"></script>
</body>
</html>
