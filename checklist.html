<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>持ち物リスト - Trip Pop Map</title>
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .tool-shell { width: min(1040px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 80px; display: grid; gap: 18px; }
    .tool-title { font-size: clamp(1.7rem, 4vw, 2.25rem); margin: 0; }
    .tool-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; }
    .check-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; }
    .check-card {
      background: rgba(255,255,255,.55);
      border: 1px solid rgb(var(--accent-rgb,255,122,69)/.18);
      border-radius: 12px;
      padding: 16px;
    }
    .check-card.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; background: rgba(255,255,255,.75); }
    .check-card-header { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .check-cat-title {
      flex: 1; margin: 0;
      color: var(--accent-deep);
      cursor: pointer;
      border-radius: 6px;
      padding: 2px 4px;
      transition: background 0.15s;
    }
    .check-cat-title:hover { background: rgba(255,255,255,0.6); }
    .check-cat-input {
      flex: 1; font: inherit; font-size: 1rem; font-weight: 700; color: var(--accent-deep);
      border: 1.5px solid var(--accent); border-radius: 6px;
      padding: 2px 6px; background: rgba(255,255,255,0.9); outline: none;
    }
    .check-add-cat-btn {
      font-size: 0.78rem; padding: 2px 8px;
      border: 1px solid rgb(var(--accent-rgb,255,122,69)/.3);
      border-radius: 999px; background: transparent;
      color: var(--accent-deep); cursor: pointer; white-space: nowrap;
    }
    .check-add-cat-btn:hover { background: var(--accent-soft); }
    .item {
      display: grid;
      grid-template-columns: auto 1fr auto;
      gap: 9px;
      align-items: center;
      padding: 7px 0;
      font-weight: 700;
      cursor: grab;
      border-radius: 6px;
      transition: background 0.12s;
    }
    .item:hover { background: rgba(255,255,255,0.5); }
    .item.dragging { opacity: 0.4; }
    .item-name { word-break: keep-all; overflow-wrap: normal; }
    .delete-item {
      border: 0; border-radius: 999px;
      background: rgb(var(--accent-rgb,255,122,69)/.12);
      color: var(--accent-deep); width: 34px; height: 34px;
      cursor: pointer; display: grid; place-items: center;
    }
    .delete-item:hover { background: rgba(204,51,51,.12); color: #b33; }
    .delete-item svg { width: 16px; height: 16px; }
    .add-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
    .input { font: inherit; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; background: rgba(255,255,255,.9); }
    .btn { min-height: 44px; border: 1.5px solid var(--line); border-radius: 999px; background: rgba(255,255,255,.72); color: var(--accent-deep); font: inherit; font-weight: 900; padding: 9px 14px; cursor: pointer; }
    .hint { margin: 8px 0 0; color: var(--muted); font-size: .88rem; line-height: 1.6; }
    @media (max-width: 520px) { .add-row { grid-template-columns: 1fr; } .btn { width: 100%; } }
  </style>
</head>
<body>
  <main class="tool-shell">
    <header class="hero">
      <div class="hero-copy-wrap">
        <p class="eyebrow">Trip Pop Map</p>
        <h1>持ち物リスト</h1>
        <p class="hero-copy">旅行に必要な持ち物をチェックリストで管理できます。</p>
        <nav class="progress-steps" aria-label="ステップ">
          <a href="./spots.html" class="progress-step">①行きたい場所</a>
          <span class="progress-sep">›</span>
          <a href="./tripplan.html" class="progress-step">②優先順位入力</a>
          <span class="progress-sep">›</span>
          <a href="./schedule.html" class="progress-step">③スケジュール</a>
          <span class="progress-sep">›</span>
          <strong class="progress-step progress-step--current">④持ち物リスト</strong>
          <span class="progress-sep">›</span>
          <a href="./print.html" class="progress-step">⑤印刷する</a>
        </nav>
      </div>
    </header>

    <section class="tool-card">
      <div class="add-row">
        <input id="newItem" class="input" placeholder="持ち物を追加（Enterで確定）" />
        <button id="addBtn" class="btn" type="button">追加</button>
      </div>
      <p id="packingHint" class="hint"></p>
    </section>
    <section class="check-grid" id="list"></section>
  </main>

  <nav class="page-nav-bar">
    <a href="./schedule.html" class="page-nav-bar-btn page-nav-bar-btn--prev">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
      スケジュール
    </a>
    <a href="./print.html" class="page-nav-bar-btn page-nav-bar-btn--next">
      印刷する
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  </nav>

  <button id="hamburgerBtn" class="hamburger-btn" type="button" aria-label="メニューを開く">
    <span class="hamburger-line"></span><span class="hamburger-line"></span><span class="hamburger-line"></span>
  </button>
  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="sideDrawer" class="side-drawer hidden" aria-hidden="true">
    <div class="drawer-head"><p class="drawer-kicker">Menu</p></div>
    <nav class="drawer-nav">
      <a href="./bookmarks.html" class="drawer-nav-item"><span class="drawer-nav-icon">★</span><span>しおりを選ぶ</span></a>
      <a href="./hotel.html" class="drawer-nav-item"><span class="drawer-nav-icon">H</span><span>ホテルを見つける</span></a>
      <a href="./howto.html" class="drawer-nav-item"><span class="drawer-nav-icon">?</span><span>使い方</span></a>
      <a href="./settings.html" class="drawer-nav-item"><span class="drawer-nav-icon">⚙</span><span>設定</span></a>
    </nav>
  </aside>

  <script>
    const KEY = "trip-packing-list.v1";
    const DELETED_KEY = "trip-packing-deleted.v1";
    const LISTS_KEY = "spot-map-lists.v1";

    const BASE_GROUPS = [
      { cat: "基本",   items: ["財布","スマートフォン","充電器","身分証","保険証","免許証","爪切り","ティッシュ","髭剃り"] },
      { cat: "衣類",   items: ["下着","靴下","着替え","羽織り","寝巻き"] },
      { cat: "ケア",   items: ["常備薬","歯ブラシ","コンタクト用品","日焼け止め","ハンカチ"] },
      { cat: "旅先",   items: ["チケット","予約確認","折りたたみ傘","モバイルバッテリー","エコバッグ"] },
      { cat: "条件付き", items: [] }
    ];

    const COUNTRY_RULES = [
      { name: "韓国",       pattern: /韓国|ソウル|釜山|済州/i,                    plug: "C・F",   currency: "韓国ウォン" },
      { name: "台湾",       pattern: /台湾|台北|高雄|台中/i,                      plug: "A・B",   currency: "台湾ドル" },
      { name: "中国",       pattern: /中国|上海|北京|深圳|広州/i,                  plug: "A・C・I", currency: "人民元" },
      { name: "香港",       pattern: /香港/i,                                    plug: "BF",     currency: "香港ドル" },
      { name: "タイ",       pattern: /タイ|バンコク|プーケット|チェンマイ/i,         plug: "A・B・C", currency: "タイバーツ" },
      { name: "シンガポール", pattern: /シンガポール/i,                             plug: "BF",     currency: "シンガポールドル" },
      { name: "アメリカ",   pattern: /アメリカ|ハワイ|グアム|ニューヨーク|ロサンゼルス/i, plug: "A・B", currency: "米ドル" },
      { name: "フランス",   pattern: /フランス|パリ/i,                             plug: "C・E",   currency: "ユーロ" },
      { name: "イタリア",   pattern: /イタリア|ローマ|ミラノ|ベネチア/i,            plug: "C・F・L", currency: "ユーロ" },
      { name: "イギリス",   pattern: /イギリス|英国|ロンドン/i,                     plug: "BF",     currency: "英ポンド" },
      { name: "オーストラリア", pattern: /オーストラリア|シドニー|メルボルン/i,      plug: "O",      currency: "豪ドル" }
    ];

    // ── ユーティリティ ──
    function normItem(x) {
      return typeof x === "string" ? { name: x, done: false } : { name: x.name || x.text || "", done: !!x.done };
    }
    function normCat(cat) {
      // 過去データの名前揺れを統一
      if (/^旅(行先?|先)$/.test(cat)) return "旅先";
      return cat;
    }
    function readDeleted() {
      try { return new Set(JSON.parse(localStorage.getItem(DELETED_KEY) || "[]")); }
      catch { return new Set(); }
    }
    function writeDeleted(set) { localStorage.setItem(DELETED_KEY, JSON.stringify([...set])); }
    function forgetDeleted(name) { const d = readDeleted(); d.delete(name); writeDeleted(d); }
    function rememberDeleted(name) { const d = readDeleted(); d.add(name); writeDeleted(d); }

    // カテゴリ名重複をマージ
    function mergeDuplicateCats(d) {
      const seen = {};
      const result = [];
      d.forEach(g => {
        const key = normCat(g.cat);
        if (seen[key] !== undefined) {
          result[seen[key]].items = [...result[seen[key]].items, ...g.items];
        } else {
          seen[key] = result.length;
          result.push({ cat: key, items: [...g.items] });
        }
      });
      return result;
    }

    function base() {
      const deleted = readDeleted();
      return BASE_GROUPS.map(g => ({
        cat: g.cat,
        items: g.items.filter(name => !deleted.has(name)).map(normItem)
      }));
    }

    function load() {
      try {
        const raw = localStorage.getItem(KEY);
        if (!raw) return base();
        const parsed = JSON.parse(raw).map(g => ({ cat: normCat(g.cat), items: (g.items || []).map(normItem) }));
        return mergeDuplicateCats(parsed);
      } catch { return base(); }
    }

    function save(d) { localStorage.setItem(KEY, JSON.stringify(d)); }

    function activeTripText() {
      try {
        const data = JSON.parse(localStorage.getItem(LISTS_KEY) || "{}");
        const list = data.lists?.find(l => l.id === data.activeListId) || data.lists?.[0] || {};
        return { list, text: [list.name, ...(list.spots || []).map(s => s.name)].filter(Boolean).join(" ") };
      } catch { return { list: {}, text: "" }; }
    }

    function isOverseas(list, text) {
      if (/海外|韓国|台湾|中国|香港|タイ|シンガポール|ハワイ|アメリカ|フランス|イタリア|イギリス|オーストラリア/i.test(text)) return true;
      return (list.spots || []).some(s => {
        const lat = Number(s.lat), lng = Number(s.lng);
        return Number.isFinite(lat) && Number.isFinite(lng) && (lat < 20 || lat > 46 || lng < 122 || lng > 154);
      });
    }

    function countryRule(text) { return COUNTRY_RULES.find(r => r.pattern.test(text)); }

    function ensureGroup(d, cat) {
      cat = normCat(cat);
      let g = d.find(g => normCat(g.cat) === cat);
      if (!g) { g = { cat, items: [] }; d.push(g); }
      else { g.cat = cat; }
      return g;
    }

    function hasItem(d, name) { return d.some(g => g.items.some(it => normItem(it).name === name)); }

    function addSuggested(d, name) {
      if (readDeleted().has(name) || hasItem(d, name)) return false;
      ensureGroup(d, "条件付き").items.push({ name, done: false });
      return true;
    }

    function mergeDefaults(d) {
      const deleted = readDeleted();
      BASE_GROUPS.forEach(group => {
        const target = ensureGroup(d, group.cat);
        group.items.forEach(name => {
          if (deleted.has(name)) return;
          if (!target.items.some(it => normItem(it).name === name)) target.items.push({ name, done: false });
        });
      });
      return mergeDuplicateCats(d);
    }

    function enrich(d) {
      d = mergeDefaults(d);
      const { list, text } = activeTripText();
      const overseas = isOverseas(list, text);
      const rule = countryRule(text);
      const notes = [];
      if (overseas) {
        ["パスポート","セキュリティポーチ","海外SIM"].forEach(item => {
          if (addSuggested(d, item)) notes.push(`${item}を追加しました。`);
        });
        if (rule) {
          if (addSuggested(d, `現地通貨（${rule.currency}）`)) notes.push(`${rule.name}向けの現地通貨を追加しました。`);
          if (addSuggested(d, `変換プラグ（${rule.plug}タイプ）`)) notes.push(`${rule.name}向けの変換プラグを追加しました。`);
        } else {
          if (addSuggested(d, "現地通貨")) notes.push("海外向けの現地通貨を追加しました。");
          if (addSuggested(d, "変換プラグ（渡航先に合わせて確認）")) notes.push("海外向けの変換プラグを追加しました。");
        }
      }
      document.getElementById("packingHint").textContent = notes.length
        ? notes.join(" ")
        : (overseas ? "海外旅行向けの条件付き持ち物を確認できます。" : "国内旅行向けの基本リストです。");
      save(d);
      return d;
    }

    function trashIcon() {
      return '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 11v5"/><path d="M14 11v5"/></svg>';
    }

    // ── ドラッグ&ドロップ状態 ──
    let dragState = null; // { groupIdx, itemIdx }

    // ── タイトル編集 ──
    function startEditCat(gi, titleEl, d) {
      const input = document.createElement("input");
      input.type = "text";
      input.className = "check-cat-input";
      input.value = d[gi].cat;
      titleEl.replaceWith(input);
      input.focus();
      input.select();

      const finish = () => {
        const newName = input.value.trim() || d[gi].cat;
        d[gi].cat = newName;
        save(d);
        render(d);
      };
      input.addEventListener("blur", finish);
      input.addEventListener("keydown", e => {
        if (e.key === "Enter") { e.preventDefault(); input.blur(); }
        if (e.key === "Escape") { input.value = d[gi].cat; input.blur(); }
      });
    }

    // ── 描画 ──
    function render(d) {
      const box = document.getElementById("list");
      box.innerHTML = "";

      d.forEach((g, gi) => {
        const card = document.createElement("article");
        card.className = "check-card";
        card.dataset.gi = gi;

        // ヘッダー（タイトル編集可）
        const header = document.createElement("div");
        header.className = "check-card-header";

        const titleEl = document.createElement("h3");
        titleEl.className = "check-cat-title";
        titleEl.textContent = g.cat;
        titleEl.title = "クリックしてタイトルを編集";
        titleEl.addEventListener("click", () => startEditCat(gi, titleEl, d));
        header.appendChild(titleEl);

        const addItemBtn = document.createElement("button");
        addItemBtn.type = "button";
        addItemBtn.className = "check-add-cat-btn";
        addItemBtn.textContent = "+ 追加";
        addItemBtn.addEventListener("click", () => {
          const name = prompt(`「${g.cat}」に追加する持ち物を入力してください`, "");
          if (!name?.trim()) return;
          forgetDeleted(name.trim());
          d[gi].items.push({ name: name.trim(), done: false });
          save(d);
          render(d);
        });
        header.appendChild(addItemBtn);

        const delGroupBtn = document.createElement("button");
        delGroupBtn.type = "button";
        delGroupBtn.className = "check-add-cat-btn";
        delGroupBtn.title = "このグループを削除";
        delGroupBtn.innerHTML = trashIcon();
        delGroupBtn.style.width = "30px";
        delGroupBtn.style.height = "30px";
        delGroupBtn.style.display = "grid";
        delGroupBtn.style.placeItems = "center";
        delGroupBtn.style.padding = "0";
        delGroupBtn.addEventListener("click", () => {
          const msg = g.items.length > 0
            ? `「${g.cat}」（${g.items.length}件）を削除しますか？`
            : `「${g.cat}」を削除しますか？`;
          if (!confirm(msg)) return;
          d.splice(gi, 1);
          save(d);
          render(d);
        });
        header.appendChild(delGroupBtn);

        card.appendChild(header);

        if (g.items.length === 0) {
          const empty = document.createElement("p");
          empty.style.cssText = "color:var(--muted);font-size:.85rem;margin:6px 0 0;";
          empty.textContent = "アイテムがありません";
          card.appendChild(empty);
        }

        // アイテム一覧
        g.items.forEach((it, ii) => {
          const item = normItem(it);
          const row = document.createElement("div");
          row.className = "item";
          row.draggable = true;
          row.dataset.ii = ii;

          const cb = document.createElement("input");
          cb.type = "checkbox";
          cb.checked = item.done;
          cb.addEventListener("change", e => {
            g.items[ii] = { ...item, done: e.target.checked };
            save(d);
          });

          const nameSpan = document.createElement("span");
          nameSpan.className = "item-name";
          nameSpan.textContent = item.name;

          const delBtn = document.createElement("button");
          delBtn.type = "button";
          delBtn.className = "delete-item";
          delBtn.setAttribute("aria-label", "この持ち物を削除");
          delBtn.innerHTML = trashIcon();
          delBtn.addEventListener("click", () => {
            rememberDeleted(item.name);
            g.items.splice(ii, 1);
            save(d);
            render(d);
          });

          row.appendChild(cb);
          row.appendChild(nameSpan);
          row.appendChild(delBtn);

          // ドラッグ開始
          row.addEventListener("dragstart", e => {
            dragState = { groupIdx: gi, itemIdx: ii };
            e.dataTransfer.effectAllowed = "move";
            setTimeout(() => row.classList.add("dragging"), 0);
          });
          row.addEventListener("dragend", () => {
            row.classList.remove("dragging");
            dragState = null;
          });

          card.appendChild(row);
        });

        // ドロップゾーン（カード全体）
        card.addEventListener("dragover", e => {
          if (!dragState) return;
          e.preventDefault();
          card.classList.add("drag-over");
        });
        card.addEventListener("dragleave", e => {
          if (!card.contains(e.relatedTarget)) card.classList.remove("drag-over");
        });
        card.addEventListener("drop", e => {
          e.preventDefault();
          card.classList.remove("drag-over");
          if (!dragState) return;
          const { groupIdx: fromGi, itemIdx: fromIi } = dragState;
          if (fromGi === gi) return; // 同じカード内は無視
          const [moved] = d[fromGi].items.splice(fromIi, 1);
          d[gi].items.push(moved);
          dragState = null;
          save(d);
          render(d);
        });

        box.appendChild(card);
      });

      // 新しいグループを追加するボタン
      const addCatCard = document.createElement("article");
      addCatCard.className = "check-card";
      addCatCard.style.display = "flex";
      addCatCard.style.alignItems = "center";
      addCatCard.style.justifyContent = "center";
      addCatCard.style.minHeight = "80px";
      addCatCard.style.cursor = "pointer";
      addCatCard.style.color = "var(--muted)";
      addCatCard.style.fontSize = "0.88rem";
      addCatCard.textContent = "+ グループを追加";
      addCatCard.addEventListener("click", () => {
        const name = prompt("新しいグループ名を入力してください", "");
        if (!name?.trim()) return;
        d.push({ cat: name.trim(), items: [] });
        save(d);
        render(d);
      });
      box.appendChild(addCatCard);
    }

    // ── 初期化 ──
    let checklistData = enrich(load());
    render(checklistData);

    document.getElementById("addBtn").addEventListener("click", () => {
      const input = document.getElementById("newItem");
      const v = input.value.trim();
      if (!v) return;
      forgetDeleted(v);
      checklistData = load();
      ensureGroup(checklistData, "基本").items.push({ name: v, done: false });
      save(checklistData);
      input.value = "";
      render(checklistData);
    });

    document.getElementById("newItem").addEventListener("keydown", e => {
      if (e.key === "Enter") document.getElementById("addBtn").click();
    });

    const hb = document.getElementById("hamburgerBtn");
    const sd = document.getElementById("sideDrawer");
    const db = document.getElementById("drawerBackdrop");
    hb.addEventListener("click", () => {
      const o = !sd.classList.contains("hidden");
      sd.classList.toggle("hidden", o);
      db.classList.toggle("hidden", o);
    });
    db.addEventListener("click", () => {
      sd.classList.add("hidden");
      db.classList.add("hidden");
    });
  </script>
  <script src="./theme.js"></script>
</body>
</html>
