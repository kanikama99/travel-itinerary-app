            saveSchedule(schedule);
            renderDays();
          };
          stayHourInput.addEventListener("click", e => e.stopPropagation());
          stayHourInput.addEventListener("change", saveStayTime);
          stayInput.addEventListener("click", e => e.stopPropagation());
          stayInput.addEventListener("change", saveStayTime);
          noteInput.addEventListener("click", e => e.stopPropagation());
          noteInput.addEventListener("change", e => { entry.note = e.target.value; saveSchedule(schedule); });
          upBtn.addEventListener("click", e => {
            e.stopPropagation();
            const i = day.entries.indexOf(entry);
            if (i > 0) [day.entries[i-1], day.entries[i]] = [day.entries[i], day.entries[i-1]];
            saveSchedule(schedule); renderAll();
          });
          downBtn.addEventListener("click", e => {
            e.stopPropagation();
            const i = day.entries.indexOf(entry);
            if (i < day.entries.length - 1) [day.entries[i], day.entries[i+1]] = [day.entries[i+1], day.entries[i]];
            saveSchedule(schedule); renderAll();
          });
          removeBtn.addEventListener("click", e => {
            e.stopPropagation();
            day.entries = day.entries.filter(en => en.id !== entry.id);
            saveSchedule(schedule); renderAll();
          });

          // ドラッグ（並び替え・日程間移動）
          row.draggable = true;
          row.addEventListener("dragstart", e => {
            dragState = { spotId: step.spotId, fromDayId: day.id };
            e.dataTransfer.setData("text/plain", step.spotId);
            e.dataTransfer.effectAllowed = "move";
            setTimeout(() => row.classList.add("tl-dragging"), 0);
          });
          row.addEventListener("dragend", () => { row.classList.remove("tl-dragging"); dragState = null; });

          row.addEventListener("dragover", e => {
            if (!dragState) return;
            e.preventDefault(); e.stopPropagation();
            e.dataTransfer.dropEffect = "move";
            const before = e.clientY < row.getBoundingClientRect().top + row.getBoundingClientRect().height / 2;
            row.classList.toggle("tl-drop-before", before);
            row.classList.toggle("tl-drop-after", !before);
          });
          row.addEventListener("dragleave", e => {
            if (!row.contains(e.relatedTarget)) row.classList.remove("tl-drop-before", "tl-drop-after");
          });
          row.addEventListener("drop", e => {
            e.preventDefault(); e.stopPropagation();
            const dropBefore = row.classList.contains("tl-drop-before");
            row.classList.remove("tl-drop-before", "tl-drop-after");
            const spotId = dragState?.spotId || e.dataTransfer.getData("text/plain");
            if (!spotId || spotId === step.spotId) { dragState = null; return; }
            if (dragState?.fromDayId && dragState.fromDayId !== day.id) {
              const srcDay = schedule.days.find(d => d.id === dragState.fromDayId);
              if (srcDay) srcDay.entries = srcDay.entries.filter(en => en.spotId !== spotId);
            }
            const existingEntry = day.entries.find(en => en.spotId === spotId);
            if (existingEntry) {
              day.entries = day.entries.filter(en => en.spotId !== spotId);
              const tIdx = day.entries.findIndex(en => en.spotId === step.spotId);
              day.entries.splice(dropBefore ? tIdx : tIdx + 1, 0, existingEntry);
            } else {
              const spot = getSpotById(spotId);
              if (!spot) { dragState = null; return; }
              const newEntry = { id: makeId(), spotId, time: "", note: "" };
              if (!day.stayTimes) day.stayTimes = {};
              day.stayTimes[spotId] = (schedule.defaultStayTimes?.[spotId]) ?? getSpotStayDefault(spot);
              const tIdx = day.entries.findIndex(en => en.spotId === step.spotId);
              day.entries.splice(dropBefore ? tIdx : tIdx + 1, 0, newEntry);
            }
            dragState = null;
            saveSchedule(schedule); renderAll();
          });
        }

        wrap.appendChild(row);
      });

      if (skipped.length > 0) {
        const warn = document.createElement("p");
        warn.className = "tl-over-warn";
        warn.textContent = `⚠ 時間内に収まらなかったスポット: ${skipped.join("、")}`;
        wrap.appendChild(warn);
      }

      return wrap;
    }

    function renderDayCard(container, day, idx) {
      ensureDayDefaults(day);

      const card = document.createElement("div");
      card.className = "day-card";
      card.dataset.dayId = day.id;

      // ── ヘッダー ──
      const header = document.createElement("div");
      header.className = "day-header";
      header.innerHTML = `
        <div class="day-number">${idx + 1}</div>
        <div class="day-header-info">
          <input class="day-label-input" type="text" value="${escHtml(day.label)}" placeholder="ラベル（例：1日目）" />
          ${day.date ? `<span class="day-date-display">${formatDate(day.date)}</span>` : ""}
        </div>
      `;
      header.querySelector(".day-label-input").addEventListener("change", e => {
        day.label = e.target.value.trim() || `${idx + 1}日目`;
        saveSchedule(schedule);
      });
      card.appendChild(header);

      // ── 移動時間設定 ──
      const travelRow = document.createElement("div");
      travelRow.className = "travel-row";
      travelRow.innerHTML = `
        <span class="travel-label">スポット間の移動時間（目安）</span>
        <input class="travel-min-input" type="number" min="0" max="180" step="5" value="${day.travelMinutes}" />
        <span class="travel-min-suffix">分</span>
      `;
      travelRow.querySelector(".travel-min-input").addEventListener("change", e => {
        day.travelMinutes = Math.max(0, parseInt(e.target.value) || 20);
        saveSchedule(schedule);
        renderDays();
      });
      card.appendChild(travelRow);

      // 中日（非初日・非最終日）の開始/終了時刻編集行
      const isFirst = idx === 0;
      const isLast  = idx === schedule.days.length - 1;
      if (!isFirst || !isLast) { // 1日のみ旅行では非表示
        const timeRow = document.createElement("div");
        timeRow.className = "day-time-row";
        const startLabel = document.createElement("span");
        startLabel.className = "day-time-label";
        startLabel.textContent = isFirst ? "終了" : "開始";
        const startInput = document.createElement("input");
        startInput.type  = "time";
        startInput.className = "day-time-input";
        if (isFirst) {
          startInput.value = day.endTime || "21:00";
          startInput.title = "1日目の終了時刻";
          startInput.addEventListener("change", e => { day.endTime = e.target.value; saveSchedule(schedule); renderDays(); });
        } else {
          startInput.value = day.startTime || "09:00";
          startInput.title = "この日の開始時刻（前泊チェックアウト後）";
          startInput.addEventListener("change", e => { day.startTime = e.target.value; saveSchedule(schedule); renderDays(); });
        }
        timeRow.appendChild(startLabel);
        timeRow.appendChild(startInput);
        if (!isFirst && !isLast) {
          const sep = document.createElement("span");
          sep.className = "day-time-sep";
          sep.textContent = "〜";
          const endLabel = document.createElement("span");
          endLabel.className = "day-time-label";
          endLabel.textContent = "終了";
          const endInput = document.createElement("input");
          endInput.type  = "time";
          endInput.className = "day-time-input";
          endInput.value = day.endTime || "21:00";
          endInput.title = "この日の終了時刻（ホテルチェックイン前）";
          endInput.addEventListener("change", e => { day.endTime = e.target.value; saveSchedule(schedule); renderDays(); });
          timeRow.appendChild(sep);
          timeRow.appendChild(endLabel);
          timeRow.appendChild(endInput);
        }
        card.appendChild(timeRow);
      }

      card.appendChild(renderUnifiedTimeline(day, idx, schedule.days.length));
      container.appendChild(card);
    }

    function renderAll() {
      renderDays();
      renderUnscheduled();
      scheduleTransitFetches();
    }

    // ── 日付ピッカー ──────────────────────────────────────────────

    function openDayPicker(spot) {
      if (schedule.days.length === 0) {
        alert("集合日と解散日を設定すると日程が自動作成されます。");
        return;
      }
      pendingSpot = spot;
      const overlay = document.getElementById("dayPickerOverlay");
      const list    = document.getElementById("dayPickerList");
      document.getElementById("dayPickerTitle").textContent = `「${spot.name}」をどの日に追加しますか？`;
      list.innerHTML = "";

      schedule.days.forEach((day, idx) => {
        const btn = document.createElement("button");
        btn.className = "day-picker-item";
        btn.type = "button";
        btn.innerHTML = `<span style="font-weight:700;color:var(--accent-deep)">${idx + 1}</span>&nbsp; ${escHtml(day.label)}${day.date ? `<span style="margin-left:8px;font-size:.78rem;color:var(--muted)">${escHtml(day.date)}</span>` : ""}`;
        btn.addEventListener("click", () => {
          day.entries.push({ id: makeId(), spotId: pendingSpot.id, time: "", note: "" });
          if (!day.stayTimes) day.stayTimes = {};
          day.stayTimes[pendingSpot.id] = (schedule.defaultStayTimes?.[pendingSpot.id]) ?? getDefaultStayTime(pendingSpot.spotCategory);
          saveSchedule(schedule);
          renderAll();
          closeDayPicker();
        });
        list.appendChild(btn);
      });

      overlay.classList.remove("hidden");
    }

    function closeDayPicker() {
      document.getElementById("dayPickerOverlay").classList.add("hidden");
      pendingSpot = null;
    }

    // ── 旅程設定イベント ──────────────────────────────────────────

    function bindTripSettingsEvents() {
      // 日付変更 → 日程自動生成
      ["tripMeetDate", "tripDismissDate"].forEach(key => {
        document.getElementById(key).addEventListener("change", e => {
          schedule[key] = e.target.value;
          saveSchedule(schedule);
          autoFixDismissDate();
          syncDaysToDateRange();
        });
      });
      // 時刻・場所変更 → プラン再描画
      ["tripMeetTime", "tripMeetPlace", "tripDismissTime", "tripDismissPlace"].forEach(key => {
        document.getElementById(key).addEventListener("change", e => {
          schedule[key] = e.target.value;
          saveSchedule(schedule);
          if (key === "tripMeetTime" || key === "tripDismissTime") autoFixDismissDate();
          renderAll();
        });
      });

      document.getElementById("travelModeSelect").addEventListener("change", e => {
        schedule.travelMode = e.target.value === "driving" ? "driving" : "transit";
        schedule.transitCache = {};
        saveSchedule(schedule);
        renderAll();
      });

      document.getElementById("tripMeetSpotSelect").addEventListener("change", e => {
        if (!e.target.value) return;
        const spot = setExclusiveSpotCategory(e.target.value, "meet");
        if (spot) schedule.tripMeetPlace = spot.name;
        saveSchedule(schedule);
        renderAll();
      });
      document.getElementById("tripDismissSpotSelect").addEventListener("change", e => {
        if (!e.target.value) return;
        const spot = setExclusiveSpotCategory(e.target.value, "dismiss");
        if (spot) schedule.tripDismissPlace = spot.name;
        saveSchedule(schedule);
        renderAll();
      });
      document.getElementById("tripMeetAddBtn").addEventListener("click", () => addTripPlaceSpot("meet"));
      document.getElementById("tripDismissAddBtn").addEventListener("click", () => addTripPlaceSpot("dismiss"));
    }

    function addTripPlaceSpot(category) {
      if (!activeList) return;
      const inputId = category === "meet" ? "tripMeetPlace" : "tripDismissPlace";
      const key = category === "meet" ? "tripMeetPlace" : "tripDismissPlace";
      const input = document.getElementById(inputId);
      const name = input.value.trim();
      if (!name) { input.focus(); return; }

      if (!Array.isArray(activeList.spots)) activeList.spots = [];
      const spot = {
        id: makeId(),
        name,
        description: "",
        budget: 0,
        type: "spot",
        spotCategory: "other",
        spotRole: category,
        spotRoles: [category],
        lat: null,
        lng: null,
        sourceType: "manual"
      };
      activeList.spots = activeList.spots.map(s => {
        const roles = getSpotRoles(s).filter(role => role !== category);
        return { ...s, spotRoles: roles, spotRole: roles[0] || "" };
      });
      activeList.spots.push(spot);
      schedule[key] = name;
      saveActiveList();
      saveSchedule(schedule);
      renderAll();
    }

    // ── 自動配置 ──────────────────────────────────────────────────

    function pickAutoPlaceDay(spot, fallbackIndex) {
      const totalDays = schedule.days.length;
      const candidates = schedule.days
        .map((day, idx) => ({ day, idx, count: (day.entries || []).length }))
        .filter(({ day, idx }) => canPlaceWithinHours(day, idx, totalDays, spot))
        .sort((a, b) => a.count - b.count || a.idx - b.idx);
      if (candidates.length > 0) return candidates[0].idx;
      return fallbackIndex % totalDays;
    }

    document.getElementById("autoPlaceBtn").addEventListener("click", () => {
      if (schedule.days.length === 0) {
        alert("先に集合日と解散日を設定してください。");
        return;
      }
      const scheduledIds = new Set(schedule.days.flatMap(d => (d.entries || []).map(e => e.spotId)));
      const unscheduled  = getOrderedSpots().filter(s => !scheduledIds.has(s.id));
      if (unscheduled.length === 0) {
        alert("配置できるスポットがありません。");
        return;
      }
      // カテゴリが meet/dismiss のスポットは初日・最終日に優先配置、残りは均等配分
      const meetDismiss = unscheduled.filter(s => isMeetSpot(s) || isDismissSpot(s));
      const others      = unscheduled.filter(s => !isMeetSpot(s) && !isDismissSpot(s));
      meetDismiss.forEach((spot, i) => {
        const dayIdx = i === 0 ? 0 : schedule.days.length - 1;
        const day    = schedule.days[dayIdx];
        if (day.entries.some(en => en.spotId === spot.id)) return;
        day.entries.push({ id: makeId(), spotId: spot.id, time: "", note: "" });
        if (!day.stayTimes) day.stayTimes = {};
        day.stayTimes[spot.id] = (schedule.defaultStayTimes?.[spot.id]) ?? getSpotStayDefault(spot);
      });
      others.forEach((spot, i) => {
        const dayIdx = pickAutoPlaceDay(spot, i);
        const day    = schedule.days[dayIdx];
        if (day.entries.some(en => en.spotId === spot.id)) return;
        day.entries.push({ id: makeId(), spotId: spot.id, time: "", note: "" });
        if (!day.stayTimes) day.stayTimes = {};
        day.stayTimes[spot.id] = (schedule.defaultStayTimes?.[spot.id]) ?? getSpotStayDefault(spot);
      });
      schedule.days.forEach((day, idx) => {
        const plan = generatePlan(day, idx, schedule.days.length);
        if (!plan.skipped.length) return;
        const skippedNames = new Set(plan.skipped);
        day.entries = (day.entries || []).filter(en => !skippedNames.has(getSpotById(en.spotId)?.name));
      });
      saveSchedule(schedule);
      renderAll();
    });

    document.getElementById("returnAllSpotsBtn").addEventListener("click", () => {
      if (!schedule.days.length) {
        alert("戻すスポットがありません。");
        return;
      }
      const scheduledCount = schedule.days.reduce((sum, day) => sum + (day.entries || []).length, 0);
      if (scheduledCount === 0) {
        alert("すでにすべてSPOTSにあります。");
        return;
      }
      if (!confirm(`配置済みスポット${scheduledCount}件をすべてSPOTSへ戻します。日程の日付やホテル登録は残ります。`)) return;
      schedule.days.forEach(day => {
        day.entries = [];
        day.stayTimes = {};
      });
      schedule.transitCache = {};
      saveSchedule(schedule);
      renderAll();
    });

    // ── ハンバーガーメニュー ──────────────────────────────────────

    const hamburgerBtn   = document.getElementById("hamburgerBtn");
    const drawerBackdrop = document.getElementById("drawerBackdrop");
    const sideDrawer     = document.getElementById("sideDrawer");

    function openDrawer() {
      sideDrawer.classList.remove("hidden");
      drawerBackdrop.classList.remove("hidden");
      sideDrawer.setAttribute("aria-hidden", "false");
    }
    function closeDrawer() {
      sideDrawer.classList.add("hidden");
      drawerBackdrop.classList.add("hidden");
      sideDrawer.setAttribute("aria-hidden", "true");
    }

    hamburgerBtn.addEventListener("click", openDrawer);
    drawerBackdrop.addEventListener("click", closeDrawer);

    // ── 初期化 ────────────────────────────────────────────────────

    document.getElementById("dayPickerCancel").addEventListener("click", closeDayPicker);
    document.getElementById("dayPickerOverlay").addEventListener("click", e => {
      if (e.target === e.currentTarget) closeDayPicker();
    });

    // SPOTSリストへのドロップ（配置済みスポットを戻す）
    const unscheduledListEl = document.getElementById("unscheduledList");
    unscheduledListEl.addEventListener("dragover", e => {
      if (dragState?.fromDayId) {
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        unscheduledListEl.classList.add("drag-over");
      }
    });
    unscheduledListEl.addEventListener("dragleave", e => {
      if (!unscheduledListEl.contains(e.relatedTarget)) unscheduledListEl.classList.remove("drag-over");
    });
    unscheduledListEl.addEventListener("drop", e => {
      e.preventDefault();
      unscheduledListEl.classList.remove("drag-over");
      if (!dragState?.fromDayId) return;
      const { spotId, fromDayId } = dragState;
      dragState = null;
      const srcDay = schedule.days.find(d => d.id === fromDayId);
      if (srcDay) {
        srcDay.entries = srcDay.entries.filter(en => en.spotId !== spotId);
        saveSchedule(schedule);
        renderAll();
      }
    });

    bindTripSettingsEvents();

    activeList = loadActiveList();
    if (activeList) {
      document.getElementById("listNameBadge").textContent = activeList.name;
      schedule = loadSchedule(activeList.id);
    } else {
      document.getElementById("listNameBadge").textContent = "リスト未選択";
      schedule = { listId: "", days: [] };
      ensureScheduleDefaults(schedule);
    }

    // 集合場所・解散場所カテゴリのスポットからテキスト欄を自動入力する
    function autoFillFromCategories() {
      if (!activeList?.spots) return;
      let changed = false;
      if (!schedule.tripMeetPlace) {
        const meetSpot = activeList.spots.find(isMeetSpot);
        if (meetSpot) { schedule.tripMeetPlace = meetSpot.name; changed = true; }
      }
      if (!schedule.tripDismissPlace) {
        const dismissSpot = activeList.spots.find(isDismissSpot);
        if (dismissSpot) { schedule.tripDismissPlace = dismissSpot.name; changed = true; }
      }
      if (changed) saveSchedule(schedule);
    }

    autoFillFromCategories();
    renderTripSettings();
    updateTripSummary();
    syncDaysToDateRange();
    renderAll();
  </script>
</body>
</html>
