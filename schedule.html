<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>スケジュール — Trip Pop Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .schedule-shell {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 40px 0 80px;
      display: flex;
      flex-direction: column;
      gap: 28px;
    }
    .schedule-header { display: flex; align-items: flex-end; gap: 20px; flex-wrap: wrap; }
    .schedule-header-left { flex: 1; min-width: 0; }
    .schedule-eyebrow {
      font-size: 0.82rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--accent-deep);
      font-weight: 700;
      margin-bottom: 4px;
    }
    .schedule-title { font-size: clamp(1.7rem, 4vw, 2.25rem); font-weight: 700; line-height: 1.2; }
    .schedule-list-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid rgb(var(--accent-rgb, 255,122,69) / 0.22);
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent-deep);
      margin-top: 8px;
    }

    /* 旅程全体の集合・解散設定カード */
    .trip-settings-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      box-shadow: 0 4px 16px rgb(var(--shadow-base-rgb, 149,90,48) / 0.08);
    }
    .trip-settings-kicker {
      font-size: 0.78rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent-deep);
      font-weight: 700;
      margin-bottom: 16px;
    }
    .trip-settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .trip-setting-group { display: flex; flex-direction: column; gap: 8px; }
    .trip-setting-label { font-size: 0.84rem; font-weight: 700; color: var(--accent-deep); }
    .trip-setting-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .trip-date-input, .trip-time-input {
      font: inherit; font-size: 0.9rem; color: var(--text);
      border: 1.5px solid var(--line); border-radius: 10px;
      padding: 8px 12px; background: rgba(255,255,255,0.9);
      outline: none; cursor: pointer;
      transition: border-color 0.18s, box-shadow 0.18s;
    }
    .trip-date-input:focus, .trip-time-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgb(var(--accent-rgb, 255,122,69) / 0.12);
    }
    .trip-time-input { width: 116px; flex-shrink: 0; }
    .trip-summary {
      margin-top: 12px; padding: 8px 14px;
      background: var(--accent-soft); border-radius: 8px;
      font-size: 0.84rem; font-weight: 700; color: var(--accent-deep);
    }
    .trip-summary.hidden { display: none; }
    .trip-place-input {
      width: 100%;
      font: inherit; font-size: 0.94rem; color: var(--text);
      border: 1.5px solid var(--line); border-radius: 8px;
      padding: 6px 10px; background: rgba(255,255,255,0.85);
      outline: none;
    }
    .trip-place-input:focus { border-color: var(--accent); }
    .trip-place-input::placeholder { color: #c0c8cc; }
    .trip-place-controls {
      margin-top: 4px;
    }
    .trip-place-add-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
    }
    .trip-place-select {
      width: 100%;
      font: inherit; font-size: 0.94rem; color: var(--text);
      border: 1.5px solid var(--line); border-radius: 8px;
      padding: 6px 10px; background: rgba(255,255,255,0.85);
      outline: none;
    }
    .trip-place-add-btn {
      padding: 6px 10px;
      border: 1.5px solid rgba(166,97,54,0.18);
      border-radius: 8px;
      background: rgba(255,255,255,0.7);
      color: var(--accent-deep);
      font: inherit; font-size: 0.8rem; font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }
    .trip-place-add-btn:hover { background: var(--accent-soft); border-color: var(--accent); }
    .trip-transport-row {
      margin-top: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .trip-transport-label {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--accent-deep);
    }
    .trip-transport-select {
      min-width: 170px;
      border: 1.5px solid var(--line);
      border-radius: 10px;
      background: rgba(255,255,255,0.86);
      color: var(--text);
      padding: 8px 12px;
      font: inherit;
      font-size: 0.86rem;
      outline: none;
    }
    .trip-transport-select:focus { border-color: var(--accent); }

    .schedule-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(320px, 360px);
      gap: 20px;
      align-items: start;
    }
    .days-area { display: flex; flex-direction: column; gap: 16px; }

    /* 日程カード */
    .day-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      overflow: hidden;
      box-shadow: 0 6px 24px rgb(var(--shadow-base-rgb, 149,90,48) / 0.10);
      animation: dayIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    @keyframes dayIn {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .day-header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 22px 26px;
      background: linear-gradient(135deg, var(--accent-soft) 0%, transparent 70%);
      border-bottom: 1px solid var(--line);
    }
    .day-number {
      width: 48px; height: 48px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      color: #fff;
      font-size: 1rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      box-shadow: 0 6px 16px var(--accent-soft);
      letter-spacing: 0.02em;
    }
    .day-header-info { flex: 1; min-width: 0; }
    .day-label-input {
      font: inherit; font-size: 1.08rem; font-weight: 700;
      color: var(--text); background: transparent;
      border: none; outline: none; width: 100%; padding: 0;
    }
    .day-label-input:focus {
      background: rgba(255,255,255,0.6);
      border-radius: 6px; padding: 2px 6px; margin: -2px -6px;
    }
    .day-date-display {
      font-size: 0.93rem; color: var(--accent-deep);
      font-weight: 600; margin-top: 5px; display: block;
      letter-spacing: 0.03em;
    }
    .day-delete-btn {
      background: none; border: none; padding: 6px;
      border-radius: 8px; color: var(--muted);
      cursor: pointer; transition: color 0.15s, background 0.15s; flex-shrink: 0;
    }
    .day-delete-btn:hover { color: var(--danger); background: rgba(181,58,72,0.08); }

    /* 各日の開始・終了時刻編集行 */
    .day-time-row {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 6px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.1);
      font-size: 0.8rem;
    }
    .day-time-label { color: var(--muted); font-size: 0.8rem; flex-shrink: 0; }
    .day-time-input {
      font: inherit; font-size: 0.82rem; color: var(--text);
      border: 1.5px solid var(--line); border-radius: 8px;
      padding: 4px 8px; background: rgba(255,255,255,0.85);
      outline: none; width: 100px;
      transition: border-color 0.18s;
    }
    .day-time-input:focus { border-color: var(--accent); }
    .day-time-sep { color: var(--muted); flex-shrink: 0; font-size: 0.78rem; }

    /* 移動時間 */
    .travel-row {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 20px;
      border-bottom: 1px solid var(--line);
      background: rgba(255,255,255,0.15);
    }
    .travel-label { font-size: 0.82rem; color: var(--muted); flex: 1; }
    .travel-min-input {
      font: inherit; font-size: 0.82rem; color: var(--text);
      border: 1.5px solid var(--line); border-radius: 8px;
      padding: 4px 8px; background: rgba(255,255,255,0.85);
      outline: none; width: 60px; text-align: center;
    }
    .travel-min-input:focus { border-color: var(--accent); }
    .travel-min-suffix { font-size: 0.74rem; color: var(--muted); }

    /* スポットエントリー */
    .day-entries { padding: 12px 16px; display: flex; flex-direction: column; gap: 6px; }
    .entry-item {
      display: flex; align-items: center; gap: 7px;
      padding: 9px 12px;
      background: rgba(255,255,255,0.55);
      border: 1px solid rgba(166,97,54,0.12);
      border-radius: 12px;
      animation: dayIn 0.3s cubic-bezier(0.22,1,0.36,1) both;
    }
    .entry-priority {
      width: 22px; height: 22px; border-radius: 50%;
      background: var(--accent-soft); color: var(--accent-deep);
      font-size: 0.68rem; font-weight: 700;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .entry-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; }
    .entry-name {
      flex: 1; font-size: 0.94rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .entry-stay {
      font: inherit; font-size: 0.78rem; color: var(--text);
      border: 1px solid var(--line); border-radius: 6px;
      padding: 3px 5px; background: rgba(255,255,255,0.7);
      outline: none; width: 50px; text-align: center; flex-shrink: 0;
    }
    .entry-stay:focus { border-color: var(--accent); }
    .entry-stay-suffix { font-size: 0.7rem; color: var(--muted); flex-shrink: 0; }
    .entry-note {
      font: inherit; font-size: 0.78rem; color: var(--muted);
      background: transparent; border: none; outline: none;
      width: 80px; min-width: 0; flex-shrink: 1;
    }
    .entry-note:focus { background: rgba(255,255,255,0.8); border-radius: 6px; padding: 2px 6px; }
    .entry-note::placeholder { color: #c0c8cc; }
    .entry-move-btn {
      background: none; border: none; padding: 2px 5px; border-radius: 5px;
      color: var(--muted); cursor: pointer;
      transition: color 0.12s, background 0.12s;
      flex-shrink: 0; font-size: 0.7rem; line-height: 1;
    }
    .entry-move-btn:hover:not(:disabled) { color: var(--accent-deep); background: var(--accent-soft); }
    .entry-move-btn:disabled { opacity: 0.2; cursor: default; }
    .entry-remove-btn {
      background: none; border: none; padding: 4px; border-radius: 6px;
      color: var(--muted); cursor: pointer;
      transition: color 0.15s, background 0.15s; flex-shrink: 0;
    }
    .entry-remove-btn:hover { color: var(--danger); background: rgba(181,58,72,0.08); }
    .day-empty-hint {
      font-size: 0.82rem; color: var(--muted);
      text-align: center; padding: 14px 0 6px; opacity: 0.7;
    }

    /* プラン生成バー */
    .day-plan-bar {
      padding: 10px 16px;
      display: flex; justify-content: flex-end;
      border-top: 1px solid var(--line);
      background: rgba(255,255,255,0.18);
    }
    .plan-gen-btn {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 18px; border: none; border-radius: 999px;
      font: inherit; font-size: 0.9rem; font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light, #ff9a52) 100%);
      box-shadow: 0 4px 12px rgb(var(--accent-rgb, 255,122,69) / 0.32);
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.18s;
    }
    .plan-gen-btn:hover { transform: translateY(-2px); box-shadow: 0 7px 18px rgb(var(--accent-rgb, 255,122,69) / 0.42); }

    /* 生成されたプラン */
    .plan-result {
      padding: 16px 20px;
      border-top: 2px solid var(--accent-soft);
      background: rgba(255,249,240,0.65);
    }
    .plan-result-title {
      font-size: 0.82rem; letter-spacing: 0.13em; text-transform: uppercase;
      color: var(--accent-deep); font-weight: 700; margin-bottom: 14px;
    }
    .plan-timeline { display: flex; flex-direction: column; }
    .plan-step { display: flex; }
    .plan-step-left {
      display: flex; flex-direction: column; align-items: center;
      width: 64px; flex-shrink: 0;
    }
    .plan-step-time {
      font-size: 0.92rem; font-weight: 700; color: var(--accent-deep);
      white-space: nowrap; height: 24px; line-height: 24px;
    }
    .plan-step-line {
      width: 2px; flex: 1; min-height: 10px;
      background: rgba(255,122,69,0.22);
    }
    .plan-step-right { flex: 1; min-width: 0; padding-left: 10px; padding-bottom: 14px; }
    .plan-step-head { display: flex; align-items: center; gap: 8px; min-height: 24px; }
    .plan-step-dot { width: 11px; height: 11px; border-radius: 50%; flex-shrink: 0; }
    .plan-step-name { font-size: 1.0rem; font-weight: 700; color: var(--text); }
    .plan-step--meet .plan-step-name,
    .plan-step--dismiss .plan-step-name { font-weight: 600; color: var(--accent-deep); }
    .plan-step-duration { font-size: 0.86rem; color: var(--muted); margin-top: 3px; padding-left: 19px; }
    .plan-step--travel .plan-step-right { padding-bottom: 0; }
    .plan-travel-label { font-size: 0.86rem; color: var(--muted); font-style: italic; padding: 3px 0; }
    .plan-over-warn {
      margin-top: 10px; padding: 8px 12px;
      font-size: 0.78rem; color: #c44;
      background: rgba(204,68,68,0.08);
      border: 1px solid rgba(204,68,68,0.18); border-radius: 8px;
    }

    /* 日を追加ボタン */
    .add-day-btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      padding: 15px;
      border: 2px dashed var(--line); border-radius: var(--radius-lg);
      background: transparent; color: var(--accent-deep);
      font: inherit; font-size: 0.9rem; font-weight: 600; cursor: pointer;
      transition: border-color 0.18s, background 0.18s;
    }
    .add-day-btn:hover { border-color: var(--accent); background: var(--accent-soft); }

    /* サイドバー */
    .spots-sidebar { display: flex; flex-direction: column; gap: 12px; }
    .sidebar-card {
      background: var(--panel); border: 1px solid var(--line);
      border-radius: var(--radius-lg); padding: 18px 16px;
      box-shadow: 0 4px 16px rgb(var(--shadow-base-rgb, 149,90,48) / 0.08);
    }
    .sidebar-kicker {
      font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase;
      color: var(--accent-deep); font-weight: 700; margin-bottom: 12px;
    }
    .unscheduled-list { display: flex; flex-direction: column; gap: 6px; max-height: 480px; overflow-y: auto; }
    .unscheduled-list::-webkit-scrollbar { width: 4px; }
    .unscheduled-list::-webkit-scrollbar-track { background: transparent; }
    .unscheduled-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 4px; }
    .spot-chip {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.5); border: 1px solid rgba(166,97,54,0.12);
      border-radius: 10px; font: inherit; font-size: 0.88rem; font-weight: 600;
      color: var(--text); text-align: left; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.15s cubic-bezier(0.34,1.56,0.64,1);
    }
    .spot-chip:hover { background: var(--accent-soft); border-color: var(--accent); transform: translateX(3px); }
    .spot-chip-name {
      flex: 1;
      min-width: 0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.25;
      word-break: keep-all;
      overflow-wrap: normal;
      writing-mode: horizontal-tb;
    }
    .spot-chip-empty { font-size: 0.82rem; color: var(--muted); padding: 10px 0; text-align: center; }

    .sidebar-drag-hint {
      font-size: 0.76rem; color: var(--muted);
      margin: -6px 0 10px; line-height: 1.45;
    }

    .spot-chip-wrap {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      align-items: center;
      gap: 5px;
    }
    .spot-chip-wrap .spot-chip {
      grid-column: 1;
      grid-row: 1;
      min-width: 0;
      width: 100%;
    }
    .spot-chip-wrap .spot-order-btn:first-child { grid-column: 1; grid-row: 1; }
    .spot-chip-wrap .spot-order-btn:last-child { grid-column: 3; grid-row: 1; }
    .spot-order-btn {
      background: none; border: none; padding: 4px 5px; border-radius: 6px;
      color: var(--muted); cursor: pointer; font-size: 0.68rem; line-height: 1; flex-shrink: 0;
      transition: color 0.12s, background 0.12s;
    }
    .spot-order-btn:hover:not(:disabled) { color: var(--accent-deep); background: var(--accent-soft); }
    .spot-order-btn:disabled { opacity: 0.2; cursor: default; }

    .auto-place-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; margin-top: 12px;
      padding: 10px 16px; border: none; border-radius: 999px;
      font: inherit; font-size: 0.84rem; font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      box-shadow: 0 4px 14px var(--accent-soft);
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.34,1.56,0.64,1), box-shadow 0.18s;
    }
    .auto-place-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--accent-soft); }

    .return-all-spots-btn {
      display: flex; align-items: center; justify-content: center; gap: 6px;
      width: 100%; margin-top: 8px;
      padding: 9px 14px; border: 1.5px solid rgba(166,97,54,0.18); border-radius: 999px;
      font: inherit; font-size: 0.82rem; font-weight: 700;
      color: var(--accent-deep);
      background: rgba(255,255,255,0.62);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, transform 0.15s;
    }
    .return-all-spots-btn:hover:not(:disabled) {
      background: var(--accent-soft);
      border-color: var(--accent);
      transform: translateY(-1px);
    }
    .return-all-spots-btn:disabled {
      opacity: 0.45;
      cursor: default;
    }

    /* 日付ピッカー */
    .day-picker-overlay {
      position: fixed; inset: 0; z-index: 200;
      display: flex; align-items: center; justify-content: center;
      background: rgba(35,48,56,0.22);
    }
    .day-picker-overlay.hidden { display: none; }
    .day-picker-card {
      background: #fffaf0; border: 1px solid var(--line);
      border-radius: var(--radius-lg); box-shadow: var(--shadow);
      padding: 24px 22px; width: min(320px, calc(100% - 40px));
      animation: dayIn 0.3s cubic-bezier(0.22,1,0.36,1) both;
    }
    .day-picker-title { font-size: 0.88rem; font-weight: 700; margin-bottom: 14px; color: var(--accent-deep); }
    .day-picker-list { display: flex; flex-direction: column; gap: 6px; max-height: 260px; overflow-y: auto; margin-bottom: 14px; }
    .day-picker-item {
      display: flex; align-items: center; gap: 10px;
      padding: 11px 14px; border-radius: 12px;
      background: rgba(255,255,255,0.5); border: 1px solid rgba(166,97,54,0.12);
      font: inherit; font-size: 0.88rem; font-weight: 600;
      cursor: pointer; transition: background 0.15s, border-color 0.15s; text-align: left;
    }
    .day-picker-item:hover { background: var(--accent-soft); border-color: var(--accent); }
    .day-picker-cancel {
      width: 100%; padding: 10px; border-radius: 10px;
      border: 1.5px solid var(--line); background: transparent;
      font: inherit; font-size: 0.88rem; color: var(--muted); cursor: pointer;
    }
    .day-picker-cancel:hover { border-color: var(--accent); color: var(--accent-deep); }

    .schedule-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 0.9rem; line-height: 1.8; }
    .schedule-empty-icon { font-size: 3rem; margin-bottom: 12px; }

    /* ドラッグ&ドロップ */
    .spot-chip[draggable] { cursor: grab; }
    .spot-chip.dragging { opacity: 0.45; cursor: grabbing; transform: scale(0.97); }
    .day-entries.drag-over {
      background: rgb(var(--accent-rgb, 255,122,69) / 0.08);
      outline: 2px dashed var(--accent);
      outline-offset: 2px;
      border-radius: 12px;
    }
    .entry-item[draggable] { cursor: grab; }
    .entry-item.dragging { opacity: 0.45; cursor: grabbing; }
    .unscheduled-list.drag-over {
      background: rgb(var(--accent-rgb, 255,122,69) / 0.08);
      outline: 2px dashed var(--accent);
      outline-offset: 2px;
      border-radius: 12px;
    }

    /* 交通機関リンク */
    .transit-link {
      display: inline-flex; align-items: center; gap: 4px;
      margin-top: 4px;
      font-size: 0.72rem; color: var(--accent-deep);
      text-decoration: none; padding: 3px 8px;
      border-radius: 6px;
      background: var(--accent-soft);
      border: 1px solid rgb(var(--accent-rgb, 255,122,69) / 0.2);
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }

  <script>
    // テーマ適用
    (function() {
      try {
        const sk = JSON.parse(localStorage.getItem("spot-map-settings.v1") || "{}");
        const k = sk.bgTheme || "warm";
        const BGS = {
          warm:     "radial-gradient(circle at 8% 10%, rgba(255,210,87,.55), transparent 22%), radial-gradient(circle at 92% 14%, rgba(112,214,197,.34), transparent 20%), radial-gradient(circle at 80% 80%, rgba(255,143,177,.28), transparent 18%), linear-gradient(180deg,#fff8ea 0%,#ffeccd 100%)",
          sky:      "radial-gradient(circle at 8% 10%, rgba(135,206,250,.45), transparent 22%), radial-gradient(circle at 92% 14%, rgba(100,180,255,.28), transparent 20%), radial-gradient(circle at 80% 80%, rgba(173,216,230,.25), transparent 18%), linear-gradient(180deg,#eaf5ff 0%,#d0e8ff 100%)",
          mint:     "radial-gradient(circle at 8% 10%, rgba(144,238,144,.4), transparent 22%), radial-gradient(circle at 92% 14%, rgba(100,200,150,.28), transparent 20%), radial-gradient(circle at 80% 80%, rgba(152,251,152,.22), transparent 18%), linear-gradient(180deg,#eafff4 0%,#d0f5e0 100%)",
          lavender: "radial-gradient(circle at 8% 10%, rgba(216,191,255,.45), transparent 22%), radial-gradient(circle at 92% 14%, rgba(180,150,240,.28), transparent 20%), radial-gradient(circle at 80% 80%, rgba(200,170,255,.22), transparent 18%), linear-gradient(180deg,#f4eeff 0%,#e5d8ff 100%)",
          gray:     "radial-gradient(circle at 8% 10%, rgba(200,210,220,.45), transparent 22%), radial-gradient(circle at 92% 14%, rgba(180,190,200,.28), transparent 20%), radial-gradient(circle at 80% 80%, rgba(190,200,210,.22), transparent 18%), linear-gradient(180deg,#f2f4f6 0%,#e4e8ec 100%)",
        };
        const CS = {
          warm:     ["#ff7a45","#ce5428","#ff9a52","rgba(255,122,69,0.12)","rgba(166,97,54,0.2)","rgba(255,252,245,0.88)","0 24px 50px rgba(149,90,48,0.16)","255,122,69","149,90,48"],
          sky:      ["#3b8fd4","#1a6aad","#60aee8","rgba(59,143,212,0.12)","rgba(59,120,200,0.22)","rgba(240,248,255,0.88)","0 24px 50px rgba(30,90,160,0.14)","59,143,212","30,90,160"],
          mint:     ["#2da868","#1a7a48","#52c485","rgba(45,168,104,0.12)","rgba(45,150,90,0.22)","rgba(240,255,248,0.88)","0 24px 50px rgba(30,110,60,0.14)","45,168,104","30,110,60"],
          lavender: ["#8b64cc","#6a45a8","#a884e0","rgba(139,100,204,0.12)","rgba(120,80,200,0.22)","rgba(248,244,255,0.88)","0 24px 50px rgba(90,60,150,0.14)","139,100,204","90,60,150"],
          gray:     ["#7a8a98","#5a6a78","#96a6b4","rgba(122,138,152,0.12)","rgba(100,120,140,0.22)","rgba(245,247,250,0.88)","0 24px 50px rgba(60,80,100,0.14)","122,138,152","60,80,100"],
        };
        document.body.style.background = BGS[k] || BGS.warm;
        const c = CS[k] || CS.warm;
        const r = document.documentElement;
        r.style.setProperty("--accent",          c[0]);
        r.style.setProperty("--accent-deep",      c[1]);
        r.style.setProperty("--accent-light",     c[2]);
        r.style.setProperty("--accent-soft",      c[3]);
        r.style.setProperty("--line",             c[4]);
        r.style.setProperty("--panel",            c[5]);
        r.style.setProperty("--shadow",           c[6]);
        r.style.setProperty("--accent-rgb",       c[7]);
        r.style.setProperty("--shadow-base-rgb",  c[8]);
      } catch {}
    })();

    const LISTS_KEY    = "spot-map-lists.v1";
    const SCHEDULE_KEY = "spot-map-schedule.v1";

    function makeId() {
      if (globalThis.crypto?.randomUUID) return globalThis.crypto.randomUUID();
      return `id-${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 10)}`;
    }

    function escHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function timeToMinutes(t) {
      if (!t) return 0;
      const p = t.split(":");
      return parseInt(p[0] || 0) * 60 + (parseInt(p[1]) || 0);
    }

    function minutesToTime(mins) {
      const h = Math.floor(Math.max(0, mins) / 60) % 24;
      const m = Math.max(0, mins) % 60;
      return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    // ── カテゴリ補助 ───────────────────────────────────────────────

    const CAT_EMOJI = {
      meet: "🤝", dismiss: "👋", airport: "✈️", station: "🚉",
      restaurant: "🍽️", tourist: "⛩️", hotel: "🏨", shopping: "🛍️", other: "📍"
    };
    const CAT_COLOR = {
      meet: "#27ae60", dismiss: "#8e44ad", airport: "#2471a3", station: "#1a5276",
      restaurant: "#c0392b", tourist: "#ca6f1e", hotel: "#148f77", shopping: "#d35400"
    };
    const CAT_STAY = {
      meet: 0, dismiss: 0, airport: 45, station: 20,
      restaurant: 60, tourist: 90, hotel: 30, shopping: 60, other: 60
    };

    function getSpotCatEmoji(key) { return CAT_EMOJI[key] || "📍"; }
    function getSpotCatColor(key) { return CAT_COLOR[key] || "var(--accent)"; }
    function getDefaultStayTime(key) {
      return (CAT_STAY[key] !== undefined) ? CAT_STAY[key] : 60;
    }

    function getSpotStayDefault(spot) {
      return Number.isFinite(Number(spot?.defaultStayMinutes)) && Number(spot.defaultStayMinutes) > 0
        ? Number(spot.defaultStayMinutes)
        : getDefaultStayTime(spot?.spotCategory);
    }

    function splitDuration(mins) {
      const total = Math.max(0, parseInt(mins, 10) || 0);
      return { hours: Math.floor(total / 60), minutes: total % 60 };
    }

    function combineDuration(hours, minutes, fallback = 60) {
      const h = Math.max(0, parseInt(hours, 10) || 0);
      const m = Math.max(0, parseInt(minutes, 10) || 0);
      return Math.max(5, h * 60 + m || fallback);
    }

    // ── データ読み書き ─────────────────────────────────────────────

    function loadActiveList() {
      try {
        const raw = localStorage.getItem(LISTS_KEY);
        if (!raw) return null;
        const data = JSON.parse(raw);
        if (!Array.isArray(data?.lists)) return null;
        return data.lists.find(l => l.id === data.activeListId) || data.lists[0] || null;
      } catch { return null; }
    }

    function loadSchedule(listId) {
      try {
        const raw = localStorage.getItem(SCHEDULE_KEY);
        const all = raw ? JSON.parse(raw) : {};
        const sched = all[listId] || { listId, days: [] };
        ensureScheduleDefaults(sched);
        return sched;
      } catch { return { listId, days: [] }; }
    }

    function saveSchedule(sched) {
      try {
        const raw = localStorage.getItem(SCHEDULE_KEY);
        const all = raw ? JSON.parse(raw) : {};
        all[sched.listId] = sched;
        localStorage.setItem(SCHEDULE_KEY, JSON.stringify(all));
      } catch {}
    }

    function saveActiveList() {
      try {
        const raw = localStorage.getItem(LISTS_KEY);
        const data = raw ? JSON.parse(raw) : {};
        if (!Array.isArray(data.lists) || !activeList) return;
        const idx = data.lists.findIndex(l => l.id === activeList.id);
        if (idx >= 0) data.lists[idx] = activeList;
        else data.lists.push(activeList);
        data.activeListId = activeList.id;
        localStorage.setItem(LISTS_KEY, JSON.stringify(data));
      } catch {}
    }

    // ── 状態 ───────────────────────────────────────────────────────
    let activeList  = null;
    let schedule    = null;
    let pendingSpot = null;
    let dragState   = null; // { spotId, fromDayId: string|null }

    function getSpotById(spotId) {
      return activeList?.spots?.find(s => s.id === spotId) || null;
    }

    function getSpotRole(spot) {
      if (!spot) return "";
      return getSpotRoles(spot)[0] || "";
    }

    function getSpotRoles(spot) {
      if (!spot) return [];
      const roles = Array.isArray(spot.spotRoles) ? [...spot.spotRoles] : [];
      if (spot.spotRole && !roles.includes(spot.spotRole)) roles.push(spot.spotRole);
      if ((spot.spotCategory === "meet" || spot.spotCategory === "dismiss") && !roles.includes(spot.spotCategory)) {
        roles.push(spot.spotCategory);
      }
      return roles.filter(role => role === "meet" || role === "dismiss");
    }

    function isMeetSpot(spot) { return getSpotRoles(spot).includes("meet"); }
    function isDismissSpot(spot) { return getSpotRoles(spot).includes("dismiss"); }

    function setExclusiveSpotCategory(spotId, category) {
      if (!activeList?.spots) return null;
      activeList.spots = activeList.spots.map(s => {
        let roles = getSpotRoles(s).filter(role => role !== category);
        if (s.id === spotId) roles = [...roles, category];
        return {
          ...s,
          spotRoles: roles,
          spotRole: roles[0] || "",
          spotCategory: (s.spotCategory === "meet" || s.spotCategory === "dismiss") ? "other" : s.spotCategory
        };
      });
      saveActiveList();
      return getSpotById(spotId);
    }

    function getOrderedSpots() {
      const spots = activeList?.spots || [];
      const order = schedule?.spotsOrder || [];
      const inOrder = order
        .map(id => spots.find(s => s.id === id))
        .filter(Boolean);
      const remaining = spots.filter(s => !order.includes(s.id));
      return [...inOrder, ...remaining];
    }

    function moveSpotInOrder(spotId, dir) {
      const allIds = getOrderedSpots().map(s => s.id);
      const idx = allIds.indexOf(spotId);
      if (dir === "up" && idx > 0) {
        [allIds[idx - 1], allIds[idx]] = [allIds[idx], allIds[idx - 1]];
      } else if (dir === "down" && idx < allIds.length - 1) {
        [allIds[idx], allIds[idx + 1]] = [allIds[idx + 1], allIds[idx]];
      }
      schedule.spotsOrder = allIds;
      saveSchedule(schedule);
      renderUnscheduled();
    }

    function ensureScheduleDefaults(sched) {
      if (sched.tripMeetTime     === undefined) sched.tripMeetTime     = "09:00";
      if (sched.tripDismissTime  === undefined) sched.tripDismissTime  = "18:00";
      if (sched.tripMeetDate     === undefined) {
        const tomorrow = new Date();
        tomorrow.setDate(tomorrow.getDate() + 1);
        sched.tripMeetDate = tomorrow.toISOString().split("T")[0];
      }
      if (!sched.tripDismissDate) {
        const dismiss = new Date(`${sched.tripMeetDate}T00:00:00`);
        dismiss.setDate(dismiss.getDate() + 1);
        sched.tripDismissDate = dismiss.toISOString().split("T")[0];
      }
      if (sched.tripMeetPlace    === undefined) sched.tripMeetPlace    = "";
      if (sched.tripDismissPlace === undefined) sched.tripDismissPlace = "";
      if (sched.travelMode       === undefined) sched.travelMode       = "transit";
      if (!Array.isArray(sched.days))        sched.days             = [];
      if (!Array.isArray(sched.spotsOrder))  sched.spotsOrder       = [];
      if (!sched.defaultStayTimes)           sched.defaultStayTimes = {};
      if (!sched.spotHours)                  sched.spotHours        = {};
      if (!sched.hotels)                     sched.hotels           = {};
      if (!sched.flights)                    sched.flights          = {};
    }

    function ensureDayDefaults(day) {
      if (!day.travelMinutes) day.travelMinutes = 20;
      if (!day.stayTimes)     day.stayTimes     = {};
      if (!day.entries)       day.entries       = [];
    }

    // 解散日時が集合日時以前の場合、解散日を翌日に繰り上げる
    function autoFixDismissDate() {
      const meetDate    = schedule.tripMeetDate;
      const meetTime    = schedule.tripMeetTime    || "09:00";
      const dismissDate = schedule.tripDismissDate;
      const dismissTime = schedule.tripDismissTime || "18:00";
      if (!meetDate || !dismissDate) return;
      const meetDT    = new Date(`${meetDate}T${meetTime}`);
      const dismissDT = new Date(`${dismissDate}T${dismissTime}`);
      if (isNaN(meetDT) || isNaN(dismissDT)) return;
      if (dismissDT <= meetDT) {
        const advanced = new Date(meetDT);
        advanced.setDate(advanced.getDate() + 1);
        schedule.tripDismissDate = advanced.toISOString().split("T")[0];
        const el = document.getElementById("tripDismissDate");
        if (el) { el.value = schedule.tripDismissDate; window.CalendarPicker?.updateDisplay(el); }
        saveSchedule(schedule);
        syncDaysToDateRange();
      }
    }

    // ── プラン生成 ─────────────────────────────────────────────────
    // dayIdx: 0始まり、totalDays: 日程カード総数
    // 初日は旅程集合時刻・最終日は解散時刻を使用、中日は09:00〜21:00

    function getSpotLocation(spot) {
      if (!spot) return "";
      if (spot.lat && spot.lng) return `${spot.lat},${spot.lng}`;
      return spot.name || "";
    }

    function parseTimeRange(value) {
      const text = String(value || "").trim();
      const m = text.match(/^(\d{1,2}):(\d{2})\s*[-〜~]\s*(\d{1,2}):(\d{2})$/);
      if (!m) return null;
      const open = Math.min(23 * 60 + 59, Math.max(0, Number(m[1]) * 60 + Number(m[2])));
      const close = Math.min(24 * 60, Math.max(0, Number(m[3]) * 60 + Number(m[4])));
      if (close <= open) return null;
      return { open, close };
    }

    function getDayKey(dateStr) {
      const d = new Date(`${dateStr}T00:00:00`);
      if (isNaN(d)) return null;
      return ["sun", "mon", "tue", "wed", "thu", "fri", "sat"][d.getDay()];
    }

    function getSpotHoursRange(spotId, day) {
      const spot = getSpotById(spotId);
      const dayKey = getDayKey(day?.date);
      const menuHours = dayKey ? spot?.businessHours?.[dayKey] : "";
      return parseTimeRange(menuHours || schedule?.spotHours?.[spotId]);
    }

    function getDayWindow(dayIdx, totalDays, day) {
      const isFirst = dayIdx === 0;
      const isLast  = dayIdx === totalDays - 1;
      return {
        start: timeToMinutes(isFirst ? (schedule.tripMeetTime || "09:00") : (day?.startTime || "09:00")),
        end:   timeToMinutes(isLast  ? (schedule.tripDismissTime || "18:00") : (day?.endTime || "21:00"))
      };
    }

    function canPlaceWithinHours(day, dayIdx, totalDays, spot) {
      const hours = getSpotHoursRange(spot.id, day);
      if (!hours) return true;
      const stay = (schedule.defaultStayTimes?.[spot.id]) ?? getSpotStayDefault(spot);
      const dayWindow = getDayWindow(dayIdx, totalDays, day);
      const start = Math.max(dayWindow.start, hours.open);
      const end = Math.min(dayWindow.end, hours.close);
      return start + stay <= end;
    }

    function isVisitOutsideHours(spotId, arriveT, stay, day = null) {
      if (!day) day = schedule?.days?.find(d => (d.entries || []).some(en => en.spotId === spotId));
      const hours = getSpotHoursRange(spotId, day);
      if (!hours) return false;
      return arriveT < hours.open || arriveT + stay > hours.close;
    }

    // ── HERE Transit API ──────────────────────────────────────────

    const HERE_API_KEY = "y7NJ8mod9XAB3hxh5H7iJUMVkTSKz9OClBoYCjk5_cg";

    function getTravelMode() {
      return schedule?.travelMode === "driving" ? "driving" : "transit";
    }

    function transitCacheKey(lat1, lng1, lat2, lng2, mode = getTravelMode()) {
      return `${mode}|${lat1},${lng1}|${lat2},${lng2}`;
    }

    async function fetchTransitTime(fromLat, fromLng, toLat, toLng) {
      try {
        const url = `https://transit.router.hereapi.com/v8/routes?origin=${fromLat},${fromLng}&destination=${toLat},${toLng}&return=summary&apikey=${HERE_API_KEY}`;
        const res = await fetch(url);
        if (!res.ok) return { failed: true, mode: "transit", error: `transit HTTP ${res.status}` };
        const data = await res.json();
        const route = data.routes?.[0];
        if (!route?.sections) return { failed: true, mode: "transit", error: "公共交通ルートなし" };
        const sections = route.sections;
        const totalSec = sections.reduce((sum, s) => sum + (s.summary?.duration ?? 0), 0);
        const transitSections = sections.filter(s => s.type === "transit");

        // 移動手段ごとのセグメントラベルを生成
        const TRANSIT_ICON = { subway: "🚇", bus: "🚌", lightRail: "🚊", rail: "🚃", ferry: "⛴" };
        const segments = [];
        sections.forEach(s => {
          if (s.type === "pedestrian") {
            const min = Math.round((s.summary?.duration ?? 0) / 60);
            if (min > 0) segments.push(`🚶${min}分`);
          } else if (s.type === "transit") {
            const icon = TRANSIT_ICON[s.transport?.mode] || "🚃";
            const name = s.transport?.name || "";
            segments.push(`${icon}${name}`);
          }
        });

        return {
          durationMin: Math.max(1, Math.round(totalSec / 60)),
          transfers: Math.max(0, transitSections.length - 1),
          segments,
          mode: "transit",
        };
      } catch (e) {
        return { failed: true, mode: "transit", error: e?.message || "公共交通API通信エラー" };
      }
    }

    async function fetchDrivingTime(fromLat, fromLng, toLat, toLng) {
      try {
        const url = `https://router.hereapi.com/v8/routes?origin=${fromLat},${fromLng}&destination=${toLat},${toLng}&transportMode=car&return=summary&apikey=${HERE_API_KEY}`;
        const res = await fetch(url);
        if (!res.ok) return { failed: true, mode: "driving", error: `driving HTTP ${res.status}` };
        const data = await res.json();
        const dur = data.routes?.[0]?.sections?.[0]?.summary?.duration;
        if (!dur) return { failed: true, mode: "driving", error: "車ルートなし" };
        return {
          durationMin: Math.max(1, Math.round(dur / 60)),
          transfers: 0,
          segments: ["🚗"],
          mode: "driving",
        };
      } catch (e) {
        return { failed: true, mode: "driving", error: e?.message || "車API通信エラー" };
      }
    }

    async function scheduleTransitFetches() {
      if (!schedule?.days) return;
      if (!schedule.transitCache) schedule.transitCache = {};
      const pairs = [];
      for (const day of schedule.days) {
        const entries = day.entries || [];
        for (let i = 0; i < entries.length - 1; i++) {
          const a = getSpotById(entries[i].spotId);
          const b = getSpotById(entries[i + 1].spotId);
          if (a?.lat && a?.lng && b?.lat && b?.lng) {
            const key = transitCacheKey(a.lat, a.lng, b.lat, b.lng);
            if (!schedule.transitCache[key]) {
              pairs.push({ key, fromLat: a.lat, fromLng: a.lng, toLat: b.lat, toLng: b.lng });
            }
          }
        }
      }
      // 集合/解散スポット（エントリ外）↔ 初日・最終日の端スポット の区間も追加
      const globalMeet    = activeList?.spots?.find(isMeetSpot);
      const globalDismiss = activeList?.spots?.find(isDismissSpot);

      const firstDay = schedule.days[0];
      if (firstDay && globalMeet?.lat && globalMeet?.lng) {
        const firstNonMeet = firstDay.entries?.find(en => !isMeetSpot(getSpotById(en.spotId)));
        const firstSpot    = firstNonMeet ? getSpotById(firstNonMeet.spotId) : null;
        if (firstSpot?.lat && firstSpot?.lng) {
          const key = transitCacheKey(globalMeet.lat, globalMeet.lng, firstSpot.lat, firstSpot.lng);
          if (!schedule.transitCache[key]) pairs.push({ key, fromLat: globalMeet.lat, fromLng: globalMeet.lng, toLat: firstSpot.lat, toLng: firstSpot.lng });
        }
      }

      const lastDay = schedule.days[schedule.days.length - 1];
      if (lastDay && globalDismiss?.lat && globalDismiss?.lng) {
        const lastNonDismiss = [...(lastDay.entries || [])].reverse().find(en => !isDismissSpot(getSpotById(en.spotId)));
        const lastSpot       = lastNonDismiss ? getSpotById(lastNonDismiss.spotId) : null;
        if (lastSpot?.lat && lastSpot?.lng) {
          const key = transitCacheKey(lastSpot.lat, lastSpot.lng, globalDismiss.lat, globalDismiss.lng);
          if (!schedule.transitCache[key]) pairs.push({ key, fromLat: lastSpot.lat, fromLng: lastSpot.lng, toLat: globalDismiss.lat, toLng: globalDismiss.lng });
        }
      }

      // 各日の宿泊先（登録済み）↔ 当日最後・翌日最初のスポット
      schedule.days.forEach((d, idx) => {
        const hotel = schedule.hotels?.[d.id];
        if (!hotel?.lat || !hotel?.lng) return;

        const lastEnt = [...(d.entries || [])].reverse().find(en => !isDismissSpot(getSpotById(en.spotId)));
        const lastSp  = lastEnt ? getSpotById(lastEnt.spotId) : null;
        if (lastSp?.lat && lastSp?.lng) {
          const key = transitCacheKey(lastSp.lat, lastSp.lng, hotel.lat, hotel.lng);
          if (!schedule.transitCache[key]) pairs.push({ key, fromLat: lastSp.lat, fromLng: lastSp.lng, toLat: hotel.lat, toLng: hotel.lng });
        }

        const nextDay  = schedule.days[idx + 1];
        const firstEnt = nextDay?.entries?.find(en => !isMeetSpot(getSpotById(en.spotId)));
        const firstSp  = firstEnt ? getSpotById(firstEnt.spotId) : null;
        if (firstSp?.lat && firstSp?.lng) {
          const key = transitCacheKey(hotel.lat, hotel.lng, firstSp.lat, firstSp.lng);
          if (!schedule.transitCache[key]) pairs.push({ key, fromLat: hotel.lat, fromLng: hotel.lng, toLat: firstSp.lat, toLng: firstSp.lng });
        }
      });

      if (pairs.length === 0) return;
      const mode = getTravelMode();
      const results = await Promise.all(
        pairs.map(async p => {
          const result = mode === "driving"
            ? await fetchDrivingTime(p.fromLat, p.fromLng, p.toLat, p.toLng)
              || { failed: true, mode: "driving", error: "車ルート取得失敗" }
            : await fetchTransitTime(p.fromLat, p.fromLng, p.toLat, p.toLng)
              || { failed: true, mode: "transit", error: "公共交通ルート取得失敗" };
          if (result.mode && result.mode !== mode) {
            result.failed = true;
            result.mode = mode;
            result.segments = [];
          }
          return { key: p.key, result };
        })
      );
      let updated = false;
      results.forEach(({ key, result }) => {
        if (!schedule.transitCache[key]) { schedule.transitCache[key] = result; updated = true; }
      });
      if (updated) { saveSchedule(schedule); renderDays(); }
    }

    function generatePlan(day, dayIdx, totalDays) {
      ensureDayDefaults(day);
      const travel  = day.travelMinutes;
      const stays   = day.stayTimes;
      const steps   = [];
      const skipped = [];

      const isFirst = dayIdx === 0;
      const isLast  = dayIdx === totalDays - 1;

      // 集合/解散スポットをエントリ内から探す。なければリストから、さらに宿泊先登録データから座標を補完する
      let meetSpot = isFirst
        ? (() => {
            const e = day.entries.find(en => isMeetSpot(getSpotById(en.spotId)));
            return e
              ? getSpotById(e.spotId)
              : (activeList?.spots?.find(isMeetSpot) || null);
          })()
        : null;
      // 非初日: 前の夜の宿泊先が登録済みならその座標を出発点に使う
      if (!meetSpot && !isFirst) {
        const h = schedule.hotels?.[schedule.days[dayIdx - 1]?.id];
        if (h?.lat && h?.lng) meetSpot = h;
      }

      let dismissSpot = isLast
        ? (() => {
            const e = day.entries.find(en => isDismissSpot(getSpotById(en.spotId)));
            return e
              ? getSpotById(e.spotId)
              : (activeList?.spots?.find(isDismissSpot) || null);
          })()
        : null;
      // 非最終日: 当夜の宿泊先が登録済みならその座標を終着点に使う
      if (!dismissSpot && !isLast) {
        const h = schedule.hotels?.[day.id];
        if (h?.lat && h?.lng) dismissSpot = h;
      }

      let startTime, endTime, meetName, dismissName;
      if (isFirst) {
        startTime  = schedule.tripMeetTime    || "09:00";
        meetName   = meetSpot?.name || schedule.tripMeetPlace || "集合場所";
      } else {
        startTime  = day.startTime || "09:00";
        meetName   = "宿泊先";
      }
      if (isLast) {
        endTime     = schedule.tripDismissTime  || "18:00";
        dismissName = dismissSpot?.name || schedule.tripDismissPlace || "解散場所";
      } else {
        endTime     = day.endTime || "21:00";
        dismissName = "宿泊先";
      }

      let t      = timeToMinutes(startTime);
      const endT = timeToMinutes(endTime);

      steps.push({
        type: "meet", name: meetName, time: t,
        anchorSpot: meetSpot || null,
        // 非初日の「宿泊先」行をホテルボタンとしてレンダリングするための情報
        hotelNightDayId: !isFirst ? (schedule.days[dayIdx - 1]?.id ?? null) : null,
        hotelCheckin:    !isFirst ? (schedule.days[dayIdx - 1]?.date ?? null) : null,
        hotelCheckout:   !isFirst ? (day.date ?? null) : null,
      });
      let prevSpot = meetSpot || null;

      for (let i = 0; i < day.entries.length; i++) {
        const entry  = day.entries[i];
        const spot   = getSpotById(entry.spotId);
        if (!spot) continue;

        // 集合場所（初日）はアンカーと同一なのでスポットとしては追加しない
        if (isFirst && isMeetSpot(spot)) { prevSpot = spot; continue; }
        // 解散場所（最終日）も同様（最後の移動先として後で使う）
        if (isLast && isDismissSpot(spot)) continue;

        // キャッシュから移動時間を取得（なければ目安値）
        const hasCoords = !!(prevSpot?.lat && prevSpot?.lng && spot.lat && spot.lng);
        let travelDuration = travel;
        let travelInfo     = null;
        if (hasCoords) {
          const ckey = transitCacheKey(prevSpot.lat, prevSpot.lng, spot.lat, spot.lng);
          travelInfo = schedule.transitCache?.[ckey] || null;
          if (travelInfo && !travelInfo.failed && travelInfo.durationMin) travelDuration = travelInfo.durationMin;
        }

        const stay    = stays[entry.spotId] || 60;
        const arriveT = t + travelDuration;

        if (arriveT >= endT) {
          for (let j = i; j < day.entries.length; j++) {
            const s = getSpotById(day.entries[j].spotId);
            // 集合/解散アンカーはスキップ済みなので「収まらなかった」リストに入れない
            if (s && !(isFirst && isMeetSpot(s)) && !(isLast && isDismissSpot(s))) {
              skipped.push(s.name);
            }
          }
          break;
        }

        steps.push({ type: "travel", duration: travelDuration, travelInfo, fromSpot: prevSpot, toSpot: spot, noCoords: !hasCoords });
        steps.push({
          type: "spot",
          name: spot.name,
          time: arriveT,
          duration: stay,
          color: getSpotCatColor(spot.spotCategory),
          spotId: spot.id,
          budget: spot.budget || 0,
          outsideHours: isVisitOutsideHours(spot.id, arriveT, stay, day)
        });
        t = arriveT + stay;
        prevSpot = spot;

        if (t >= endT) {
          for (let j = i + 1; j < day.entries.length; j++) {
            const s = getSpotById(day.entries[j].spotId);
            if (s && !(isFirst && isMeetSpot(s)) && !(isLast && isDismissSpot(s))) {
              skipped.push(s.name);
            }
          }
          break;
        }
      }

      // 最終移動：解散場所スポットの座標があれば実ルーティングを適用
      const finalHasCoords = !!(prevSpot?.lat && prevSpot?.lng && dismissSpot?.lat && dismissSpot?.lng);
      let finalTravelInfo = null;
      let finalTravelDuration = travel;
      if (finalHasCoords) {
        const ckey = transitCacheKey(prevSpot.lat, prevSpot.lng, dismissSpot.lat, dismissSpot.lng);
        finalTravelInfo = schedule.transitCache?.[ckey] || null;
        if (finalTravelInfo && !finalTravelInfo.failed && finalTravelInfo.durationMin) {
          finalTravelDuration = finalTravelInfo.durationMin;
        }
      }
      steps.push({ type: "travel", duration: finalTravelDuration, travelInfo: finalTravelInfo, fromSpot: prevSpot, toSpot: dismissSpot, noCoords: !finalHasCoords });
      steps.push({
        type: "dismiss", name: dismissName, time: t + finalTravelDuration,
        anchorSpot: dismissSpot || null,
        hotelNightDayId: !isLast ? (day.id ?? null) : null,
        hotelCheckin:    !isLast ? (day.date ?? null) : null,
        hotelCheckout:   !isLast ? (schedule.days[dayIdx + 1]?.date ?? null) : null,
      });

      return { steps, skipped };
    }

    function buildPlanResultEl(planData) {
      const { steps, skipped } = planData;
      const el = document.createElement("div");
      el.className = "plan-result";

      let html = `<p class="plan-result-title">Generated Plan — 自動生成プラン</p><div class="plan-timeline">`;

      steps.forEach((step, i) => {
        const isLast = (i === steps.length - 1);

        if (step.type === "travel") {
          let travelLabel;
          if (step.travelInfo && !step.travelInfo.failed) {
            const xfers = step.travelInfo.transfers === 0 ? "乗り換えなし" : `${step.travelInfo.transfers}回乗り換え`;
            travelLabel = `→ 🚃 約${step.duration}分（${xfers}）`;
          } else if (step.travelInfo?.failed) {
            travelLabel = `→ ⚠ 経路取得失敗${step.travelInfo.error ? `（${escHtml(step.travelInfo.error)}）` : ""}`;
          } else {
            travelLabel = `→ 移動 約${step.duration}分（目安）`;
          }
          html += `
            <div class="plan-step plan-step--travel">
              <div class="plan-step-left"><div class="plan-step-line"></div></div>
              <div class="plan-step-right">
                <p class="plan-travel-label">${travelLabel}</p>
              </div>
            </div>`;
        } else {
          const dotColor = step.type === "spot"
            ? escHtml(step.color || "var(--accent)")
            : "var(--accent-yellow)";
          html += `
            <div class="plan-step plan-step--${step.type}">
              <div class="plan-step-left">
                <span class="plan-step-time">${minutesToTime(step.time)}</span>
                ${!isLast ? '<div class="plan-step-line"></div>' : ""}
              </div>
              <div class="plan-step-right">
                <div class="plan-step-head">
                  <span class="plan-step-dot" style="background:${dotColor}"></span>
                  <span class="plan-step-name">${escHtml(step.name)}</span>
                </div>
                ${step.duration ? `<p class="plan-step-duration">滞在 ${step.duration}分</p>` : ""}
              </div>
            </div>`;
        }
      });

      html += "</div>";

      if (skipped.length > 0) {
        html += `<p class="plan-over-warn">⚠ 時間内に収まらなかったスポット: ${skipped.map(n => escHtml(n)).join("、")}</p>`;
      }

      el.innerHTML = html;
      return el;
    }

    // ── 日付フォーマット ───────────────────────────────────────────

    function formatDate(dateStr) {
      if (!dateStr) return "";
      const d = new Date(dateStr + "T00:00:00");
      if (isNaN(d)) return dateStr;
      const dows = ["日", "月", "火", "水", "木", "金", "土"];
      return `${d.getMonth() + 1}月${d.getDate()}日（${dows[d.getDay()]}）`;
    }

    // ── 日程の自動同期 ─────────────────────────────────────────────

    function syncDaysToDateRange() {
      const meetDate    = schedule.tripMeetDate;
      const dismissDate = schedule.tripDismissDate;
      if (!meetDate || !dismissDate) return;

      const start = new Date(meetDate    + "T00:00:00");
      const end   = new Date(dismissDate + "T00:00:00");
      if (isNaN(start) || isNaN(end) || start > end) return;

      const numDays = Math.round((end - start) / 86400000) + 1;
      if (numDays > 30) { alert("旅程が30日を超えています。日付を確認してください。"); return; }

      const existing = [...schedule.days];
      const newDays  = [];

      for (let i = 0; i < numDays; i++) {
        const d = new Date(start);
        d.setDate(d.getDate() + i);
        const dateStr = d.toISOString().split("T")[0];

        const byDate  = existing.find(ex => ex.date === dateStr);
        const byIndex = existing[i] && !existing[i].date ? existing[i] : null;
        const found   = byDate || byIndex;
        if (found) {
          found.date  = dateStr;
          if (!found.label) found.label = `${i + 1}日目`;
          newDays.push(found);
        } else {
          newDays.push({ id: makeId(), label: `${i + 1}日目`, date: dateStr, travelMinutes: 20, stayTimes: {}, entries: [] });
        }
      }

      const changed = newDays.length !== existing.length ||
        newDays.some((d, i) => d.id !== existing[i]?.id || d.date !== existing[i]?.date);
      if (changed) {
        schedule.days = newDays;
        saveSchedule(schedule);
      }
      updateTripSummary();
      renderAll();
    }

    // 旅程サマリー（◯泊◯日）を更新する
    function updateTripSummary() {
      const el = document.getElementById("tripSummary");
      const meetDate    = schedule.tripMeetDate;
      const dismissDate = schedule.tripDismissDate;
      if (!meetDate || !dismissDate) { el.classList.add("hidden"); return; }

      const start = new Date(meetDate    + "T00:00:00");
      const end   = new Date(dismissDate + "T00:00:00");
      if (isNaN(start) || isNaN(end) || start > end) { el.classList.add("hidden"); return; }

      const nights = Math.round((end - start) / 86400000);
      const days   = nights + 1;
      el.textContent = `${formatDate(meetDate)} 〜 ${formatDate(dismissDate)}（${nights}泊${days}日）`;
      el.classList.remove("hidden");
    }

        stayHourUnit.className = "spot-stay-unit";
        stayHourUnit.textContent = "時間";

        stayInput.type = "number";
        stayInput.min = "0";
        stayInput.max = "55";

        stayInput.className = "spot-stay-default";
        stayInput.title = "デフォルト滞在時間（分）";
        stayInput.value = stayParts.minutes;
        const saveStay = e => {
          e?.stopPropagation?.();
          if (!schedule.defaultStayTimes) schedule.defaultStayTimes = {};
          schedule.defaultStayTimes[spot.id] = combineDuration(stayHourInput.value, stayInput.value, stayValue);
          saveSchedule(schedule);
        };
        stayHourInput.addEventListener("click", e => e.stopPropagation());
        stayHourInput.addEventListener("change", saveStay);
        stayInput.addEventListener("click", e => e.stopPropagation());
        stayInput.addEventListener("change", saveStay);

    function renderDays() {
      const area = document.getElementById("daysArea");
      area.innerHTML = "";

      if (schedule.days.length === 0) {
        area.innerHTML = `
          <div class="schedule-empty">

          </div>`;
        return;
      }

      schedule.days.forEach((day, idx) => renderDayCard(area, day, idx));
    }

    function renderUnifiedTimeline(day, dayIdx, totalDays) {
      ensureDayDefaults(day);
      const wrap = document.createElement("div");
      wrap.className = "unified-timeline";

      // コンテナへのドロップ（空の日程にスポットを追加）
      wrap.addEventListener("dragover", e => {
        if (!dragState) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = "move";
        wrap.classList.add("tl-drag-over");
      });
      wrap.addEventListener("dragleave", e => {
        if (!wrap.contains(e.relatedTarget)) wrap.classList.remove("tl-drag-over");
      });
      wrap.addEventListener("drop", e => {
        e.preventDefault();
        wrap.classList.remove("tl-drag-over");
        // スポット行が stopPropagation しているので、ここに届くのはスポット行以外への落下
        const spotId = dragState?.spotId || e.dataTransfer.getData("text/plain");
        if (!spotId) return;
        if (day.entries.some(en => en.spotId === spotId)) { dragState = null; return; }
        const spot = getSpotById(spotId);
        if (!spot) { dragState = null; return; }
        if (dragState?.fromDayId) {
          const srcDay = schedule.days.find(d => d.id === dragState.fromDayId);
          if (srcDay) srcDay.entries = srcDay.entries.filter(en => en.spotId !== spotId);
        }
        dragState = null;
        day.entries.push({ id: makeId(), spotId: spot.id, time: "", note: "" });
        if (!day.stayTimes) day.stayTimes = {};
        day.stayTimes[spot.id] = (schedule.defaultStayTimes?.[spot.id]) ?? getSpotStayDefault(spot);
        saveSchedule(schedule);
        renderAll();
      });

      if (day.entries.length === 0) {
        const empty = document.createElement("div");
        empty.className = "tl-empty";
        empty.textContent = "右のスポットをクリック or ドラッグして追加できます";
        wrap.appendChild(empty);
        return wrap;
      }

      const { steps, skipped } = generatePlan(day, dayIdx, totalDays);

      steps.forEach((step, sIdx) => {
        const isLast = sIdx === steps.length - 1;
        const row = document.createElement("div");

        if (step.type === "meet" || step.type === "dismiss") {
          row.className = "tl-row tl-row--anchor";
          const leftEl = document.createElement("div");
          leftEl.className = "tl-left";
          leftEl.innerHTML = `<span class="tl-time">${minutesToTime(step.time)}</span>${!isLast ? '<div class="tl-line"></div>' : ''}`;
          const rightEl = document.createElement("div");
          rightEl.className = "tl-right";

          if (step.hotelNightDayId) {
            // 宿泊先 → クリッカブルなホテルボタン
            const hotel = schedule.hotels?.[step.hotelNightDayId];
            const btn = document.createElement("button");
            btn.type = "button";
            btn.className = "tl-hotel-btn";
            btn.title = "クリックしてホテルを探す・登録する";

            const iconSpan = document.createElement("span");
            iconSpan.textContent = "🏨";
            btn.appendChild(iconSpan);

            if (hotel?.name) {
              const nameSpan = document.createElement("span");
              nameSpan.className = "tl-hotel-name";
              nameSpan.textContent = hotel.name;
              btn.appendChild(nameSpan);
              if (hotel.pricePerPerson || hotel.budget) {
                const budgetSpan = document.createElement("span");
                budgetSpan.className = "tl-hotel-budget";
                budgetSpan.textContent = `¥${Number(hotel.pricePerPerson || hotel.budget).toLocaleString()}/名`;
                btn.appendChild(budgetSpan);
              }
              if (hotel.checkinTime) {
                const timeSpan = document.createElement("span");
                timeSpan.className = "tl-hotel-budget";
                timeSpan.textContent = `${hotel.checkinTime}IN`;
                btn.appendChild(timeSpan);
              }
            } else {
              const findSpan = document.createElement("span");
              findSpan.className = "tl-hotel-find";
              findSpan.textContent = "宿泊先を探す・登録する";
              btn.appendChild(findSpan);
            }

            const chevron = document.createElement("span");
            chevron.className = "tl-hotel-chevron";
            chevron.textContent = "›";
            btn.appendChild(chevron);

            const p = new URLSearchParams({ nightId: step.hotelNightDayId });
            if (step.hotelCheckin)  p.set("checkin",  step.hotelCheckin);
            if (step.hotelCheckout) p.set("checkout", step.hotelCheckout);
            btn.addEventListener("click", () => { location.href = `./hotel.html?${p}`; });
            rightEl.appendChild(btn);
          } else {
            // 集合/解散場所（通常アンカー）
            const dotColor = step.type === "meet" ? "var(--accent-teal, #70d6c5)" : "var(--accent-pink, #ff8fb1)";
            rightEl.innerHTML = `<span class="tl-anchor-dot" style="background:${dotColor}"></span><span class="tl-anchor-name">${escHtml(step.name)}</span>`;
            if (step.anchorSpot?.spotCategory === "airport") {
              const flightBtn = document.createElement("button");
              flightBtn.type = "button";
              flightBtn.className = "tl-hotel-btn tl-flight-btn";
              flightBtn.title = "クリックして航空券を探す・登録する";
              const flightKey = `${step.type}:${step.anchorSpot.id || step.anchorSpot.name}:${day.date || ""}`;
              const flight = schedule.flights?.[flightKey];
              const flightLabel = flight?.flightNumber
                ? `${flight.flightNumber}${flight.pricePerPerson ? ` ¥${Number(flight.pricePerPerson).toLocaleString()}/名` : ""}`
                : "航空券を探す・登録する";
              flightBtn.innerHTML = `<span>✈</span><span class="tl-hotel-find">${escHtml(flightLabel)}</span><span class="tl-hotel-chevron">›</span>`;
              const p = new URLSearchParams({
                role: step.type,
                airport: step.anchorSpot.name || step.name,
                spotId: step.anchorSpot.id || "",
                date: day.date || "",
                time: minutesToTime(step.time),
              });
              flightBtn.addEventListener("click", () => { location.href = `./flight.html?${p}`; });
              rightEl.appendChild(flightBtn);
            }
          }

          row.appendChild(leftEl);
          row.appendChild(rightEl);

        } else if (step.type === "travel") {
          row.className = "tl-row tl-row--transit";
          const leftEl = document.createElement("div");
          leftEl.className = "tl-left";
          leftEl.innerHTML = '<div class="tl-line"></div>';
          const rightEl = document.createElement("div");
          rightEl.className = "tl-right";

          const wrapEl = document.createElement("div");
          wrapEl.className = "tl-transit-wrap";

          const info = step.travelInfo;
          const summarySpan = document.createElement("span");
          summarySpan.className = "tl-transit-label";

          if (info && !info.failed) {
            // 経路取得成功
            if (info.mode === "driving") {
              summarySpan.textContent = `🚗 約${step.duration}分`;
            } else {
              const xfers = info.transfers === 0 ? "乗り換えなし" : `${info.transfers}回乗り換え`;
              summarySpan.textContent = `🚃 約${step.duration}分（${xfers}）`;
            }
            wrapEl.appendChild(summarySpan);
            // セグメント（🚶3分 → 🚇銀座線 → 🚶2分）
            if (info.segments?.length > 0) {
              const segsSpan = document.createElement("span");
              segsSpan.className = "tl-route-segs";
              segsSpan.textContent = info.segments.join(" → ");
              wrapEl.appendChild(segsSpan);
            }
          } else if (info?.failed) {
            // HERE API が返答したが経路なし（対応エリア外など）
            summarySpan.textContent = `⚠ 経路を取得できませんでした${info.error ? `（${info.error}）` : ""}`;
            summarySpan.style.color = "var(--muted)";
            wrapEl.appendChild(summarySpan);
          } else if (step.noCoords) {
            // 座標情報が欠けているため API 呼び出し不可
            summarySpan.textContent = `📍 座標情報がないため経路を取得できません`;
            summarySpan.style.color = "var(--muted)";
            wrapEl.appendChild(summarySpan);
          } else {
            // キャッシュなし＝バックグラウンドで取得中
            summarySpan.textContent = `⏳ 経路取得中...`;
            summarySpan.style.color = "var(--muted)";
            wrapEl.appendChild(summarySpan);
          }

          // Google Maps 経路リンク（両スポットに座標がある場合）
          if (step.fromSpot?.lat && step.toSpot?.lat) {
            const gmLink = document.createElement("a");
            gmLink.href = `https://www.google.com/maps/dir/?api=1&origin=${step.fromSpot.lat},${step.fromSpot.lng}&destination=${step.toSpot.lat},${step.toSpot.lng}&travelmode=${getTravelMode() === "driving" ? "driving" : "transit"}`;
            gmLink.target = "_blank";
            gmLink.rel = "noopener noreferrer";
            gmLink.className = "tl-route-link";
            gmLink.textContent = "🗺 経路";
            wrapEl.appendChild(gmLink);
          }

          rightEl.appendChild(wrapEl);
          row.appendChild(leftEl);
          row.appendChild(rightEl);

        } else if (step.type === "spot") {
          const entry = day.entries.find(en => en.spotId === step.spotId);

          const eIdx = day.entries.indexOf(entry);
          const stayMin = (day.stayTimes && day.stayTimes[entry.spotId]) || 60;

          row.className = "tl-row tl-row--spot";
          row.dataset.spotId = step.spotId;

          const rightEl = document.createElement("div");
          rightEl.className = "tl-right";

          const handle = document.createElement("span");
          handle.className = "tl-drag-handle";
          handle.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" width="11" height="14" viewBox="0 0 10 14" fill="currentColor" aria-hidden="true"><circle cx="3" cy="2" r="1.2"/><circle cx="7" cy="2" r="1.2"/><circle cx="3" cy="7" r="1.2"/><circle cx="7" cy="7" r="1.2"/><circle cx="3" cy="12" r="1.2"/><circle cx="7" cy="12" r="1.2"/></svg>`;

          const dot = document.createElement("span");
          dot.className = "tl-dot";
          dot.style.background = step.color || "var(--accent)";

          nameEl.className = "tl-spot-name";
          nameEl.textContent = step.name;

          const budgetEl = document.createElement("span");
          budgetEl.className = "tl-spot-budget";
          budgetEl.textContent = `¥${Number(step.budget).toLocaleString()}`;

          const hoursWarnEl = document.createElement("span");
          hoursWarnEl.className = "tl-hours-warn";
          hoursWarnEl.textContent = "営業時間外";

          const stayHourInput = document.createElement("input");
          stayHourInput.className = "tl-stay-input tl-stay-hours";
          stayHourInput.type = "number"; stayHourInput.min = "0"; stayHourInput.max = "12"; stayHourInput.step = "1";
          stayHourInput.value = stayParts.hours; stayHourInput.title = "滞在時間（時間）";
          const stayHourSuffix = document.createElement("span");
          stayHourSuffix.className = "tl-stay-suffix";
          stayHourSuffix.textContent = "時間";

          const stayInput = document.createElement("input");
          stayInput.className = "tl-stay-input";
          stayInput.type = "number"; stayInput.min = "0"; stayInput.max = "55"; stayInput.step = "5";
          stayInput.value = stayMin; stayInput.title = "滞在時間（分）";

          const staySuffix = document.createElement("span");
          stayInput.value = stayParts.minutes;
          stayInput.title = "滞在時間（分）";

          if (step.budget) rightEl.appendChild(budgetEl);
          if (step.outsideHours) rightEl.appendChild(hoursWarnEl);
          rightEl.appendChild(stayHourInput);
          rightEl.appendChild(stayHourSuffix);
          rightEl.appendChild(stayInput);

          rightEl.appendChild(upBtn);
          rightEl.appendChild(downBtn);
          rightEl.appendChild(removeBtn);
