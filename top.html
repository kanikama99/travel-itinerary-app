<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="refresh" content="0; url=./index.html" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trip Pop Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #fff3dd;
      --panel: rgba(255, 252, 245, 0.88);
      --line: rgba(166, 97, 54, 0.18);
      --text: #233038;
      --muted: #5f6d73;
      --accent: #ff7a45;
      --accent-deep: #ce5428;
      --accent-light: #ff9a52;
      --accent-soft: rgba(255, 122, 69, 0.14);
      --accent-yellow: #ffd257;
      --accent-pink: #ff8fb1;
      --accent-teal: #70d6c5;
      --shadow: 0 24px 50px rgba(149, 90, 48, 0.16);
      --radius-xl: 30px;
      --radius-lg: 22px;
      --shadow-base-rgb: 149, 90, 48;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Zen Kaku Gothic New", sans-serif;
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at 8% 10%, rgba(255, 210, 87, 0.55), transparent 22%),
        radial-gradient(circle at 92% 14%, rgba(112, 214, 197, 0.34), transparent 20%),
        radial-gradient(circle at 80% 80%, rgba(255, 143, 177, 0.28), transparent 18%),
        radial-gradient(circle at 20% 85%, rgba(255, 122, 69, 0.18), transparent 22%),
        linear-gradient(180deg, #fff8ea 0%, #ffeccd 100%);
    }

    /* 背景の浮かぶ丸 */
    .bg-blob {
      position: fixed;
      border-radius: 50%;
      pointer-events: none;
      animation: float 8s ease-in-out infinite;
    }
    .bg-blob-1 {
      width: 340px; height: 340px;
      top: -80px; left: -80px;
      background: radial-gradient(circle, rgba(255, 210, 87, 0.35) 0%, transparent 70%);
      animation-delay: 0s;
    }
    .bg-blob-2 {
      width: 260px; height: 260px;
      bottom: -60px; right: -40px;
      background: radial-gradient(circle, rgba(112, 214, 197, 0.3) 0%, transparent 70%);
      animation-delay: -3s;
    }
    .bg-blob-3 {
      width: 180px; height: 180px;
      top: 55%; right: 8%;
      background: radial-gradient(circle, rgba(255, 143, 177, 0.25) 0%, transparent 70%);
      animation-delay: -5s;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-18px) scale(1.04); }
    }

    /* メインカード */
    .hero-card {
      position: relative;
      z-index: 1;
      width: min(500px, calc(100% - 40px));
      padding: 52px 44px 48px;
      text-align: center;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius-xl);
      box-shadow: var(--shadow);
      backdrop-filter: blur(16px);
      animation: cardIn 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(28px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)    scale(1); }
    }

    /* ロゴ部分 */
    .logo-wrap {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      animation: cardIn 0.7s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .logo-icon {
      width: 72px;
      height: 72px;
      border-radius: 22px;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 60%, var(--accent-yellow) 100%);
      box-shadow: 0 12px 30px rgba(255, 122, 69, 0.38);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      animation: popIn 0.6s 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) both;
    }

    @keyframes popIn {
      from { opacity: 0; transform: scale(0.6) rotate(-8deg); }
      to   { opacity: 1; transform: scale(1)   rotate(0deg); }
    }

    .logo-eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--accent-deep);
      font-weight: 700;
    }

    .logo-title {
      font-size: clamp(2rem, 7vw, 2.6rem);
      font-weight: 700;
      line-height: 1.1;
      letter-spacing: -0.01em;
      background: linear-gradient(135deg, var(--accent-deep) 0%, var(--accent) 55%, var(--accent-light) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* キャッチコピー */
    .hero-copy {
      font-size: 0.95rem;
      line-height: 1.7;
      color: var(--muted);
      margin-bottom: 40px;
      animation: cardIn 0.7s 0.2s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    /* CTAボタン */
    .cta-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 18px 28px;
      border: none;
      border-radius: 999px;
      font: inherit;
      font-size: 1.08rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      color: #fff9f4;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
      box-shadow: 0 10px 28px rgba(255, 122, 69, 0.4);
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
      animation: cardIn 0.7s 0.3s cubic-bezier(0.22, 1, 0.36, 1) both;
      text-decoration: none;
    }

    .cta-btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 16px 36px rgba(255, 122, 69, 0.48);
    }

    .cta-btn:active {
      transform: translateY(0) scale(0.98);
    }

    .cta-arrow {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.28);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    /* 特徴バッジ */
    .feature-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      margin-top: 28px;
      animation: cardIn 0.7s 0.4s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .feature-pill {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(255, 122, 69, 0.09);
      border: 1px solid rgba(255, 122, 69, 0.2);
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--accent-deep);
    }

    @media (max-width: 480px) {
      .hero-card {
        padding: 40px 28px 36px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-blob bg-blob-1"></div>
  <div class="bg-blob bg-blob-2"></div>
  <div class="bg-blob bg-blob-3"></div>

  <div class="hero-card">
    <div class="logo-wrap">
      <div class="logo-icon">🗺️</div>
      <p class="logo-eyebrow">Travel Spot Organizer</p>
      <h1 class="logo-title">Trip Pop Map</h1>
    </div>

    <p class="hero-copy">
      スポット名や Google Maps URL を登録するだけで<br>
      地図と一覧を自動生成。旅のプランをかんたん整理。
    </p>

    <a href="./bookmarks.html" class="cta-btn">
      <span>作り始める！</span>
      <span class="cta-arrow">
        <svg xmlns="http://www.w3.org/2000/svg" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
      </span>
    </a>

    <div class="feature-pills">
      <span class="feature-pill">📍 スポット登録</span>
      <span class="feature-pill">🗺 自動地図生成</span>
      <span class="feature-pill">🏷 カテゴリ管理</span>
      <span class="feature-pill">📋 リスト切替</span>
    </div>
  </div>

  <script>
    (function() {
      try {
        const sk = JSON.parse(localStorage.getItem("spot-map-settings.v1") || "{}");
        const k = sk.bgTheme || "warm";
        const BGS = {
          warm:     "radial-gradient(circle at 8% 10%, rgba(255,210,87,.55), transparent 22%), radial-gradient(circle at 92% 14%, rgba(112,214,197,.34), transparent 20%), radial-gradient(circle at 80% 80%, rgba(255,143,177,.28), transparent 18%), radial-gradient(circle at 20% 85%, rgba(255,122,69,.18), transparent 22%), linear-gradient(180deg,#fff8ea 0%,#ffeccd 100%)",
          sky:      "radial-gradient(circle at 8% 10%, rgba(135,206,250,.45), transparent 22%), radial-gradient(circle at 92% 14%, rgba(100,180,255,.28), transparent 20%), radial-gradient(circle at 80% 80%, rgba(173,216,230,.25), transparent 18%), linear-gradient(180deg,#eaf5ff 0%,#d0e8ff 100%)",
          mint:     "radial-gradient(circle at 8% 10%, rgba(144,238,144,.4), transparent 22%), radial-gradient(circle at 92% 14%, rgba(100,200,150,.28), transparent 20%), radial-gradient(circle at 80% 80%, rgba(152,251,152,.22), transparent 18%), linear-gradient(180deg,#eafff4 0%,#d0f5e0 100%)",
          lavender: "radial-gradient(circle at 8% 10%, rgba(216,191,255,.45), transparent 22%), radial-gradient(circle at 92% 14%, rgba(180,150,240,.28), transparent 20%), radial-gradient(circle at 80% 80%, rgba(200,170,255,.22), transparent 18%), linear-gradient(180deg,#f4eeff 0%,#e5d8ff 100%)",
          gray:     "radial-gradient(circle at 8% 10%, rgba(200,210,220,.45), transparent 22%), radial-gradient(circle at 92% 14%, rgba(180,190,200,.28), transparent 20%), radial-gradient(circle at 80% 80%, rgba(190,200,210,.22), transparent 18%), linear-gradient(180deg,#f2f4f6 0%,#e4e8ec 100%)",
        };
        const CS = {
          warm:     ["#ff7a45","#ce5428","#ff9a52","rgba(255,122,69,0.12)","rgba(166,97,54,0.2)","rgba(255,252,245,0.88)","0 24px 50px rgba(149,90,48,0.16)","255,122,69","149,90,48"],
          sky:      ["#3b8fd4","#1a6aad","#60aee8","rgba(59,143,212,0.12)","rgba(59,120,200,0.22)","rgba(240,248,255,0.88)","0 24px 50px rgba(30,90,160,0.14)","59,143,212","30,90,160"],
          mint:     ["#2da868","#1a7a48","#52c485","rgba(45,168,104,0.12)","rgba(45,150,90,0.22)","rgba(240,255,248,0.88)","0 24px 50px rgba(30,110,60,0.14)","45,168,104","30,110,60"],
          lavender: ["#8b64cc","#6a45a8","#a884e0","rgba(139,100,204,0.12)","rgba(120,80,200,0.22)","rgba(248,244,255,0.88)","0 24px 50px rgba(90,60,150,0.14)","139,100,204","90,60,150"],
          gray:     ["#7a8a98","#5a6a78","#96a6b4","rgba(122,138,152,0.12)","rgba(100,120,140,0.22)","rgba(245,247,250,0.88)","0 24px 50px rgba(60,80,100,0.14)","122,138,152","60,80,100"],
        };
        document.body.style.background = BGS[k] || BGS.warm;
        const c = CS[k] || CS.warm;
        const r = document.documentElement;
        r.style.setProperty("--accent",       c[0]);
        r.style.setProperty("--accent-deep",  c[1]);
        r.style.setProperty("--accent-light", c[2]);
        r.style.setProperty("--accent-soft",  c[3]);
        r.style.setProperty("--line",         c[4]);
        r.style.setProperty("--panel",        c[5]);
        r.style.setProperty("--shadow",       c[6]);
        r.style.setProperty("--accent-rgb",   c[7]);
        r.style.setProperty("--shadow-base-rgb", c[8]);
      } catch {}
    })();
  </script>
  <script src="./theme.js"></script>
</body>
</html>
