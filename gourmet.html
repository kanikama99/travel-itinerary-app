<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>グルメを見つける - Trip Pop Map</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
  <style>
    .tool-shell { width: min(1080px, calc(100% - 32px)); margin: 0 auto; padding: 40px 0 80px; display: grid; gap: 18px; }
    .tool-eyebrow { font-size: 0.82rem; letter-spacing: 0.16em; text-transform: uppercase; color: var(--accent-deep); font-weight: 700; margin: 0 0 4px; }
    .tool-title { font-size: clamp(1.7rem, 4vw, 2.25rem); margin: 0; }
    .tool-card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; box-shadow: 0 5px 18px rgb(var(--shadow-base-rgb,149,90,48) / 0.10); }
    .control-grid { display: grid; grid-template-columns: 1.4fr 0.8fr 1fr; gap: 12px; align-items: end; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 0.86rem; font-weight: 800; color: var(--accent-deep); }
    .input { font: inherit; border: 1.5px solid var(--line); border-radius: 10px; padding: 9px 12px; background: rgba(255,255,255,0.9); color: var(--text); }
    .suggestions { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
    .food-card { background: rgba(255,255,255,0.55); border: 1px solid rgb(var(--accent-rgb,255,122,69) / 0.18); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
    .food-card h3 { margin: 0; font-size: 1rem; color: var(--accent-deep); }
    .shop-row { display: grid; grid-template-columns: auto 1fr; gap: 8px; align-items: start; font-size: 0.9rem; }
    .shop-row input { margin-top: 3px; }
    .shop-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 5px; }
    .shop-link { color: var(--accent-deep); font-weight: 900; text-decoration: none; font-size: 0.82rem; }
    .shop-link:hover { text-decoration: underline; }
    .hint-text { margin: 0; color: var(--muted); font-size: 0.84rem; line-height: 1.55; }
    .primary-action { border: none; border-radius: 999px; padding: 11px 18px; font: inherit; font-weight: 900; color: #fff; background: linear-gradient(135deg, var(--accent), var(--accent-light)); cursor: pointer; }
    .ghost-action { border: 1.5px solid var(--line); border-radius: 999px; padding: 10px 14px; font: inherit; font-weight: 800; background: rgba(255,255,255,0.72); color: var(--accent-deep); cursor: pointer; }
    .status { color: var(--muted); font-size: 0.88rem; }
    .hamburger-btn { display: flex !important; z-index: 1000; }
    @media (max-width: 720px) { .control-grid { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main class="tool-shell">
    <header>
      <p class="tool-eyebrow">Gourmet Search</p>
      <h1 class="tool-title">グルメを見つける</h1>
    </header>
    <section class="tool-card">
      <div class="control-grid">
        <div class="field"><label for="areaInput">エリア</label><input id="areaInput" class="input" value="" /></div>
        <div class="field"><label for="perThemeInput">各ジャンルの候補数</label><input id="perThemeInput" class="input" type="number" min="1" max="8" value="5" /></div>
        <div class="field"><p class="hint-text">チェックした店だけSPOTSに追加します。まずGoogleで候補を確認できます。</p><button id="generateBtn" class="ghost-action" type="button">候補を作る</button></div>
      </div>
    </section>
    <section class="tool-card">
      <div id="suggestions" class="suggestions"></div>
      <button id="addSelectedBtn" class="primary-action" type="button">選択したグルメをSPOTSに追加</button>
      <p id="status" class="status"></p>
    </section>
    <div class="page-nav page-nav--end"><a href="./schedule.html" class="page-nav-btn page-nav-btn--prev">スケジュールへ戻る</a></div>
  </main>
  <button id="hamburgerBtn" class="hamburger-btn" type="button" aria-label="メニューを開く"><span class="hamburger-line"></span><span class="hamburger-line"></span><span class="hamburger-line"></span></button>
  <div id="drawerBackdrop" class="drawer-backdrop hidden"></div>
  <aside id="sideDrawer" class="side-drawer hidden" aria-hidden="true"><div class="drawer-head"><p class="drawer-kicker">Menu</p></div><nav class="drawer-nav">
    <a href="./bookmarks.html" class="drawer-nav-item"><span class="drawer-nav-icon">📒</span><span>しおりを選ぶ</span></a>
    <a href="./spots.html" class="drawer-nav-item"><span class="drawer-nav-icon">📍</span><span>行きたい場所</span></a>
    <a href="./schedule.html" class="drawer-nav-item"><span class="drawer-nav-icon">📅</span><span>スケジュール</span></a>
    <a href="./flight.html" class="drawer-nav-item"><span class="drawer-nav-icon">✈</span><span>飛行機を見つける</span></a>
    <a href="./tour.html" class="drawer-nav-item"><span class="drawer-nav-icon">🗺</span><span>ツアーを見つける</span></a>
    <a href="./gourmet.html" class="drawer-nav-item drawer-nav-item--active"><span class="drawer-nav-icon">🍜</span><span>グルメを見つける</span></a>
    <a href="./checklist.html" class="drawer-nav-item"><span class="drawer-nav-icon">📋</span><span>持ち物リスト</span></a>
    <a href="./print.html" class="drawer-nav-item"><span class="drawer-nav-icon">🖨</span><span>印刷する</span></a>
    <a href="./settings.html" class="drawer-nav-item"><span class="drawer-nav-icon">⚙</span><span>設定</span></a>
  </nav></aside>
  <script>
    const LISTS_KEY = "spot-map-lists.v1";
    const SETTINGS_KEY = "spot-map-settings.v1";
    function applyTheme(){try{const s=JSON.parse(localStorage.getItem(SETTINGS_KEY)||"{}");const t=[["#fff3dd","#fffaf0","rgba(166,97,54,0.18)","#233038","#5f6d73","#ff7a45","#ce5428","255,122,69","149,90,48"],["#e8f4fd","#f0f8ff","rgba(54,120,166,0.18)","#1a2a3a","#4a6070","#4a9ede","#2d7ab5","74,158,222","45,100,165"],["#f0fdf4","#f7fff9","rgba(54,166,97,0.18)","#1a3323","#3a6050","#34c97a","#1fa85e","52,201,122","30,140,80"],["#fdf0f8","#fff7fd","rgba(166,54,140,0.18)","#2a1a2a","#5f3a5a","#d44ab0","#a83285","212,74,176","140,50,120"],["#fff8f0","#fffaf5","rgba(200,120,40,0.18)","#2a1800","#6a4a20","#e08020","#b05a10","224,128,32","160,80,20"],["#f5f0ff","#faf7ff","rgba(120,80,200,0.18)","#180a2a","#4a3a6a","#8060d0","#6040a8","128,96,208","80,60,150"],["#fff0f0","#fff7f7","rgba(166,54,54,0.18)","#2a0a0a","#6a3a3a","#e05050","#b03030","224,80,80","160,40,40"],["#f0fff8","#f5fffb","rgba(40,160,120,0.18)","#001a12","#1a4a3a","#28c890","#10a870","40,200,144","20,140,90"]][s.bgTheme??0]||[];["--bg","--panel","--line","--text","--muted","--accent","--accent-deep","--accent-rgb","--shadow-base-rgb"].forEach((k,i)=>document.documentElement.style.setProperty(k,t[i]));document.documentElement.style.setProperty("--panel-strong",t[1]);}catch{}}
    const areaMenus = {
      osaka: { match: /大阪|梅田|難波|なんば|心斎橋|道頓堀|新世界|通天閣|ユニバ|USJ/i, label: "大阪", themes: { "お好み焼き":["美津の","福太郎 本店","千房 千日前本店","きじ 梅田スカイビル店","ゆかり 曾根崎本店"], "たこ焼き":["甲賀流 アメリカ村本店","会津屋 本店","わなか 千日前本店","十八番 道頓堀店","くくる 道頓堀本店"], "串カツ":["だるま 新世界総本店","八重勝","てんぐ","近江屋本店","串かつ 越源"], "地元チェーン":["551蓬莱","りくろーおじさんの店","インデアンカレー","どうとんぼり神座","金龍ラーメン"] } },
      sapporo: { match: /札幌|すすきの|大通|北海道|新千歳|小樽/i, label: "札幌", themes: { "札幌ラーメン":["すみれ 札幌中の島本店","麺屋 彩未","けやき すすきの本店","白樺山荘 札幌ら〜めん共和国店","らーめん信玄 南6条店"], "スープカレー":["GARAKU","奥芝商店 駅前創成寺","Suage+ 本店","カレー食堂 心 札幌本店","ピカンティ"], "ジンギスカン":["だるま 5・5店","サッポロビール園","松尾ジンギスカン 札幌駅前店","いただきます。","士別バーベキュー"], "地元チェーン":["みよしの","セイコーマート","どんぐり","175°DENO担担麺","回転寿しトリトン"] } },
      kyoto: { match: /京都|祇園|河原町|嵐山|伏見|清水/i, label: "京都", themes: { "京料理":["祇園 きらら","京菜味 のむら","おめん 銀閣寺本店","いづう","豆水楼 木屋町本店"], "抹茶・甘味":["茶寮都路里 祇園本店","中村藤吉本店 京都駅店","ぎおん徳屋","鍵善良房 四条本店","梅園 河原町店"], "ラーメン":["本家 第一旭 本店","新福菜館 本店","麺屋 猪一","麺屋 極鶏","天下一品 総本店"], "地元チェーン":["餃子の王将","進々堂","マールブランシュ","志津屋","からふね屋珈琲"] } },
      generic: { match: /.*/, label: "旅行先", themes: { "名物グルメ":["ご当地グルメ 人気店","郷土料理 人気店","駅近 ランチ 人気店","地元で人気の定食","夜ごはん 人気店"], "カフェ":["人気カフェ","喫茶店 人気","スイーツ 人気","朝食 カフェ","テイクアウト スイーツ"], "居酒屋":["地元 居酒屋 人気","海鮮居酒屋","焼き鳥 人気","クラフトビール","郷土料理 居酒屋"], "地元チェーン":["地元チェーン 人気","駅ナカ グルメ","ローカルスーパー 惣菜","ベーカリー 人気","回転寿司 人気"] } }
    };
    function makeId(){return `id_${Date.now().toString(36)}_${Math.random().toString(36).slice(2,8)}`;}
    function esc(s){return String(s||"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));}
    function loadActiveContext(){const data=JSON.parse(localStorage.getItem(LISTS_KEY)||"{}");const list=data.lists?.find(l=>l.id===data.activeListId)||data.lists?.[0]||null;return{data,list};}
    function inferArea(){const {list}=loadActiveContext();const text=[list?.name,...(list?.spots||[]).map(s=>s.name),...(list?.spots||[]).map(s=>s.description)].filter(Boolean).join(" ");const found=Object.values(areaMenus).find(m=>m!==areaMenus.generic&&m.match.test(text));return found?.label||"";}
    function getMenuForArea(area){const text=area||"";return Object.values(areaMenus).find(m=>m!==areaMenus.generic&&m.match.test(text))||areaMenus.generic;}
    function render(){const area=document.getElementById("areaInput").value.trim()||inferArea()||"旅行先";document.getElementById("areaInput").value=area;const menu=getMenuForArea(area);const n=Math.max(1,Math.min(8,parseInt(document.getElementById("perThemeInput").value)||5));const box=document.getElementById("suggestions");box.innerHTML="";Object.entries(menu.themes).forEach(([theme,shops])=>{const card=document.createElement("article");card.className="food-card";card.innerHTML=`<h3>${esc(theme)}</h3>`;shops.slice(0,n).forEach(shop=>{const q=`${area} ${shop}`;const row=document.createElement("label");row.className="shop-row";row.innerHTML=`<input type="checkbox" class="shop-check" data-theme="${esc(theme)}" data-name="${esc(shop)}"><span><strong>${esc(shop)}</strong><br><small>${esc(area)}で候補に入れたい${esc(theme)}</small><span class="shop-actions"><a class="shop-link" href="https://www.google.com/search?q=${encodeURIComponent(q)}" target="_blank" rel="noopener">Googleで検索</a></span></span>`;card.appendChild(row);});box.appendChild(card);});document.getElementById("status").textContent=`${esc(area)}向けの候補を表示しています。追加する店にチェックしてください。`;}
    async function geocodeShop(area,shop){const q=`${area} ${shop}`;try{const params=new URLSearchParams({format:"jsonv2",q,limit:"1",countrycodes:"jp",addressdetails:"0"});const res=await fetch(`https://nominatim.openstreetmap.org/search?${params}`,{headers:{"Accept-Language":"ja,en"}});if(!res.ok)return null;const rows=await res.json();const hit=rows?.[0];const lat=parseFloat(hit?.lat),lng=parseFloat(hit?.lon);if(!Number.isFinite(lat)||!Number.isFinite(lng))return null;return{lat,lng,sourceUrl:`https://www.google.com/search?q=${encodeURIComponent(q)}`,sourceQuery:q};}catch{return null;}}
    async function addSelected(){const checked=[...document.querySelectorAll(".shop-check:checked")];const status=document.getElementById("status");if(checked.length===0){status.textContent="追加する店にチェックを入れてください。";return;}const {data,list}=loadActiveContext();if(!list){status.textContent="しおりが見つかりません。";return;}const area=document.getElementById("areaInput").value.trim()||"旅行先";if(!Array.isArray(list.spots))list.spots=[];status.textContent=`${checked.length}件の座標を取得しています...`;document.getElementById("addSelectedBtn").disabled=true;let added=0;let skipped=0;try{for(const ch of checked){const geo=await geocodeShop(area,ch.dataset.name);if(!geo){skipped++;continue;}list.spots.push({id:makeId(),name:ch.dataset.name,description:`${area}の${ch.dataset.theme}候補`,budget:0,type:"spot",spotCategory:"restaurant",defaultStayMinutes:60,lat:geo.lat,lng:geo.lng,sourceType:"gourmet",sourceUrl:geo.sourceUrl,sourceQuery:geo.sourceQuery});added++;}const idx=data.lists.findIndex(l=>l.id===list.id);if(idx>=0)data.lists[idx]=list;localStorage.setItem(LISTS_KEY,JSON.stringify(data));status.textContent=skipped>0?`${added}件のグルメをSPOTSに追加しました。座標が見つからなかった${skipped}件は追加していません。`:`${added}件のグルメをSPOTSに追加しました。`;}finally{document.getElementById("addSelectedBtn").disabled=false;}}
    const hb=document.getElementById("hamburgerBtn"),sd=document.getElementById("sideDrawer"),db=document.getElementById("drawerBackdrop");hb.onclick=()=>{const o=!sd.classList.contains("hidden");sd.classList.toggle("hidden",o);db.classList.toggle("hidden",o);};db.onclick=()=>{sd.classList.add("hidden");db.classList.add("hidden");};
    const initialArea=inferArea();if(initialArea)document.getElementById("areaInput").value=initialArea;document.getElementById("generateBtn").onclick=render;document.getElementById("addSelectedBtn").onclick=addSelected;applyTheme();render();
  </script>
  <script src="./theme.js"></script>
</body>
</html>
